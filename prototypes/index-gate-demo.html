<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>hellotalent.ai — Gate Demo v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200;12..96,400;12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════
   GATE DEMO v2
   Clatu-first, editorial, premium
   Gate logic preserved: left aday / right isveren
   Center-divided decision surface, single screen
   ══════════════════════════════════════════ */

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  background:#0B0D17;
}

:root{
  --verm:#C94E28;
  --verm-soft:#E8845C;
  --navy:#1E2D5E;
  --cream:#F7F6F4;
  --cream-dim:rgba(247,246,244,0.55);
  --cream-rule:rgba(247,246,244,0.07);
  --font-d:'Bricolage Grotesque',sans-serif;
  --font-b:'Plus Jakarta Sans',sans-serif;
  --expo:cubic-bezier(0.16,1,0.3,1);
}

/* ── HEADER ── */
.hdr{
  position:absolute;top:0;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:24px clamp(24px,4vw,48px);
  z-index:30;
}
.logo{
  font-family:var(--font-d);font-weight:800;font-size:18px;
  color:var(--cream);text-decoration:none;letter-spacing:-0.5px;
}
.logo em{font-style:normal;color:var(--verm)}
.login{
  font-size:12px;font-weight:600;color:var(--cream-dim);
  text-decoration:none;padding:7px 18px;border-radius:5px;
  border:1.5px solid var(--cream-rule);
  transition:color .3s,border-color .3s;
}
.login:hover{color:var(--cream);border-color:rgba(247,246,244,0.2)}

/* ── GATE GRID ── */
.gate{
  display:flex;
  height:100vh;
  position:relative;
}

/* Center rule — subtle, structural */
.gate::after{
  content:'';position:absolute;
  top:8%;bottom:8%;left:50%;width:1px;
  background:linear-gradient(180deg,transparent,var(--cream-rule) 25%,var(--cream-rule) 75%,transparent);
  z-index:10;pointer-events:none;
}

/* ── ZONE (shared) ── */
.zone{
  flex:1;position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  justify-content:center;
  text-decoration:none;cursor:pointer;
  transition:background .5s ease;
}
.zone:hover .ct{border-bottom-color:currentColor}
.zone--a:hover .il{transform:translateY(-4px);opacity:1}
.zone--i:hover .il{transform:scaleX(-1) translateY(-4px);opacity:1}

/* ── ADAY ── */
.zone--a{
  padding:0 clamp(32px,4.5vw,72px);
  background:linear-gradient(170deg,#100E16 0%,#0B0D17 100%);
}
.zone--a:hover{
  background:linear-gradient(170deg,#14111E 0%,#0D0F1B 100%);
}

/* ── ISVEREN ── */
.zone--i{
  padding:0 clamp(32px,4.5vw,72px);
  align-items:flex-end;text-align:right;
  background:linear-gradient(190deg,#0E1020 0%,#0B0D17 100%);
}
.zone--i:hover{
  background:linear-gradient(190deg,#121428 0%,#0D0F1B 100%);
}

/* ── EYEBROW ── */
.ey{
  font-family:var(--font-b);font-size:10px;font-weight:700;
  letter-spacing:4px;text-transform:uppercase;
  margin-bottom:18px;
}
.zone--a .ey{color:rgba(201,78,40,0.55)}
.zone--i .ey{color:rgba(107,130,196,0.50)}

/* ── HEADING ── */
.hd{
  font-family:var(--font-d);font-weight:800;
  font-size:clamp(36px,5vw,62px);
  line-height:0.93;letter-spacing:-2.5px;
  color:var(--cream);
  margin-bottom:20px;
}
.hd .v{color:var(--verm)}
.hd .n{color:#6B82C4}

/* ── SUBTEXT ── */
.sb{
  font-size:14px;line-height:1.7;
  color:var(--cream-dim);
  max-width:280px;
  margin-bottom:32px;
}
.zone--i .sb{margin-left:auto}

/* ── CTA ── */
.ct{
  display:inline-block;
  font-family:var(--font-b);font-size:13px;font-weight:700;
  letter-spacing:0.3px;text-decoration:none;
  padding-bottom:4px;
  border-bottom:2px solid transparent;
  transition:border-color .35s ease;
}
.zone--a .ct{color:var(--verm);border-bottom-color:rgba(201,78,40,0.2)}
.zone--i .ct{color:#8B9CC5;border-bottom-color:rgba(139,156,197,0.15)}

/* ── ILLUSTRATIONS ── */
.il{
  position:absolute;
  width:clamp(240px,26vw,400px);
  height:auto;object-fit:contain;
  pointer-events:none;z-index:2;
  transition:transform .7s var(--expo),opacity .5s ease;
  opacity:0.88;
}
.zone--a .il{
  bottom:-4px;
  right:clamp(-10px,1vw,32px);
}
.zone--i .il{
  bottom:-4px;
  left:clamp(-10px,1vw,32px);
  transform:scaleX(-1);
}

/* ── AMBIENT COLOR WASH ──
   Very subtle radial tint per side.
   Not a glow effect — a color temperature shift. */
.zone--a::before{
  content:'';position:absolute;
  bottom:0;right:0;
  width:60%;height:50%;
  background:radial-gradient(ellipse at 80% 100%,rgba(201,78,40,0.06),transparent 70%);
  pointer-events:none;z-index:0;
}
.zone--i::before{
  content:'';position:absolute;
  bottom:0;left:0;
  width:60%;height:50%;
  background:radial-gradient(ellipse at 20% 100%,rgba(30,45,94,0.08),transparent 70%);
  pointer-events:none;z-index:0;
}

/* ── FOOTER ── */
.ft{
  position:absolute;bottom:0;left:0;right:0;
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:14px;font-size:9px;
  color:rgba(247,246,244,0.15);
  letter-spacing:0.5px;text-transform:uppercase;
  z-index:20;
}
/* ── ENTRANCE ── */
@keyframes up{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes ilUp{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:0.88;transform:translateY(0)}
}
@keyframes ilUpFlip{
  from{opacity:0;transform:scaleX(-1) translateY(24px)}
  to{opacity:0.88;transform:scaleX(-1) translateY(0)}
}

.ey{animation:up .55s ease-out .06s both}
.hd{animation:up .55s ease-out .13s both}
.sb{animation:up .55s ease-out .20s both}
.ct{animation:up .55s ease-out .27s both}
.zone--a .il{animation:ilUp .8s var(--expo) .18s both}
.zone--i .il{animation:ilUpFlip .8s var(--expo) .26s both}
.hdr{animation:fi .4s ease-out .05s both}
.ft{animation:fi .4s ease-out .4s both}

@media(prefers-reduced-motion:reduce){
  .ey,.hd,.sb,.ct,.il,.hdr,.ft{animation:none!important;opacity:1!important}
  .zone,.il{transition:none!important}
}

/* ══ TABLET ══ */
@media(max-width:900px){
  .gate{flex-direction:column}
  .gate::after{
    top:50%;bottom:auto;left:8%;right:8%;
    width:84%;height:1px;
    background:linear-gradient(90deg,transparent,var(--cream-rule) 25%,var(--cream-rule) 75%,transparent);
  }
  .zone--i{align-items:flex-start;text-align:left}
  .zone--i .sb{margin-left:0}
  .hd{font-size:clamp(32px,7vw,46px);letter-spacing:-2px}
  .il{width:clamp(170px,30vw,240px)}
  .zone--a .il{right:8px}
  .zone--i .il{left:auto;right:8px;transform:scaleX(-1)}
}

/* ══ MOBILE ══ */
@media(max-width:600px){
  html,body{overflow:auto}
  .gate{height:auto;min-height:100vh;min-height:100dvh}
  .zone{
    min-height:50vh;min-height:50dvh;
    padding:0 24px;
    justify-content:flex-start;
    padding-top:clamp(76px,13vh,110px);
  }
  .hd{font-size:clamp(28px,8.5vw,40px);letter-spacing:-1.5px;margin-bottom:14px}
  .ey{margin-bottom:12px;font-size:9px;letter-spacing:3px}
  .sb{font-size:13px;max-width:260px;margin-bottom:22px}
  .il{width:clamp(140px,40vw,200px);bottom:0}
  .hdr{padding:16px 18px}
  .logo{font-size:16px}
  .login{font-size:11px;padding:5px 12px}
  .ft{position:relative;padding:16px;font-size:8px}
}

/* ══ SMALL MOBILE ══ */
@media(max-width:380px){
  .zone{min-height:48vh;padding-top:68px}
  .hd{font-size:24px;letter-spacing:-1px}
  .il{width:clamp(110px,36vw,160px)}
  .sb{font-size:12px;max-width:220px}
}
</style>
</head>
<body>

<header class="hdr">
  <a class="logo" href="index.html">hello<em>talent</em></a>
  <a class="login" href="giris.html">Giriş Yap</a>
</header>

<main class="gate">

  <a class="zone zone--a" href="aday.html">
    <span class="ey">Adaylar</span>
    <h2 class="hd">Sonraki<br><span class="v">adımın</span><br>burada</h2>
    <p class="sb">Perakende kariyerini tek bir profille yönet. Sektördeki güçlü markalar seni bulsun.</p>
    <span class="ct">Profil oluştur</span>
    <img class="il" src="../assets/gate/gate-aday-final.svg" alt="Perakende sektöründe kariyer arayan aday" width="400" height="400" loading="eager">
  </a>

  <a class="zone zone--i" href="isveren.html">
    <span class="ey">İşverenler</span>
    <h2 class="hd">Doğru<br><span class="n">yeteneği</span><br>şimdi bul</h2>
    <p class="sb">Sektöre özel aday havuzuna eriş. Filtrele, incele, hemen iletişime geç.</p>
    <span class="ct">Aday havuzuna gir</span>
    <img class="il" src="../assets/gate/gate-isveren-final.svg" alt="Perakende sektöründe yetenek arayan işveren" width="400" height="400" loading="eager">
  </a>

</main>

<footer class="ft">
  <span>hellotalent.ai</span>
</footer>

</body>
</html>
