<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://browser.sentry-cdn.com https://www.googletagmanager.com https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://cpwibefquojehjehtrog.supabase.co https://*.googleusercontent.com; connect-src 'self' https://cpwibefquojehjehtrog.supabase.co https://*.google-analytics.com https://*.sentry.io; object-src 'none'; base-uri 'self'; frame-ancestors 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hellotalent.ai</title>
<meta name="robots" content="noindex, nofollow">
<script>(function(){var k='ht_theme_preference',s;try{s=localStorage.getItem(k)}catch(e){}var d=(s==='dark'||(s!=='light'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches));document.documentElement.setAttribute('data-theme',d?'dark':'light');})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --verm: #C94E28;
    --verm-dark: #b84420;
    --navy: #1E2D5E;
    --muted: #6B7280;
    --border: #E5E3DF;
    --text: #111111;
    --text-sm: 11px;
    --text-md: 13px;
    --text-lg: 14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Plus Jakarta Sans',sans-serif;
    background:var(--navy);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    position:relative;
    overflow:hidden;
  }
  /* Arka plan doku */
  body::before{
    content:'';
    position:absolute;
    inset:0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 20%, rgba(201,78,40,0.15) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 80% 80%, rgba(255,255,255,0.04) 0%, transparent 60%);
  }
  body::after{
    content:'✦';
    position:absolute;
    font-size:400px;
    color:rgba(255,255,255,0.025);
    right:-80px;
    bottom:-80px;
    line-height:1;
    pointer-events:none;
  }
  .card{
    background:white;
    border-radius:20px;
    padding:40px 36px;
    width:100%;
    max-width:380px;
    position:relative;
    z-index:1;
    box-shadow:0 24px 80px rgba(0,0,0,0.3);
  }
  .logo{
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:800;
    font-size:22px;
    color:var(--navy);
    margin-bottom:6px;
  }
  .logo span{color:var(--verm);}
  .subtitle{
    font-size:var(--text-md);
    color:var(--muted);
    margin-bottom:32px;
    line-height:1.5;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:var(--text-sm);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:10px;
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:var(--text-lg);
    color:var(--text);
    outline:none;
    transition:border-color 0.2s;
  }
  .field input:focus{border-color:var(--navy);}
  .btn{
    width:100%;
    padding:14px;
    background:var(--verm);
    border:none;
    border-radius:10px;
    color:white;
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:all 0.2s;
    margin-top:8px;
  }
  .btn:hover{background:var(--verm-dark);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .error{
    display:none;
    background:#FEF2F2;
    border:1px solid #FECACA;
    color:#DC2626;
    padding:10px 14px;
    border-radius:8px;
    font-size:var(--text-md);
    margin-top:12px;
    text-align:center;
    font-weight:600;
  }
  .error.show{display:block;}
  .footer-note{
    margin-top:20px;
    font-size:var(--text-sm);
    color:#9CA3AF;
    text-align:center;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-6px);}
    40%{transform:translateX(6px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(4px);}
  }
  .shake{animation:shake 0.4s ease;}

  /* ── DARK MODE ── */
  html[data-theme="dark"] body{background:#020617;}
  html[data-theme="dark"] .card{background:#111827;box-shadow:0 24px 80px rgba(0,0,0,0.6);}
  html[data-theme="dark"] .logo{color:#E5E7EB;}
  html[data-theme="dark"] .subtitle{color:#9CA3AF;}
  html[data-theme="dark"] .field label{color:#9CA3AF;}
  html[data-theme="dark"] .field input{background:#020617;border-color:#374151;color:#F9FAFB;}
  html[data-theme="dark"] .field input::placeholder{color:#4B5563;}
  html[data-theme="dark"] .field input:focus{border-color:#6366F1;}
  html[data-theme="dark"] .error{background:rgba(220,38,38,0.15);border-color:rgba(220,38,38,0.35);color:#FCA5A5;}
  html[data-theme="dark"] .footer-note{color:#6B7280;}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo">hello<span>talent</span>.ai</div>
  <p class="subtitle">Bu alan geliştirme aşamasındadır.<br>Devam etmek için giriş yapınız.</p>

  <div class="field">
    <label for="username">Kullanıcı Adı</label>
    <input type="text" id="username" placeholder="kullanıcı adı" autocomplete="username" onkeydown="if(event.key==='Enter')tryLogin()">
  </div>
  <div class="field">
    <label for="password">Şifre</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')tryLogin()">
  </div>

  <button class="btn" onclick="tryLogin()">Giriş Yap →</button>
  <div class="error" id="error-msg">Kullanıcı adı veya şifre hatalı.</div>
  <p class="footer-note">Yetkisiz erişim yasaktır.</p>
</div>

<script>
  // Zaten giriş yapılmışsa direkt geç
  if (sessionStorage.getItem('ht_gate') === 'ok') {
    window.location.replace('index.html');
  }

  // Kimlik bilgileri — deploy öncesi değiştir
  const CREDENTIALS = {
    'hellotalent': 'ht2026dev'
  };

  function tryLogin() {
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value;

    if (CREDENTIALS[user] && CREDENTIALS[user] === pass) {
      sessionStorage.setItem('ht_gate', 'ok');
      document.querySelector('.btn').textContent = '✓ Yönlendiriliyor...';
      setTimeout(() => window.location.replace('index.html'), 400);
    } else {
      const errEl = document.getElementById('error-msg');
      const card = document.getElementById('card');
      errEl.classList.add('show');
      card.classList.add('shake');
      setTimeout(() => card.classList.remove('shake'), 400);
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }
  }

  document.getElementById('username').focus();
</script>
</body>
</html>
