name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:       # Manual trigger — needed for on-demand Smoke E2E

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p3-regression:
    name: P3 Regression Guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run P3 regression guards
        run: npm run test:p3

  profil-delegation:
    name: Profil panel delegation guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run profil delegation guard (static)
        run: npm run test:profil-delegation

  smoke:
    name: "Smoke E2E (Manual only)"
    runs-on: ubuntu-latest
    # Live smoke suite hits production — only run on manual dispatch to avoid
    # noisy failure emails on every push to main.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        run: npm run test:smoke
