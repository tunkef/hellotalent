<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yetkinliklerim — Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--verm:#C94E28;--navy:#1E2D5E;--bg:#F7F6F4;--border:#E5E3DF;--muted:#6B7280;--text:#111111}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);min-height:100vh;padding:24px 16px}
.wrap{max-width:900px;margin:0 auto}
.yk-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:10px}
.yk-title{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700;color:var(--navy)}
.yk-sub{font-size:13px;color:var(--muted);margin-top:3px}
.yk-tier-toggle{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);border-radius:20px;padding:3px 6px}
.yk-tier-btn{padding:5px 14px;border-radius:16px;border:none;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:500;transition:all .2s}
.yk-tier-btn.active{background:var(--navy);color:#fff}
.yk-tier-btn:not(.active){background:transparent;color:var(--muted)}

/* SEARCH AREA */
.search-section{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:20px;margin-bottom:24px}
.search-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.search-title{font-family:'Bricolage Grotesque',sans-serif;font-size:15px;font-weight:600;color:var(--navy)}
.search-badge{background:#EEF2FF;color:var(--navy);font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;letter-spacing:.3px}
.search-bar{display:flex;gap:8px}
.search-input{flex:1;height:40px;border:1.5px solid var(--border);border-radius:10px;padding:0 14px;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;color:var(--text);outline:none;transition:border-color .2s;background:#fff}
.search-input:focus{border-color:var(--navy)}
.search-input::placeholder{color:#9CA3AF}
.search-btn{height:40px;padding:0 18px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .2s;display:flex;align-items:center;gap:6px;white-space:nowrap}
.search-btn:hover{opacity:.9}
.search-hints{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hint-chip{padding:4px 10px;background:var(--bg);border:1px solid var(--border);border-radius:12px;font-size:11px;color:var(--muted);cursor:pointer;transition:all .15s}
.hint-chip:hover{border-color:var(--verm);color:var(--verm);background:#FEF3F0}
.search-result{margin-top:14px;padding:14px;background:var(--bg);border-radius:10px;display:none}
.search-result.show{display:block}
.sr-role{font-family:'Bricolage Grotesque',sans-serif;font-size:14px;font-weight:600;color:var(--navy);margin-bottom:10px}
.sr-comps{display:flex;flex-wrap:wrap;gap:6px}
.sr-comp{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:10px;font-size:11px;font-weight:600}
.sr-comp.core{background:#FEF3F0;color:var(--verm);border:1px solid #F9C3B3}
.sr-comp.important{background:#EEF2FF;color:var(--navy);border:1px solid #C7D2FE}
.sr-comp.nice{background:#F3F4F6;color:var(--muted);border:1px solid var(--border)}
.sr-empty{font-size:13px;color:var(--muted);text-align:center;padding:10px 0}

/* FREEMIUM HERO */
.freemium-hero{background:linear-gradient(135deg,#2A3F7A 0%,var(--navy) 50%,#162247 100%);border-radius:16px;padding:24px;margin-bottom:20px;position:relative;overflow:hidden}
.fh-deco{position:absolute;top:-30px;right:-30px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.04);pointer-events:none}
.fh-deco2{position:absolute;bottom:-40px;right:60px;width:100px;height:100px;border-radius:50%;background:rgba(201,78,40,.12);pointer-events:none}
.fh-tag{display:inline-flex;align-items:center;gap:5px;background:rgba(201,78,40,.2);border:1px solid rgba(201,78,40,.4);border-radius:12px;padding:4px 10px;font-size:11px;font-weight:600;color:#FCA47A;margin-bottom:12px}
.fh-role{font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:700;color:#fff;margin-bottom:6px;line-height:1.3}
.fh-msg{font-size:13px;color:rgba(255,255,255,.65);line-height:1.6;max-width:480px;margin-bottom:18px}
.fh-msg strong{color:rgba(255,255,255,.9)}
.fh-actions{display:flex;gap:10px;flex-wrap:wrap}
.fh-btn-primary{padding:9px 20px;background:var(--verm);color:#fff;border:none;border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .2s}
.fh-btn-primary:hover{opacity:.9}
.fh-btn-secondary{padding:9px 20px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:background .2s}
.fh-btn-secondary:hover{background:rgba(255,255,255,.15)}
.fh-stats{display:flex;gap:20px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
.fh-stat{text-align:left}
.fh-stat-num{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;color:#fff}
.fh-stat-label{font-size:11px;color:rgba(255,255,255,.5);margin-top:1px}

/* PREMIUM SUMMARY */
.summary-card{background:var(--navy);border-radius:16px;padding:20px 24px;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.summary-stats{display:flex;gap:24px}
.stat-item{text-align:center}
.stat-num{font-family:'DM Mono',monospace;font-size:24px;font-weight:500}
.stat-label{font-size:11px;opacity:.6;margin-top:2px}
.stat-strong .stat-num{color:#4ADE80}
.stat-growing .stat-num{color:#FCD34D}
.stat-unknown .stat-num{color:#94A3B8}
.progress-track{height:5px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden;width:220px;margin-top:10px}
.progress-fill{height:100%;background:#fff;border-radius:3px;transition:width .4s ease}

/* ROLE SELECTOR */
.section-label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px}
.role-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.role-pill{padding:7px 16px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;color:var(--text)}
.role-pill.active{border-color:var(--verm);background:#FEF3F0;color:var(--verm)}
.role-pill:hover:not(.active){border-color:#C4B5B0}

/* CARDS */
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px;margin-bottom:20px}
.comp-card{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:16px;transition:border-color .2s;position:relative;overflow:hidden}
.comp-card:hover{border-color:#C4B5B0}
.comp-card.rated-strong{border-color:#15803D;background:#F0FDF4}
.comp-card.rated-growing{border-color:#B45309;background:#FFFBEB}
.comp-card.rated-unknown{border-color:#6B7280;background:#F9FAFB}
.lock-overlay{position:absolute;inset:0;background:rgba(247,246,244,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:12px;backdrop-filter:blur(3px)}
.lock-icon{width:32px;height:32px;background:var(--navy);border-radius:50%;display:flex;align-items:center;justify-content:center}
.lock-label{font-size:11px;font-weight:600;color:var(--navy);text-align:center;line-height:1.4}
.comp-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.comp-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.comp-icon svg{width:18px;height:18px}
.comp-name{font-family:'Bricolage Grotesque',sans-serif;font-size:14px;font-weight:600;color:var(--navy);line-height:1.3}
.comp-kf{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:2px}
.comp-desc{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:12px}
.comp-weight{display:inline-block;font-size:10px;font-weight:600;padding:2px 9px;border-radius:10px;margin-bottom:10px}
.comp-weight.core{background:#FEF3F0;color:var(--verm)}
.comp-weight.important{background:#EEF2FF;color:var(--navy)}
.comp-weight.nice{background:#F3F4F6;color:var(--muted)}
.rating-btns{display:flex;gap:6px}
.rating-btn{flex:1;padding:7px 4px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;font-family:'Plus Jakarta Sans',sans-serif;color:var(--muted)}
.rating-btn:hover{border-color:#C4B5B0}
.rating-btn.strong.active{background:#DCFCE7;border-color:#15803D;color:#15803D}
.rating-btn.growing.active{background:#FEF3C7;border-color:#B45309;color:#B45309}
.rating-btn.unknown.active{background:#F1F5F9;border-color:#475569;color:#475569}
.upgrade-cta{background:var(--verm);border:none;border-radius:10px;padding:10px 20px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:opacity .2s;white-space:nowrap}
.upgrade-cta:hover{opacity:.9}
.next-card{background:#fff;border:1.5px solid var(--navy);border-radius:14px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.premium-badge{background:var(--navy);color:#fff;font-size:10px;font-weight:700;padding:3px 10px;border-radius:10px;letter-spacing:.5px;display:inline-block;margin-bottom:6px}
.dashed-card{background:#fff;border:1.5px dashed #C4B5B0;border-radius:14px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="yk-header">
    <div>
      <div class="yk-title">Yetkinliklerim</div>
      <div class="yk-sub">Retail pozisyonlarına özel yetkinlik haritası</div>
    </div>
    <div class="yk-tier-toggle">
      <span style="font-size:11px;color:var(--muted);padding:0 4px">Görünüm:</span>
      <button class="yk-tier-btn active" onclick="setTier('freemium',this)">Freemium</button>
      <button class="yk-tier-btn" onclick="setTier('premium',this)">Premium</button>
    </div>
  </div>

  <!-- SEARCH SECTION -->
  <div class="search-section">
    <div class="search-top">
      <div class="search-title">Pozisyon Ara</div>
      <span class="search-badge">RETAIL YETKİNLİK REHBER</span>
    </div>
    <div class="search-bar">
      <input class="search-input" id="searchInput" placeholder="Pozisyon ara... örn: Satış Danışmanı, Mağaza Müdürü, VM" oninput="onSearchInput(this.value)" onkeydown="if(event.key==='Enter')doSearch()">
      <button class="search-btn" onclick="doSearch()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Ara
      </button>
    </div>
    <div class="search-hints">
      <span class="hint-chip" onclick="quickSearch('Kasiyer')">Kasiyer</span>
      <span class="hint-chip" onclick="quickSearch('Satış Danışmanı')">Satış Danışmanı</span>
      <span class="hint-chip" onclick="quickSearch('Kat Müdürü')">Kat Müdürü</span>
      <span class="hint-chip" onclick="quickSearch('Mağaza Müdürü')">Mağaza Müdürü</span>
      <span class="hint-chip" onclick="quickSearch('Bölge Müdürü')">Bölge Müdürü</span>
      <span class="hint-chip" onclick="quickSearch('Visual Merchandiser')">Visual Merchandiser</span>
      <span class="hint-chip" onclick="quickSearch('Eğitim Uzmanı')">Eğitim Uzmanı</span>
    </div>
    <div class="search-result" id="searchResult"></div>
  </div>

  <div id="summaryWrap"></div>

  <div id="roleSelectorWrap"></div>

  <div class="section-label" id="gridLabel">Yetkinlik değerlendirmesi</div>
  <div class="comp-grid" id="compGrid"></div>
  <div id="bottomCard"></div>
</div>

  'Bölge Müdürü':{level:'Üst',comps:[
    {code:'dr',name:'Sonuç Odaklılık',kf:'Drives Results',desc:'Bölge bazında tutarlı büyüme sağlar.',weight:'core',icon:'bolt'},
    {code:'ea',name:'Sorumluluk Alma',kf:'Ensures Accountability',desc:'Mağaza müdürlerine hesap verebilirlik kültürü kazandırır.',weight:'core',icon:'check'},
    {code:'dt',name:'Yetenek Geliştirme',kf:'Develops Talent',desc:'Bölgedeki yöneticileri geliştirip büyütür.',weight:'core',icon:'star'},
    {code:'sm',name:'Stratejik Bakış',kf:'Strategic Mindset',desc:'Kısa vadeli operasyonu uzun vadeli stratejiyle dengeler.',weight:'core',icon:'chart'},
    {code:'cf',name:'Müşteri Odaklılık',kf:'Customer Focus',desc:'Müşteri deneyimini bölge standartlarına taşır.',weight:'core',icon:'eye'},
    {code:'bt',name:'Ekip Kurma',kf:'Builds Effective Teams',desc:'Güçlü bölge ekibi inşa eder.',weight:'important',icon:'team'},
    {code:'pa',name:'Planlama & Önceliklendirme',kf:'Plans and Aligns',desc:'Bölge hedeflerini kaynakla uyumlu planlar.',weight:'important',icon:'arrow'},
    {code:'de',name:'Motivasyon & Bağlılık',kf:'Drives Engagement',desc:'Mağaza ekiplerinin bağlılığını yüksek tutar.',weight:'important',icon:'heart'},
    {code:'co',name:'Takım Çalışması',kf:'Collaborates',desc:'Mağaza müdürleri arası iş birliğini teşvik eder.',weight:'important',icon:'team'},
    {code:'fa',name:'Finansal Okuryazarlık',kf:'Financial Acumen',desc:'Bölge P&L\'ini yönetir.',weight:'nice',icon:'chart'},
  ]},
};

// Arama için alias mapping
const SEARCH_ALIASES={
  'kasiyer':'Kasiyer','cashier':'Kasiyer',
  'satış danışmanı':'Satış Danışmanı','satiş danışmanı':'Satış Danışmanı','sales associate':'Satış Danışmanı','satış':'Satış Danışmanı',
  'kıdemli satış':'Kıdemli Satış Danışmanı','senior sales':'Kıdemli Satış Danışmanı',
  'kat müdürü':'Kat Müdürü','floor lead':'Kat Müdürü','shift manager':'Kat Müdürü','floor manager':'Kat Müdürü',
  'mağaza müdür yardımcısı':'Mağaza Müdür Yrd.','asm':'Mağaza Müdür Yrd.','assistant store manager':'Mağaza Müdür Yrd.',
  'mağaza müdürü':'Mağaza Müdürü','store manager':'Mağaza Müdürü',
  'visual merchandiser':'Visual Merchandiser','vm':'Visual Merchandiser','görsel satış':'Visual Merchandiser','görsel':'Visual Merchandiser',
  'eğitim uzmanı':'Eğitim Uzmanı','training specialist':'Eğitim Uzmanı','eğitim':'Eğitim Uzmanı',
  'bölge müdürü':'Bölge Müdürü','area manager':'Bölge Müdürü','bölge':'Bölge Müdürü',
};

const MOTIVATIONAL_MSG={
  'Giriş': {emoji:'🌱', title:'Rolünde en iyisi ol', msg:'Her büyük kariyer bir yerden başlar. <strong>Senin sahada yarattığın fark</strong>, hem müşteri deneyimini hem de kendi geleceğini şekillendirir. Bu yetkinlikler, %{role}% rolünde öne çıkmanı sağlayacak temel beceriler.'},
  'Giriş-Orta': {emoji:'⚡', title:'Bir sonraki seviyeye adım at', msg:'Temel yetkinliklerini sağlamlaştırdın, şimdi sıra öne çıkmaya. <strong>%{role}% olarak</strong> ekibine katkın ve müşteriye kattığın değer seni bir üst role taşır.'},
  'Orta': {emoji:'🎯', title:'Uzmanlığını derinleştir', msg:'Bu seviyede fark yaratan <strong>teknik derinlik ve insan yönetimi becerisi</strong>. %{role}% olarak hem performansın hem de etrafındakilere kattığın değer kariyer rotanı belirler.'},
  'Orta-Üst': {emoji:'🏆', title:'Liderliğini kanıtla', msg:'Artık sadece kendi performansın değil, <strong>takımının başarısı da senin başarın</strong>. %{role}% seviyesinde doğru yetkinlik kombinasyonu seni üst yönetime taşır.'},
  'Üst': {emoji:'🚀', title:'Vizyonunu sahaya yansıt', msg:'Bu seviyede liderler <strong>strateji ile operasyonu bir arada yürütür</strong>. %{role}% olarak kurumuna kattığın değer hem sayılar hem de insan gelişimiyle ölçülür.'},
};

const ICONS={
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
  msg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
  team:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  bolt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="white"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4" fill="none" stroke="white" stroke-width="2"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
};
const ICON_COLOR={core:'#C94E28',important:'#1E2D5E',nice:'#6B7280'};
const ICON_BG={core:'#FEF3F0',important:'#EEF2FF',nice:'#F3F4F6'};
const WT={core:'Temel yetkinlik',important:'Önemli yetkinlik',nice:'Faydalı yetkinlik'};

let role='Satış Danışmanı', tier='freemium', ratings={};
const FREE_LIMIT=2;

function setTier(t,btn){
  tier=t;
  document.querySelectorAll('.yk-tier-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function setRole(r){role=r;render();}
function rate(code,rating){
  if(tier==='freemium')return;
  const k=role+'_'+code;
  ratings[k]=ratings[k]===rating?null:rating;
  render();
}
function gr(code){return ratings[role+'_'+code]||null;}

function quickSearch(q){
  document.getElementById('searchInput').value=q;
  doSearch();
}

function onSearchInput(val){
  if(!val.trim()){
    const el=document.getElementById('searchResult');
    el.classList.remove('show');
  }
}

function doSearch(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  const resultEl=document.getElementById('searchResult');
  if(!q){resultEl.classList.remove('show');return;}

  // Fuzzy match
  let found=null;
  // Direct alias
  if(SEARCH_ALIASES[q]){found=SEARCH_ALIASES[q];}
  // Partial match
  if(!found){
    for(const [alias,roleName] of Object.entries(SEARCH_ALIASES)){
      if(alias.includes(q)||q.includes(alias)){found=roleName;break;}
    }
  }
  // Role name partial
  if(!found){
    for(const roleName of Object.keys(ROLES)){
      if(roleName.toLowerCase().includes(q)){found=roleName;break;}
    }
  }

  if(found&&ROLES[found]){
    const comps=ROLES[found].comps;
    const level=ROLES[found].level;
    resultEl.innerHTML=`
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px">
        <div class="sr-role">${found} <span style="font-size:11px;font-weight:400;color:var(--muted);margin-left:6px">${level} seviye · ${comps.length} yetkinlik</span></div>
        <button onclick="setRole('${found}');document.getElementById('searchResult').classList.remove('show');window.scrollTo({top:300,behavior:'smooth'})" style="font-size:12px;font-weight:600;color:var(--verm);background:none;border:none;cursor:pointer;padding:4px 0">Bu role geç →</button>
      </div>
      <div class="sr-comps">
        ${comps.map(c=>`<span class="sr-comp ${c.weight}"><span style="margin-right:2px">${c.weight==='core'?'◆':c.weight==='important'?'◇':'·'}</span>${c.name}</span>`).join('')}
      </div>`;
    resultEl.classList.add('show');
  } else {
    resultEl.innerHTML=`<div class="sr-empty">Sonuç bulunamadı — "${document.getElementById('searchInput').value}" için retail yetkinlik haritamızda eşleşme yok. Yukarıdaki önerilerden birini dene.</div>`;
    resultEl.classList.add('show');
  }
}

function render(){
  const comps=ROLES[role].comps;
  const level=ROLES[role].level;
  const total=comps.length;
  const rated=comps.filter(c=>gr(c.code)).length;
  const strong=comps.filter(c=>gr(c.code)==='strong').length;
  const growing=comps.filter(c=>gr(c.code)==='growing').length;
  const unknown=comps.filter(c=>gr(c.code)==='unknown').length;
  const pct=Math.round(rated/total*100);
  const isPrem=tier==='premium';
  const mot=MOTIVATIONAL_MSG[level]||MOTIVATIONAL_MSG['Giriş'];

  // SUMMARY
  if(isPrem){
    document.getElementById('summaryWrap').innerHTML=`
    <div class="summary-card">
      <div>
        <div style="font-size:12px;opacity:.6;margin-bottom:4px">Değerlendirme ilerlemesi — ${role}</div>
        <div style="font-size:14px;font-weight:600">${rated} / ${total} yetkinlik değerlendirildi</div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="summary-stats">
        <div class="stat-item stat-strong"><div class="stat-num">${strong}</div><div class="stat-label">Güçlü</div></div>
        <div class="stat-item stat-growing"><div class="stat-num">${growing}</div><div class="stat-label">Gelişiyor</div></div>
        <div class="stat-item stat-unknown"><div class="stat-num">${unknown}</div><div class="stat-label">Belirsiz</div></div>
      </div>
    </div>`;
    document.getElementById('roleSelectorWrap').innerHTML=`
    <div class="section-label">Rol seç</div>
    <div class="role-bar">${Object.keys(ROLES).map(r=>`<button class="role-pill${r===role?' active':''}" onclick="setRole('${r}')">${r}</button>`).join('')}</div>`;
  } else {
    // FREEMIUM HERO
    const msgText=mot.msg.replace(/%\{role\}%/g,role);
    document.getElementById('summaryWrap').innerHTML=`
    <div class="freemium-hero">
      <div class="fh-deco"></div>
      <div class="fh-deco2"></div>
      <div class="fh-tag">${mot.emoji} ${level} Seviye</div>
      <div class="fh-role">${mot.title}</div>
      <div class="fh-msg">${msgText}</div>
      <div class="fh-actions">
        <button class="fh-btn-primary" onclick="setTier('premium',document.querySelectorAll('.yk-tier-btn')[1])">Tümünü Değerlendir →</button>
        <button class="fh-btn-secondary">Nasıl çalışır?</button>
      </div>
      <div class="fh-stats">
        <div class="fh-stat"><div class="fh-stat-num">${total}</div><div class="fh-stat-label">yetkinlik belirlendi</div></div>
        <div class="fh-stat"><div class="fh-stat-num">${comps.filter(c=>c.weight==='core').length}</div><div class="fh-stat-label">temel yetkinlik</div></div>
        <div class="fh-stat"><div class="fh-stat-num">2</div><div class="fh-stat-label">ücretsiz önizleme</div></div>
      </div>
    </div>`;
    document.getElementById('roleSelectorWrap').innerHTML='';
  }

  // GRID
  let grid='';
  comps.forEach((c,i)=>{
    const locked=!isPrem&&i>=FREE_LIMIT;
    const r=gr(c.code);
    let cls='comp-card';
    if(r==='strong')cls+=' rated-strong';
    else if(r==='growing')cls+=' rated-growing';
    else if(r==='unknown')cls+=' rated-unknown';
    grid+=`
    <div class="${cls}">
      <div class="comp-top">
        <div class="comp-icon" style="background:${ICON_BG[c.weight]};color:${ICON_COLOR[c.weight]}">${ICONS[c.icon]||ICONS.bolt}</div>
        <div><div class="comp-name">${c.name}</div><div class="comp-kf">${c.kf}</div></div>
      </div>
      <span class="comp-weight ${c.weight}">${WT[c.weight]}</span>
      <div class="comp-desc">${c.desc}</div>
      <div class="rating-btns">
        <button class="rating-btn strong${r==='strong'?' active':''}" onclick="rate('${c.code}','strong')">✓ Güçlü</button>
        <button class="rating-btn growing${r==='growing'?' active':''}" onclick="rate('${c.code}','growing')">↑ Gelişiyor</button>
        <button class="rating-btn unknown${r==='unknown'?' active':''}" onclick="rate('${c.code}','unknown')">? Belirsiz</button>
      </div>
      ${locked?`<div class="lock-overlay"><div class="lock-icon">${ICONS.lock}</div><div class="lock-label">Premium özelliği</div></div>`:''}
    </div>`;
  });
  document.getElementById('compGrid').innerHTML=grid;

  // BOTTOM
  let bottom='';
  if(!isPrem){
    bottom=`<div class="dashed-card"><div><span class="premium-badge">PREMIUM</span><div style="font-size:13px;color:var(--muted);margin-top:4px"><strong style="color:var(--navy)">Tüm yetkinlikleri değerlendir</strong>, gelişim önerileri al ve bir sonraki role hazırlan.</div></div><button class="upgrade-cta" onclick="setTier('premium',document.querySelectorAll('.yk-tier-btn')[1])">Başla →</button></div>`;
  } else if(strong>0||growing>0){
    bottom=`<div class="next-card"><div><span class="premium-badge">SONRAKI ADIM</span><div style="font-size:13px;color:var(--muted);margin-top:4px"><strong style="color:var(--navy)">İş Görüşmeleri paneline git</strong> — ${role} için mülakat sorularına ve hazırlık rehberine eriş.</div></div><button class="upgrade-cta" style="background:var(--navy)">Mülakata Hazırlan →</button></div>`;
  }
  document.getElementById('bottomCard').innerHTML=bottom;
}
render();
</script>
</body>
</html>
