const ICONS={eye:"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>",msg:"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>",shield:"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"/></svg>",team:"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>",bolt:"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polygon points=\"13 2 3 14 12 14 11 22 21 10 12 10 13 2\"/></svg>",check:"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"9 11 12 14 22 4\"/><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"/></svg>",arrow:"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"/><polyline points=\"12 5 19 12 12 19\"/></svg>",star:"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polygon points=\"12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2\"/></svg>",chart:"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"10\"/><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"4\"/><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"14\"/></svg>",heart:"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z\"/></svg>",lock:"<svg viewBox=\"0 0 24 24\" fill=\"white\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\"/><path d=\"M7 11V7a5 5 0 0 1 10 0v4\" fill=\"none\" stroke=\"white\" stroke-width=\"2\"/></svg>",info:"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\" stroke-width=\"3\"/><line x1=\"12\" y1=\"12\" x2=\"12\" y2=\"16\"/></svg>"};
const ICON_COLOR={core:"#C94E28",important:"#1E2D5E",nice:"#6B7280"};
const ICON_BG={core:"#FEF3F0",important:"#EEF2FF",nice:"#F3F4F6"};
const WT={core:"Temel yetkinlik",important:"Önemli yetkinlik",nice:"Faydalı yetkinlik"};
let role="Satış Danışmanı",tier="freemium",ratings={},openedCards={};
const FREE_LIMIT=2;
function setTier(t,btn){tier=t;document.querySelectorAll(".yk-tier-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");render();}
function setRole(r){role=r;render();}
function gr(code){return ratings[role+"_"+code]||null;}
function rateCard(code,rating,e){if(e)e.stopPropagation();if(tier==="freemium")return;const k=role+"_"+code;ratings[k]=ratings[k]===rating?null:rating;render();}
function rateDrawer(code,rating){const k=role+"_"+code;ratings[k]=ratings[k]===rating?null:rating;render();openDrawer(code);}
function openDrawer(code){
  const comps=ROLES[role].comps;
  const c=comps.find(x=>x.code===code);if(!c)return;
  const a=ANCHORS[code];
  const isPrem=tier==="premium";
  const idx=comps.findIndex(x=>x.code===code);
  const isLocked=!isPrem&&idx>=FREE_LIMIT;
  const r=gr(code);
  openedCards[role+"_"+code]=true;
  document.getElementById("drawerName").textContent=c.name;
  document.getElementById("drawerKf").textContent=c.kf+" · "+WT[c.weight];
  let body="";
  if(a&&!isLocked){
    body+=`<div class="drawer-section"><div class="drawer-section-title">📌 Tanım</div><div class="drawer-definition">${a.def}</div><div class="drawer-why">${a.why}</div></div>`;
    body+=`<div class="drawer-section"><div class="drawer-section-title">✅ Yetkin olanlar şunu yapar</div><div class="anchor-list">${a.skilled.map(s=>`<div class="anchor-item strong-anchor"><div class="anchor-dot-strong"></div><span>${s}</span></div>`).join("")}</div></div>`;
    body+=`<div class="drawer-section"><div class="drawer-section-title">⬆ Henüz gelişim aşamasındakiler</div><div class="anchor-list">${a.lessskilled.map(g=>`<div class="anchor-item growing-anchor"><div class="anchor-dot-growing"></div><span>${g}</span></div>`).join("")}</div></div>`;
    body+=`<div class="drawer-section"><div class="drawer-section-title">🌟 Çok yetenekliler</div><div class="anchor-list">${a.highlyskilled.map(h=>`<div class="anchor-item strong-anchor"><div class="anchor-dot-strong" style="background:#0F766E"></div><span>${h}</span></div>`).join("")}</div></div>`;
    body+=`<div class="drawer-section"><div class="drawer-section-title">⚠ Aşırı kullanımda dikkat</div><div class="anchor-list">${a.overused.map(o=>`<div class="anchor-item overused-anchor"><div class="anchor-dot-overused"></div><span>${o}</span></div>`).join("")}</div></div>`;
    body+=`<div class="drawer-section"><div class="drawer-retail-title">🏪 RETAIL&#39;DE NASIL GÖRÜNÜR</div><div class="drawer-retail"><div class="drawer-retail-text">${a.retail}</div></div></div>`;
    body+=`<div class="drawer-divider"></div>`;
    body+=`<div class="drawer-rating-section"><div class="drawer-rating-title">Kendinle dürüst ol 🎯</div><div class="drawer-rating-sub">Yukarıdaki davranış tanımlarını okudun. Hangisi seni daha çok tarif ediyor? Skor vermiyoruz — bu bir öz farkındalık egzersizi.</div><div class="drawer-rating-btns"><button class="drawer-rating-btn strong${r==="strong"?" active":""}" onclick="rateDrawer('${code}','strong')">✅ Beni güçlü tarif ediyor</button><button class="drawer-rating-btn growing${r==="growing"?" active":""}" onclick="rateDrawer('${code}','growing')">↑ Hâlâ gelişiyorum</button></div>`;
    if(a.interview){body+=`<div class="drawer-interview"><div class="drawer-interview-title">📋 Mülakatta nasıl anlatırsın?</div><div class="drawer-interview-q">${a.interview}</div></div>`;}
    body+=`</div>`;
  } else if(isLocked){
    body=`<div class="drawer-lock-notice"><div style="font-size:24px;margin-bottom:8px">🔒</div><div style="font-size:14px;font-weight:600;color:var(--verm);margin-bottom:6px">Premium içerik</div><div style="font-size:13px;color:#9A3C1E;line-height:1.6">Yetkinlik tanımını, davranışsal göstergeleri, retail örneklerini ve mülakat hazırlık sorularını görmek için Premium üyeliğe geç.</div><button class="drawer-lock-btn" onclick="setTier('premium',document.querySelectorAll('.yk-tier-btn')[1]);closeDrawer()">Premium'a Geç →</button></div>`;
  }
  document.getElementById("drawerBody").innerHTML=body;
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawerOverlay").classList.add("open");
  document.body.style.overflow="hidden";
}
function closeDrawer(){document.getElementById("drawer").classList.remove("open");document.getElementById("drawerOverlay").classList.remove("open");document.body.style.overflow="";render();}
function quickSearch(q){document.getElementById("searchInput").value=q;doSearch();}
function onSearchInput(v){if(!v.trim())document.getElementById("searchResult").classList.remove("show");}
function doSearch(){
  const q=document.getElementById("searchInput").value.trim().toLowerCase();
  const el=document.getElementById("searchResult");
  if(!q){el.classList.remove("show");return;}
  let found=SEARCH_ALIASES[q];
  if(!found)for(const[k,v]of Object.entries(SEARCH_ALIASES)){if(k.includes(q)||q.includes(k)){found=v;break;}}
  if(!found)for(const r of Object.keys(ROLES)){if(r.toLowerCase().includes(q)){found=r;break;}}
  if(found&&ROLES[found]){
    const comps=ROLES[found].comps;
    el.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px"><div class="sr-role">${found} <span style="font-size:11px;font-weight:400;color:var(--muted)">${ROLES[found].level} seviye · ${comps.length} yetkinlik</span></div><button onclick="setRole('${found}');document.getElementById('searchResult').classList.remove('show');window.scrollTo({top:300,behavior:'smooth'})" style="font-size:12px;font-weight:600;color:var(--verm);background:none;border:none;cursor:pointer;padding:4px 0">Bu role geç →</button></div><div class="sr-comps">${comps.map(c=>`<span class="sr-comp ${c.weight}"><span style="margin-right:2px">${c.weight==="core"?"◆":"◇"}</span>${c.name}</span>`).join("")}</div>`;
    el.classList.add("show");
  }else{el.innerHTML=`<div style="font-size:13px;color:var(--muted);text-align:center;padding:10px 0">Sonuç bulunamadı.</div>`;el.classList.add("show");}
}
function render(){
  const comps=ROLES[role].comps;
  const level=ROLES[role].level;
  const total=comps.length;
  const read=comps.filter(c=>openedCards[role+"_"+c.code]).length;
  const strong=comps.filter(c=>gr(c.code)==="strong").length;
  const growing=comps.filter(c=>gr(c.code)==="growing").length;
  const rated=strong+growing;
  const pct=Math.round(rated/total*100);
  const readPct=Math.round(read/total*100);
  const isPrem=tier==="premium";
  const mot=MOTIVATIONAL_MSG[level]||MOTIVATIONAL_MSG["Giriş"];
  if(isPrem){
    document.getElementById("summaryWrap").innerHTML=`<div class="summary-card"><div><div style="font-size:12px;opacity:.6;margin-bottom:4px">Değerlendirme ilerlemesi — ${role}</div><div style="font-size:14px;font-weight:600">${rated} / ${total} yetkinlik değerlendirildi</div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></div><div class="summary-stats"><div class="stat-item stat-strong"><div class="stat-num">${strong}</div><div class="stat-label">Güçlü</div></div><div class="stat-item stat-growing"><div class="stat-num">${growing}</div><div class="stat-label">Gelişiyor</div></div></div></div>`;
    document.getElementById("roleSelectorWrap").innerHTML=`<div class="section-label">Rol seç</div><div class="role-bar">${Object.keys(ROLES).map(r=>`<button class="role-pill${r===role?" active":""}" onclick="setRole('${r}')">${r}</button>`).join("")}</div>`;
    document.getElementById("progressWrap").innerHTML=read<total?`<div class="unlock-progress"><div class="up-track"><div class="up-fill" style="width:${readPct}%"></div></div><span style="font-size:12px;color:var(--muted)">Okunan:</span><span style="font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:var(--navy)">${read}/${total}</span><span style="font-size:12px;color:var(--muted);margin-left:4px">— kartlara tıklayarak öğren</span></div>`:"";
  }else{
    document.getElementById("summaryWrap").innerHTML=`<div class="freemium-hero"><div class="fh-deco"></div><div class="fh-deco2"></div><div class="fh-tag">${mot.emoji} ${level} Seviye</div><div class="fh-role">${mot.title}</div><div class="fh-msg">${mot.msg}</div><div class="fh-actions"><button class="fh-btn-primary" onclick="setTier('premium',document.querySelectorAll('.yk-tier-btn')[1])">Tümünü Değerlendir →</button><button class="fh-btn-secondary">Nasıl çalışır?</button></div><div class="fh-stats"><div class="fh-stat"><div class="fh-stat-num">${total}</div><div class="fh-stat-label">yetkinlik</div></div><div class="fh-stat"><div class="fh-stat-num">${comps.filter(c=>c.weight==="core").length}</div><div class="fh-stat-label">temel</div></div><div class="fh-stat"><div class="fh-stat-num">2</div><div class="fh-stat-label">ücretsiz önizleme</div></div></div></div>`;
    document.getElementById("roleSelectorWrap").innerHTML="";
    document.getElementById("progressWrap").innerHTML="";
  }
  let grid="";
  comps.forEach((c,i)=>{
    const locked=!isPrem&&i>=FREE_LIMIT;
    const r=gr(c.code);
    let cls="comp-card";
    if(r==="strong")cls+=" rated-strong";
    else if(r==="growing")cls+=" rated-growing";
    grid+=`<div class="${cls}" onclick="${locked?`setTier('premium',document.querySelectorAll('.yk-tier-btn')[1])`:`openDrawer('${c.code}')`}">
      <div class="comp-top"><div class="comp-top-left"><div class="comp-icon" style="background:${ICON_BG[c.weight]};color:${ICON_COLOR[c.weight]}">${ICONS[c.icon]||ICONS.bolt}</div><div><div class="comp-name">${c.name}</div><div class="comp-kf">${c.kf}</div></div></div><button class="info-btn" onclick="event.stopPropagation();${locked?`setTier('premium',document.querySelectorAll('.yk-tier-btn')[1])`:`openDrawer('${c.code}')`}">${ICONS.info}</button></div>
      ${r==="strong"?'<div class="rating-badge strong-badge">✅ Güçlü</div>':r==="growing"?'<div class="rating-badge growing-badge">↑ Gelişiyor</div>':""}
      <span class="comp-weight ${c.weight}">${WT[c.weight]}</span>
      <div class="comp-desc">${c.desc}</div>
      <div class="rating-btns" onclick="event.stopPropagation()"><button class="rating-btn strong${r==="strong"?" active":""}" onclick="rateCard('${c.code}','strong',event)">✅ Güçlüyüm</button><button class="rating-btn growing${r==="growing"?" active":""}" onclick="rateCard('${c.code}','growing',event)">↑ Gelişiyorum</button></div>
      ${locked?`<div class="lock-overlay"><div class="lock-icon">${ICONS.lock}</div><div class="lock-label">Detay için<br>Premium</div></div>`:""}
    </div>`;
  });
  document.getElementById("compGrid").innerHTML=grid;
  let bottom="";
  if(!isPrem){bottom=`<div class="dashed-card"><div><span class="premium-badge">PREMIUM</span><div style="font-size:13px;color:var(--muted);margin-top:4px"><strong style="color:var(--navy)">Tüm yetkinlikleri gör, davranışsal göstergeleri oku</strong> ve mülakat hazırlığına başla.</div></div><button class="upgrade-cta" onclick="setTier('premium',document.querySelectorAll('.yk-tier-btn')[1])">Başla →</button></div>`;}
  else if(rated>0){bottom=`<div class="next-card"><div><span class="premium-badge">SONRAKI ADIM</span><div style="font-size:13px;color:var(--muted);margin-top:4px"><strong style="color:var(--navy)">İş Görüşmeleri paneline git</strong> — ${role} için mülakat sorularına ve hazırlık rehberine eriş.</div></div><button class="upgrade-cta" style="background:var(--navy)">Mülakata Hazırlan →</button></div>`;}
  document.getElementById("bottomCard").innerHTML=bottom;
}
render();

</script>
</body>
</html>
