<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yetkinliklerim — Mockup v4</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--verm:#C94E28;--navy:#1E2D5E;--bg:#F7F6F4;--border:#E5E3DF;--muted:#6B7280;--text:#111111}
body{font-family:"Plus Jakarta Sans",sans-serif;background:var(--bg);min-height:100vh;padding:24px 16px}
.wrap{max-width:900px;margin:0 auto}
.yk-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:10px}
.yk-title{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;font-weight:700;color:var(--navy)}
.yk-sub{font-size:13px;color:var(--muted);margin-top:3px}
.yk-tier-toggle{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);border-radius:20px;padding:3px 6px}
.yk-tier-btn{padding:5px 14px;border-radius:16px;border:none;cursor:pointer;font-family:"Plus Jakarta Sans",sans-serif;font-size:12px;font-weight:500;transition:all .2s}
.yk-tier-btn.active{background:var(--navy);color:#fff}
.yk-tier-btn:not(.active){background:transparent;color:var(--muted)}
.search-section{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:20px;margin-bottom:24px}
.search-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.search-title{font-family:"Bricolage Grotesque",sans-serif;font-size:15px;font-weight:600;color:var(--navy)}
.search-badge{background:#EEF2FF;color:var(--navy);font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;letter-spacing:.3px}
.search-bar{display:flex;gap:8px}
.search-input{flex:1;height:40px;border:1.5px solid var(--border);border-radius:10px;padding:0 14px;font-family:"Plus Jakarta Sans",sans-serif;font-size:13px;color:var(--text);outline:none;transition:border-color .2s;background:#fff}
.search-input:focus{border-color:var(--navy)}
.search-input::placeholder{color:#9CA3AF}
.search-btn{height:40px;padding:0 18px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-family:"Plus Jakarta Sans",sans-serif;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.search-hints{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hint-chip{padding:4px 10px;background:var(--bg);border:1px solid var(--border);border-radius:12px;font-size:11px;color:var(--muted);cursor:pointer;transition:all .15s}
.hint-chip:hover{border-color:var(--verm);color:var(--verm);background:#FEF3F0}
.search-result{margin-top:14px;padding:14px;background:var(--bg);border-radius:10px;display:none}
.search-result.show{display:block}
.sr-role{font-family:"Bricolage Grotesque",sans-serif;font-size:14px;font-weight:600;color:var(--navy);margin-bottom:10px}
.sr-comps{display:flex;flex-wrap:wrap;gap:6px}
.sr-comp{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:10px;font-size:11px;font-weight:600}
.sr-comp.core{background:#FEF3F0;color:var(--verm);border:1px solid #F9C3B3}
.sr-comp.important{background:#EEF2FF;color:var(--navy);border:1px solid #C7D2FE}
.sr-comp.nice{background:#F3F4F6;color:var(--muted);border:1px solid var(--border)}
.freemium-hero{background:linear-gradient(135deg,#2A3F7A 0%,var(--navy) 50%,#162247 100%);border-radius:16px;padding:24px;margin-bottom:20px;position:relative;overflow:hidden}
.fh-deco{position:absolute;top:-30px;right:-30px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.04);pointer-events:none}
.fh-deco2{position:absolute;bottom:-40px;right:60px;width:100px;height:100px;border-radius:50%;background:rgba(201,78,40,.12);pointer-events:none}
.fh-tag{display:inline-flex;align-items:center;gap:5px;background:rgba(201,78,40,.2);border:1px solid rgba(201,78,40,.4);border-radius:12px;padding:4px 10px;font-size:11px;font-weight:600;color:#FCA47A;margin-bottom:12px}
.fh-role{font-family:"Bricolage Grotesque",sans-serif;font-size:20px;font-weight:700;color:#fff;margin-bottom:6px;line-height:1.3}
.fh-msg{font-size:13px;color:rgba(255,255,255,.65);line-height:1.6;max-width:480px;margin-bottom:18px}
.fh-msg strong{color:rgba(255,255,255,.9)}
.fh-actions{display:flex;gap:10px;flex-wrap:wrap}
.fh-btn-primary{padding:9px 20px;background:var(--verm);color:#fff;border:none;border-radius:10px;font-family:"Plus Jakarta Sans",sans-serif;font-size:13px;font-weight:600;cursor:pointer}
.fh-btn-secondary{padding:9px 20px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;font-family:"Plus Jakarta Sans",sans-serif;font-size:13px;cursor:pointer}
.fh-stats{display:flex;gap:20px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
.fh-stat-num{font-family:"DM Mono",monospace;font-size:18px;font-weight:500;color:#fff}
.fh-stat-label{font-size:11px;color:rgba(255,255,255,.5);margin-top:1px}
.summary-card{background:var(--navy);border-radius:16px;padding:20px 24px;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.summary-stats{display:flex;gap:24px}
.stat-item{text-align:center}
.stat-num{font-family:"DM Mono",monospace;font-size:24px;font-weight:500}
.stat-label{font-size:11px;opacity:.6;margin-top:2px}
.stat-strong .stat-num{color:#4ADE80}
.stat-growing .stat-num{color:#FCD34D}
.progress-track{height:5px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden;width:220px;margin-top:10px}
.progress-fill{height:100%;background:#fff;border-radius:3px;transition:width .4s ease}
.section-label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px}
.role-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.role-pill{padding:7px 16px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;color:var(--text)}
.role-pill.active{border-color:var(--verm);background:#FEF3F0;color:var(--verm)}
.unlock-progress{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px}
.up-track{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.up-fill{height:100%;background:linear-gradient(90deg,var(--verm),#E8693E);border-radius:4px;transition:width .5s ease}
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px;margin-bottom:20px}
.comp-card{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:16px;transition:all .2s;position:relative;overflow:hidden;cursor:pointer}
.comp-card:hover{border-color:#C4B5B0;transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.06)}
.comp-card.rated-strong{border-color:#15803D;background:#F0FDF4}
.comp-card.rated-growing{border-color:#B45309;background:#FFFBEB}
.lock-overlay{position:absolute;inset:0;background:rgba(247,246,244,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:12px;backdrop-filter:blur(3px)}
.lock-icon{width:32px;height:32px;background:var(--navy);border-radius:50%;display:flex;align-items:center;justify-content:center}
.lock-label{font-size:11px;font-weight:600;color:var(--navy);text-align:center;line-height:1.4}
.comp-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.comp-top-left{display:flex;align-items:flex-start;gap:10px}
.comp-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.comp-icon svg{width:18px;height:18px}
.comp-name{font-family:"Bricolage Grotesque",sans-serif;font-size:14px;font-weight:600;color:var(--navy);line-height:1.3}
.comp-kf{font-size:10px;color:var(--muted);font-family:"DM Mono",monospace;margin-top:2px}
.info-btn{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;color:var(--muted)}
.info-btn:hover{border-color:var(--navy);color:var(--navy);background:#EEF2FF}
.comp-desc{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:12px}
.comp-weight{display:inline-block;font-size:10px;font-weight:600;padding:2px 9px;border-radius:10px;margin-bottom:10px}
.comp-weight.core{background:#FEF3F0;color:var(--verm)}
.comp-weight.important{background:#EEF2FF;color:var(--navy)}
.comp-weight.nice{background:#F3F4F6;color:var(--muted)}
.rating-btns{display:flex;gap:6px}
.rating-btn{flex:1;padding:8px 4px;border-radius:9px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;font-family:"Plus Jakarta Sans",sans-serif;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px}
.rating-btn.strong.active{background:#DCFCE7;border-color:#15803D;color:#15803D}
.rating-btn.growing.active{background:#FEF3C7;border-color:#B45309;color:#B45309}
.rating-badge{display:none}
.comp-card.rated-strong .rating-badge.strong-badge,.comp-card.rated-growing .rating-badge.growing-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;border-radius:8px;padding:2px 8px;margin-bottom:8px}
.comp-card.rated-strong .rating-badge.strong-badge{color:#15803D;background:#DCFCE7}
.comp-card.rated-growing .rating-badge.growing-badge{color:#B45309;background:#FEF3C7}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:900;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px)}
.drawer-overlay.open{opacity:1;pointer-events:all}
.drawer{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:95vw;background:#fff;z-index:901;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;box-shadow:-8px 0 40px rgba(0,0,0,.12)}
.drawer.open{transform:translateX(0)}
.drawer-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.drawer-comp-name{font-family:"Bricolage Grotesque",sans-serif;font-size:18px;font-weight:700;color:var(--navy);line-height:1.2}
.drawer-comp-kf{font-size:11px;color:var(--muted);font-family:"DM Mono",monospace;margin-top:3px}
.drawer-close{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;color:var(--muted)}
.drawer-close:hover{background:var(--bg)}
.drawer-body{padding:20px 24px}
.drawer-section{margin-bottom:22px}
.drawer-section-title{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.drawer-definition{font-size:13px;color:var(--text);line-height:1.8;padding:14px 16px;background:#F8F7F5;border-radius:10px;border-left:3px solid var(--verm)}
.drawer-why{font-size:13px;color:#4B5563;line-height:1.8;margin-top:10px}
.anchor-list{display:flex;flex-direction:column;gap:7px}
.anchor-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.6}
.anchor-item.strong-anchor{background:#F0FDF4;color:#14532D}
.anchor-item.growing-anchor{background:#FFFBEB;color:#78350F}
.anchor-item.overused-anchor{background:#FFF1F2;color:#881337}
.anchor-dot-strong{width:8px;height:8px;border-radius:50%;background:#15803D;flex-shrink:0;margin-top:6px}
.anchor-dot-growing{width:8px;height:8px;border-radius:50%;border:2px solid #B45309;flex-shrink:0;margin-top:6px}
.anchor-dot-overused{width:8px;height:8px;border-radius:50%;background:#E11D48;flex-shrink:0;margin-top:6px}
.drawer-divider{height:1px;background:var(--border);margin:20px 0}
.drawer-rating-section{background:#F8F7F5;border-radius:12px;padding:16px}
.drawer-rating-title{font-size:14px;font-weight:600;color:var(--navy);margin-bottom:4px}
.drawer-rating-sub{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.6}
.drawer-rating-btns{display:flex;gap:8px;margin-bottom:12px}
.drawer-rating-btn{flex:1;padding:12px 8px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:"Plus Jakarta Sans",sans-serif;color:var(--muted);text-align:center;transition:all .15s}
.drawer-rating-btn.strong.active{background:#DCFCE7;border-color:#15803D;color:#15803D}
.drawer-rating-btn.growing.active{background:#FEF3C7;border-color:#B45309;color:#B45309}
.drawer-interview{margin-top:12px;padding:14px;background:var(--navy);border-radius:10px;cursor:pointer;border:none;width:100%;text-align:left;font-family:"Plus Jakarta Sans",sans-serif}
.drawer-interview-title{font-size:12px;font-weight:700;color:rgba(255,255,255,.6);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.drawer-interview-q{font-size:13px;color:#fff;line-height:1.5}
.drawer-retail{padding:14px;background:#EEF2FF;border-radius:10px;border-left:3px solid var(--navy)}
.drawer-retail-title{font-size:11px;font-weight:700;color:var(--navy);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.drawer-retail-text{font-size:13px;color:#1E3A8A;line-height:1.6}
.drawer-lock-notice{background:#FEF3F0;border:1px solid #F9C3B3;border-radius:10px;padding:16px;text-align:center}
.drawer-lock-btn{margin-top:10px;width:100%;padding:10px;background:var(--verm);color:#fff;border:none;border-radius:8px;font-family:"Plus Jakarta Sans",sans-serif;font-size:13px;font-weight:600;cursor:pointer}
.upgrade-cta{background:var(--verm);border:none;border-radius:10px;padding:10px 20px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:"Plus Jakarta Sans",sans-serif;white-space:nowrap}
.next-card{background:#fff;border:1.5px solid var(--navy);border-radius:14px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.premium-badge{background:var(--navy);color:#fff;font-size:10px;font-weight:700;padding:3px 10px;border-radius:10px;letter-spacing:.5px;display:inline-block;margin-bottom:6px}
.dashed-card{background:#fff;border:1.5px dashed #C4B5B0;border-radius:14px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="yk-header">
    <div>
      <div class="yk-title">Yetkinliklerim</div>
      <div class="yk-sub">Retail pozisyonlarına özel yetkinlik haritası — Mockup v4</div>
    </div>
    <div class="yk-tier-toggle">
      <span style="font-size:11px;color:var(--muted);padding:0 4px">Görünüm:</span>
      <button class="yk-tier-btn active" onclick="setTier('freemium',this)">Freemium</button>
      <button class="yk-tier-btn" onclick="setTier('premium',this)">Premium</button>
    </div>
  </div>
  <div class="search-section">
    <div class="search-top">
      <div class="search-title">Pozisyon Ara</div>
      <span class="search-badge">RETAİL YETKİNLİK REHBERİ</span>
    </div>
    <div class="search-bar">
      <input class="search-input" id="searchInput" placeholder="Pozisyon ara... Satış Danışmanı, Mağaza Müdürü, VM..." oninput="onSearchInput(this.value)" onkeydown="if(event.key==='Enter')doSearch()">
      <button class="search-btn" onclick="doSearch()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Ara
      </button>
    </div>
    <div class="search-hints">
      <span class="hint-chip" onclick="quickSearch('Kasiyer')">Kasiyer</span>
      <span class="hint-chip" onclick="quickSearch('Satış Danışmanı')">Satış Danışmanı</span>
      <span class="hint-chip" onclick="quickSearch('Kat Müdürü')">Kat Müdürü</span>
      <span class="hint-chip" onclick="quickSearch('Mağaza Müdürü')">Mağaza Müdürü</span>
      <span class="hint-chip" onclick="quickSearch('Bölge Müdürü')">Bölge Müdürü</span>
      <span class="hint-chip" onclick="quickSearch('Visual Merchandiser')">Visual Merchandiser</span>
    </div>
    <div class="search-result" id="searchResult"></div>
  </div>
  <div id="summaryWrap"></div>
  <div id="roleSelectorWrap"></div>
  <div id="progressWrap"></div>
  <div class="section-label">Yetkinlik kartları — <span style="font-weight:400;text-transform:none;font-size:11px;color:var(--muted)">detay ve değerlendirme için kartlara tıkla</span></div>
  <div class="comp-grid" id="compGrid"></div>
  <div id="bottomCard"></div>
</div>
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div>
      <div class="drawer-comp-name" id="drawerName"></div>
      <div class="drawer-comp-kf" id="drawerKf"></div>
    </div>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>
<script>
const ROLES={
  'Kasiyer':{level:'Giriş',comps:[
    {code:'cf',name:'Müşteri Odaklılık',kf:'Customer Focus',desc:'Her müşteriyle güler yüzlü ve çözüm odaklı etkileşim kurar.',weight:'core',icon:'eye'},
    {code:'it',name:'Güven Oluşturma',kf:'Instills Trust',desc:'Kasa işlemlerinde dürüstlük ve tutarlılık ile güven inşa eder.',weight:'core',icon:'shield'},
    {code:'ea',name:'Sorumluluk Alma',kf:'Ensures Accountability',desc:'İşlem hatalarını takip eder, sonuçlarının sorumluluğunu üstlenir.',weight:'core',icon:'check'},
    {code:'ce',name:'Etkili İletişim',kf:'Communicates Effectively',desc:'Müşteriye ürün, kampanya ve kasa süreçleri hakkında net bilgi verir.',weight:'important',icon:'msg'},
    {code:'br',name:'Dayanıklılık',kf:'Being Resilient',desc:'Yoğun saatlerde stres altında sakin ve odaklı kalır.',weight:'important',icon:'bolt'},
  ]},
  'Satış Danışmanı':{level:'Giriş',comps:[
    {code:'cf',name:'Müşteri Odaklılık',kf:'Customer Focus',desc:'Müşteri ihtiyaçlarını önceler, çözüm odaklı yaklaşır.',weight:'core',icon:'eye'},
    {code:'ce',name:'Etkili İletişim',kf:'Communicates Effectively',desc:'Açık ve etkili biçimde bilgi iletir, aktif dinler.',weight:'core',icon:'msg'},
    {code:'it',name:'Güven Oluşturma',kf:'Instills Trust',desc:'Tutarlı davranışlarla müşteri güveni inşa eder.',weight:'core',icon:'shield'},
    {code:'co',name:'Takım Çalışması',kf:'Collaborates',desc:'Mağaza ekibiyle ortak hedefler için iş birliği yapar.',weight:'important',icon:'team'},
    {code:'ao',name:'Aksiyona Yönelim',kf:'Action Oriented',desc:'Fırsatları hızla değerlendirir, harekete geçer.',weight:'important',icon:'bolt'},
  ]},
  'Kıdemli Satış Dan.':{level:'Giriş-Orta',comps:[
    {code:'cf',name:'Müşteri Odaklılık',kf:'Customer Focus',desc:'Müşteri ihtiyaçlarını önceler, uzun vadeli ilişki kurar.',weight:'core',icon:'eye'},
    {code:'ce',name:'Etkili İletişim',kf:'Communicates Effectively',desc:'Açık ve ikna edici biçimde bilgi iletir.',weight:'core',icon:'msg'},
    {code:'it',name:'Güven Oluşturma',kf:'Instills Trust',desc:'Tutarlı davranışlarla müşteri güveni inşa eder.',weight:'core',icon:'shield'},
    {code:'co',name:'Takım Çalışması',kf:'Collaborates',desc:'Yeni çalışanlara rehberlik eder, ekibi destekler.',weight:'important',icon:'team'},
    {code:'is',name:'İlişki Yönetimi',kf:'Interpersonal Savvy',desc:'Farklı kişilerle kolayca bağ kurar.',weight:'important',icon:'heart'},
    {code:'nl',name:'Hızlı Öğrenme',kf:'Nimble Learning',desc:'Yeni ürün ve kampanyaları hızla öğrenir.',weight:'nice',icon:'bolt'},
  ]},
  'Kat Müdürü':{level:'Giriş-Orta',comps:[

  ea:{
    def:"Kendini ve başkalarını taahhütleri yerine getirme konusunda sorumlu tutmak.",
    why:"Sorumluluk almak; taahhütlerin sahibi olmak, hesap verebilir olmak ve hem kendi hem de yönetilen kişilerin eylemlerinden sorumlu olmak demektir. Önemli ve biraz korkutucu. Çünkü hesap verebilir olmak sizi görünür kılar ve eleştiriye açar. Ama hesap verebilirliği organizasyonda bir kültür haline getirmenin getirisi büyüktür: güven ve performans artar, çalışanlar yaptıklarının kuruma katkısını hisseder. Perakendede hesap verebilirlik hem sayısal (satış hedefleri, stok doğruluğu) hem davranışsal (müşteri şikayeti yönetimi, ekip tutumu) boyutuyla yaşanır. Hata yaptığında 'sistem böyle' veya 'o yapmadı' demek yerine, 'ben atladım, şimdi ne yapacağız?' demek bu yetkinliğin en güçlü ifadesidir.",
    skilled:["Taahhütlerini takip eder ve başkalarının da aynısını yapmasını sağlar; söylenenler gerçekleşir","Net bir sahiplik duygusuyla hareket eder — 'bu projenin başarısı da başarısızlığı da benim'","Kararlarının, eylemlerinin ve başarısızlıklarının kişisel sorumluluğunu üstlenir; dışsal açıklamaya sığınmaz","Ekibine net sorumluluklar ve süreç takip yöntemleri oluşturur; herkes ne yapacağını bilir","Sonuçları ölçmek için geri bildirim döngüleri tasarlar; ilerleme izlenir, sürprizler minimize edilir"],
    lessskilled:["Makul ölçüde kişisel sorumluluk üstlenmez; 'benim de payım var' diyemez","Nasıl gittiğine dair bilgi toplamaz; son dakika sürprizleriyle karşılaşır","Yetersiz geribildirim verir; insanlar rotayı nasıl düzelteceğini bilmez","Sorumluluğu başkalarıyla paylaşmayı tercih eder; net sahipliği yoktur, 'hepimizin' işi olur","Sorun olduğunda dışsal açıklamalara başvurur: 'piyasa kötüydü', 'stok gelmedi', 'o söylemedi'"],
    highlyskilled:["Kritik projelerde beklentileri ve başarı kriterlerini net tanımlar; kimse ne istendiğini tahmin etmek zorunda kalmaz","Hesap verebilirlik kültürünü sistemik hale getirir; kendi davranışı model olur, yazılı kurallar değil","Ekibindeki başarısızlıkları öğrenme fırsatına çevirir; 'neden başarısız olduk?' yerine 'bir dahaki sefere ne yapacağız?' sorusunu sorar"],
    overused:["Bireyler üzerinde gereğinden fazla baskı ve denetim yaratır; kontrol dışı faktörleri yeterince dikkate almaz","Sayısal ölçümlere ve somut verilere aşırı odaklanır; niteliksel gelişimi ve insan boyutunu ikinci plana atar","Hataya sıfır tolerans tutumu benimseyebilir; bu ekipte risk almaktan kaçınan, yenilik üretemeyen bir yapı oluşturur"],
    retail:"Mağaza, iki ay üst üste satış hedefinin altında kaldı. Bölge müdürüyle yapılan toplantıda mağaza müdürü 'Planlamamda bir boşluk oluştu, bunu atlıyorum — bu ay şunu değiştireceğiz ve iki hafta sonra sizi güncelleyeceğim' diyor. Ekip müdürün arkasında duruyor. Üçüncü ayda hedef tutturuluyor. Sorumluluk almak zayıflık değil, liderliğin başlangıç noktasıdır.",
    interview:"'Sorumluluğunu tamamen üstlendiğin ve zorlu koşullara rağmen taahhüdünü yerine getirdiğin bir durumu anlat. Baskı altında nasıl hissettin? Ne yaptın? O deneyim seni nasıl şekillendirdi?'"
  },
  dr:{
    def:"Zorlu koşullar altında bile tutarlı biçimde sonuç üretmek.",
    why:"Sonuç odaklılık; genel bir başarı zihniyetinin, aksiyona yönelimin ve öne çıkma isteğinin bütünleşik halidir. Sonuç odaklı insanlar takımlarına aciliyet duygusu aşılar; organizasyon performansının her zaman akılda olduğu bir kültür oluştururlar. Sonuçlar ölçülebilir olabilir: ciro büyümesi, müşteri memnuniyet skoru, kâr marjı. Ya da niteliksel olabilir: müşteri nezdinde güçlenen marka algısı, ekibi çeken canlı bir çalışma kültürü. Perakendede başarılı organizasyonlarda bireyler, takımlar ve mağazalar bu hedefler etrafında hizalanır. Engeller ve aksilikler karşısında pes etmemek, farklı stratejilerle tekrar ve tekrar denemek bu yetkinliğin özüdür.",
    skilled:["Güçlü bir sonuç ve alt satır odaklılığına sahiptir; rakamları takip eder ve neyin önemli olduğunu bilir","Engeller ve aksilikler karşısında hedeflere ulaşmayı sürdürür; ilk planı işe yaramadığında alternatif yol bulur","Hedefleri başarıyla aşma sicili vardır; sadece ulaşmakla kalmaz, geçer","Kendini ve ekibini sonuç üretimine iter; performansı hem kendinden hem başkalarından bekler","Her zaman bitişi gözünde tutar; son gün teslimini yakalamak için ekstra çaba gösterir"],
    lessskilled:["Sonuçlar için itmekten kaçınır; olduğu gibi kabul eder, daha iyisini zorlamaz","Asgari çabayla idare eder; 'geçti' ile yetinir, 'aştı'ya ulaşmaya çalışmaz","Tutarsız bir performans sergiler; iyi dönemde çalışır, zor dönemde üretkenliği düşer","Kolayca pes eder; üçüncü ve dördüncü denemede farklı stratejilerle geri dönmez","Son tarihleri sık sık kaçırır; engelleri aşmak yerine onları bahane olarak kullanır"],
    highlyskilled:["İddialı hedefler koyar ve yüksek standartlara sahiptir; ortalama hedefler tatmin etmez","Tutarlı biçimde en iyi performans gösterenler arasındadır; bir seferlik değil, süregelen mükemmellik","Zorluklar ve aksilikler karşısında ısrar eder; kriz, stratejik düşünmeyi değil aksiyonu hızlandırır"],
    overused:["İnsan, ekip, süreç ya da etik boyutlarını yeterince gözetmeksizin her ne pahasına olursa olsun sonuç peşinde koşar","Son tarih odaklılığı o kadar belirgindir ki teslim gününe yetişmek için kalite ve süreç feda edilir","Ekip üzerinde aşırı baskı yaratır; yüksek turnover ve tükenmişliğe yol açar"],
    retail:"Mağaza ayın 15'inde hedefin yüzde on gerisinde. Mağaza müdürü o gün ekibiyle oturuyor. Hangi kategoride açık var? Müşteri profili bu hafta nasıl değişti? Hangi ürünü daha görünür yapabiliriz? Sadece kalan 15 günü değil, o günün kalan 4 saatini de konuşuyorlar. Ay sonunda hedef tutturulmuş değil — geçilmiş.",
    interview:"'Koşulların aleyhine olduğu — kaynak kısıtlı, zaman dar ya da koşullar zorlu — bir dönemde sonucu nasıl tutturduğunu anlat. Ne hissettin? Hangi kararı aldın? Bir dahaki sefere ne yapardın?'"
  },
  dw:{
    def:"Net yön vermek, görevleri delege etmek ve işin tamamlanması önündeki engelleri kaldırmak.",
    why:"Kendi işini yapmaktan, işi başkaları aracılığıyla yapmaya geçiş — perakende kariyerinin en kritik ve en zorlu dönüşüm noktalarından biridir. Bu dönüşüm zordur çünkü işin doğrudan kontrolünü bırakmayı, daha fazla risk almayı ve başkalarına güvenmeyi gerektirir. Odak, kişisel başarıdan başkalarını güçlendirmeye ve başarılı kılmaya kayar. Perakendede bu geçiş — satış danışmanından kat müdürüne, kat müdüründen mağaza müdürüne — her kariyer adımında yeniden yaşanır. Net beklentiler belirleme, ilerlemeyi diyalog yoluyla takip etme ve insanların işlerini yapabilmesi için engelleri kaldırma bu yetkinliğin temel araçlarıdır.",
    skilled:["Net sorumluluklar ve hesap verebilirlikler tanımlar; herkes neyin kendisinden beklendiğini bilir","Görevleri ve kararları doğru kişilere, doğru biçimde delege eder; bottleneck haline gelmez","İş üzerindeki diyaloğu sürdürerek ilerlemeyi takip eder; son dakika sürprizlerini minimize eder","İnsanların yeteneklerine ve deneyim düzeylerine göre uygun rehberlik sağlar; herkese aynı biçimde yönetmez","İşin tamamlanmasının önündeki engelleri proaktif olarak tespit eder ve kaldırır"],
    lessskilled:["Eksik, belirsiz ya da dağınık talimatlar verir; insanlar ne yapacaklarını tam anlayamaz","'Bıraksaydın daha iyi yapardım' düşüncesiyle işi delege edemez; her şeyi kendisi yapmaya çalışır","Yüksek profilli görevleri kendinde tutar; gelişimsel fırsatları ekiple paylaşmaz","Mikro yönetim yapar; delege eder ama bırakmaz, sürekli kontrol eder ve müdahale eder","Gerçekçi olmayan ya da çok kolay hedefler koyar; ekibi ne motive eder ne de zorlar"],
    highlyskilled:["İnsanları görevlere ustaca eşleştirir; kimin hangi işte en iyi sonucu üreteceğini bilir","Net performans beklentilerini iletir ve tutarlı biçimde takip eder; söz verdiği geribildirimi verir","Bireylerin kapasitelerini geliştirecek görevleri bilinçli delege eder; görev hem iş hem gelişim fırsatıdır"],
    overused:["Gereğinden fazla yönlendirme yapar; ekip kendi başına karar alamaz, inisiyatif almaktan çekinir","Başkalarından gerçekçi olmayan beklentiler içindedir; kapasiteyi aşan taleplerle moral bozar","Sabırsızdır; gelişim için gerekli zaman ve süreçlere tolerans göstermez"],
    retail:"Yeni mağaza müdürü, kampanya döneminde her şeyi kendisi yapmaya çalışıyor — vitrin, kasa, stok, şikayet. Hiçbirini iyi yapamıyor. Bir ay sonra görevleri net biçimde dağıtıyor: 'Kasa sorumluluğu sende, vitrin sende, ben günde iki kez durumu gözden geçireceğim.' Mağaza daha sakin, daha verimli çalışıyor. Müdür artık yönetiyor — yapan değil, yönlendiren.",
    interview:"'Bir görevi delege ettiğinde beklediğin sonucu elde edemediğin bir durumu anlat. Nerede hata yaptın? Nasıl müdahale ettin? Bu deneyim delegasyon anlayışını nasıl değiştirdi?'"
  },
  bt:{
    def:"Çeşitli beceri ve perspektifleri bir araya getiren, güçlü kimliğe sahip takımlar kurmak.",
    why:"Harika takımlar nadiren kendiliğinden oluşur. Amaç, görevler, ilişkiler ve süreçlere dikkat edilmesini gerektirir. Perakendede bir mağaza ekibi; farklı deneyim düzeylerinden, farklı kişiliklerden ve farklı kariyer beklentilerinden oluşur. Sezonluk baskı, vardiya çakışmaları, yüksek turnover — bunların hepsi takım dinamiklerini sürekli zorlar. Bu çeşitliliği uyumlu bir güce dönüştürmek — kimliği olan, moralı yüksek, birbirini tamamlayan bir takım kurmak — liderliğin en yüksek ifadesidir. Doğru kişiyi doğru rolde konumlandırabilmek, takımı birleştiren ortak bir amaç oluşturabilmek ve başarıları paylaşmak bu yetkinliğin somut görünümleridir.",
    skilled:["Takımı uygun ve çeşitli stil, bakış açısı ve deneyim kombinasyonuyla oluşturur; benzerler değil, tamamlayanlar bir araya getirir","Ortak hedefler ve paylaşılan bir zihniyetin temelini atar; ekip ne için var olduğunu bilir","Aidiyet duygusu ve güçlü ekip morali yaratır; insanlar o takımın parçası olmaktan gurur duyar","Başarıları paylaşır ve ekip çabalarını ödüllendirir; bireysel başarıyı takım başarısının önüne koymaz","Takımda açık diyalog ve iş birliği ortamı oluşturur ve besler"],
    lessskilled:["Takımın amacı ve hedefleri konusunda net değildir; ekip neye doğru çalıştığını bilmez","Ortak bir zihniyet yaratamaz; bireyler yan yana çalışır ama gerçek bir takım oluşmaz","Moral, takdir ve aidiyet duygusunun etkili takımların ayrılmaz bileşenleri olduğunu kavrayamaz","Bireysel çabaları takım başarısının önünde tutar ve ödüllendirir; takım kimliği gelişmez","Görevleri iş birliğini teşvik edecek biçimde dağıtmaz; herkes kendi adasında çalışır"],
    highlyskilled:["Başarıyı bütün takımın başarısı olarak tanımlar; bireysel parlama değil, kolektif zafer önceliktir","Her takım üyesinin özgün geçmişini ve bakış açısını değerlendirmenin takım hedeflerine ulaşmak için kritik olduğunu bilir ve aktif kullanır","Takım üyelerinin kariyer hedeflerini bilir ve bu hedefleri ekip başarısıyla entegre eder"],
    overused:["Takım kimliğine o kadar odaklanır ki dış bakış açısına kapalı hale gelir; silo oluşturur","Konsensüs kültürü güçlüdür ama zor kararları almayı geciktirir","Çatışmadan kaçınır; takım uyumunu korumak adına zor gerçekleri söylemez ya da geç söyler"],
    retail:"Yeni mağaza müdürü göreve geldiğinde ekip parçalıdır. İlk yaptığı şey ortak hedef: 'Bu ay en yüksek müşteri memnuniyet puanına ulaşalım — bunu birlikte nasıl yaparız?' Her vardiyadan iki kişi bir araya geliyor, strateji konuşuyor. Ay sonunda puan yükseliyor. Ama daha önemlisi — ekip artık birbirini tanıyor ve güveniyor.",
    interview:"'Kurduğun ya da dönüştürdüğün bir takımı anlat. Başladığında tablo nasıldı? Neyi değiştirdin? Ve o takımdan bugün hâlâ gurur duyduğun bir şey nedir?'"
  },
  dt:{
    def:"Başkalarını hem kariyer hedeflerine hem organizasyonun hedeflerine ulaşacak biçimde geliştirmek.",
    why:"İnsanların büyük çoğunluğu büyümek ve gelişmek ister. Organizasyonlar da çalışanlarının rolün ve kurumun değişen yapısına ayak uyduracak biçimde gelişmesine ihtiyaç duyar. Bu süreç üç parçanın bir arada çalışmasını gerektirir: kişinin büyümek için motivasyonu, organizasyonun gelişimi destekleyen yapısı ve sizin — geliştirme sorumluluğunu üstlenmek için zaman, ilgi ve çaba harcamanız. Perakendede bu yetkinlik özellikle kritiktir çünkü sektörün en büyük zorluklarından biri turnoverdir. Yetenekli insanları büyütüp elde tutmak hem mağaza performansını hem organizasyonel sürekliliği doğrudan belirler. İçeriden büyüyen, kültürü bilen, sadık yönetici kadrosu kurumun en değerli varlığıdır.",
    skilled:["Başkalarını geliştirmeyi yüksek öncelik olarak görür; operasyonel koşuşturmanın arkasında bırakmaz","Koçluk, geribildirim, maruziyet ve zorlayıcı görevler aracılığıyla başkalarını aktif olarak geliştirir","Çalışanların kariyer gelişimi hedeflerini organizasyonun hedefleriyle hizalar; sadece kuruma değil, kişiye de yatırım yapar","Gelişimsel transferleri ve yan adımları destekler; kariyer her zaman yukarıya gitmek zorunda değildir, genişlemek de gelişimdir","Gerçek gelişim konuşmaları yapar — yalnızca performans değerlendirmesi değil, kariyer diyaloğu kurar"],
    lessskilled:["Başkalarını geliştirmek için zaman ayırmaz; 'işler yoğun, sonra bakarız' döngüsüne girer","Gelişim zorunluluklarını en kolay seçenekle geçiştirmek ister — form doldurur, gerçek koçluk yapmaz","Görünürlüğü paylaşmaktan kaçınır; yüksek profilli görevleri kendinde tutar","Gelişimsel geribildirim vermekten kaçınır; dönüştürücü konuşmayı sürekli erteler","Gelişimsel hamle ya da görev tanımlamakta güçlük çeker; insanı şu anki rolünün ötesinde göremez"],
    highlyskilled:["Yetenek gelişimini organizasyonel bir zorunluluk olarak görür; bu işi 'ekstra' değil, liderliğin özü olarak tanımlar","Kendi ekibinin dışına bakar; organizasyon genelinde gelişimsel fırsatları fark eder ve insanlarla paylaşır","Gelişim için kasıtlı olarak gerginlik ve zorluk yaratır; konfor alanının içinde büyüme olmadığını bilir"],
    overused:["Geliştirmeye o kadar odaklanır ki anlık iş sonuçları geri planda kalabilir; denge kayar","Herkesin her şeyde gelişmesini bekler; güçlü yönlere odaklanmak yerine her zayıflığı gidermeye çalışır","Gelişim için sabırsızlanır; öğrenme ve büyüme doğal zamanlarına ihtiyaç duyar, zorla hızlandırılamaz"],
    retail:"Eğitim müdürü, yeni gelen bir satış danışmanının müşteriyle konuşma biçimini fark eder — doğal, güven veren, dinleyen bir iletişim tarzı var. Üç ay içinde o kişiyi müşteri şikayet yönetimi projesine dahil eder. Danışman CV'sinde hiç olmayan bir deneyim kazanır. Altı ay sonra kat müdürü pozisyonu açılır — ilk adaylar listesinin en üstünde o danışman vardır.",
    interview:"'Ekibindeki birini aktif olarak geliştirdiğin, bu kişinin kariyer yolunu etkilediğin bir süreci anlat. Ne fark ettin? Ne yaptın? Nasıl bir sonuç aldın?'"
  },
  de:{
    def:"İnsanların organizasyonun hedeflerine ulaşmak için ellerinden gelenin en iyisini yapmak üzere motive olduğu bir çalışma iklimi yaratmak.",
    why:"İnsanlar bağlı olduğunda daha büyük şeyler olur. Bağlı çalışanlar daha üretkendirler — iş davranışları enerjik, odaklı ve organizasyonun ihtiyaçlarıyla daha uyumludur. Elde tutma oranları daha yüksektir. Pek çok sektördeki araştırmalar, çalışan bağlılığındaki artışın kârlılık, kalite, verimlilik, müşteri memnuniyeti ve yenilikte iyileşmelere yol açtığını ortaya koymaktadır. Perakendede bağlılık doğrudan müşteri deneyimine yansır — anlam hisseden, işine bağlı bir satış danışmanı ile 'neden burada olduğumu bilmiyorum' hissinde olan birinin müşteriye verdiği deneyim aynı değildir. Ama bağlılık tek tipli değildir: birini bağlayan şey diğerini bıktırabilir.",
    skilled:["İşi insanların hedef ve motivasyonlarına hizalayacak biçimde yapılandırır; anlam ve görevi buluşturur","Başkalarını güçlendirir; insanların kendi kararlarını alabildiğini ve bu kararların önemli olduğunu hissettirir","Her kişinin katkısının kuruma değer kattığını somut biçimde gösterir; 'senin yaptığın önemli' soyut değil, görünür olur","Görüş ve fikir paylaşımını davet eder; sahipliği ve görünürlüğü paylaşır","İnsanların motivasyonları ile organizasyonel hedefler arasında net bir bağlantı gösterir"],
    lessskilled:["Farklı tercih ve güdülere sahip insanlarla ilişki kurmakta güçlük çeker; herkesi aynı biçimde motive etmeye çalışır","Başkalarını neyin motive ettiğine dair çok az içgörüsü vardır; motivasyonun kişisel olduğunu fark etmez","İnsanlara işlerini yapmaları için yeterli esneklik ve özerklik tanımaz; sürekli denetler","Coşku yaratmak için az çaba sarf eder; ekip yönetimini teknik bir süreç olarak görür","Sahipliği ve görünürlüğü paylaşmaya isteksizdir; başarı kendisinde kalır"],
    highlyskilled:["Bireysel motivatörleri derinlemesine anlar ve işi buna göre yönlendirir; herkese özel bir bağlılık yaklaşımı uygular","Zorlu dönemlerde bile yüksek bağlılık ortamını sürdürür; belirsizlik ve baskı altında bile ekibe ilham verir","Ekip bağlılığını etkileyen faktörleri ölçer ve bu faktörleri proaktif olarak yönetir"],
    overused:["Bağlılık yaratmaya o kadar odaklanır ki zor kararları almaktan kaçınır; herkesin mutlu olmasını sağlamak adına gerekli ama rahatsız edici adımları erteler","Bağlılığı performansın önüne koyar; gerçek performans sorunlarını 'motivasyon eksikliği' olarak çerçeveler","Her kararı konsensüsle almak ister; ekibi dahil etmek güçlendirir ama her konuda onay aramak yavaşlatır"],
    retail:"Mağaza müdürü, her Pazartesi sabahı 10 dakikalık bir briefing yapıyor. Hedefleri değil, geçen haftadan bir anı paylaşıyor: 'Cuma günü Ayşe, sıradaki müşteriyi bekletmemek için kasaya geçti — kimse sormadı, kendisi gördü ve yaptı. Bu hafta hepimizin aklında olsun.' On dakika. Ama o hafta boyunca ekip birbirini görüyor ve 'bu mağazada doğru olanı yapmak değer görüyor' mesajını taşıyor.",
    interview:"'Ekip bağlılığının düştüğünü fark ettiğin ve durumu tersine çevirmek için harekete geçtiğin bir dönemi anlat. Sinyali nasıl fark ettin? Ne yaptın? Sonuç ne oldu?'"
  },
  pa:{
    def:"İşi organizasyonel hedeflerle uyumlu biçimde planlamak ve önceliklendirmek; taahhütleri karşılamak için doğru sırayla ilerlemek.",
    why:"İyi bir plan her şeyi kolaylaştırır. İyi planın belirgin işareti ise stratejik önceliklerle hizalanmış olmasıdır. Planlar bir temel oluşturur. Hizalanmış planlar sizi, ekibinizi ve tüm organizasyonu doğru yönde ilerletir. İnsanları organize eder ve odaklı kalmalarını sağlar. Kaynakların daha iyi kullanılmasına öncülük eder. Telaşı azaltır. Perakendede planlama yetersizliği direkt zarar üretir: yanlış zamanda yanlış stok, yetersiz personel, çakışan kampanya takvimleri, son dakika vardiya boşlukları. Gün içinde 'itfaiyeci modunda' çalışan lider ile sezonu kontrollü yöneten lider arasındaki en büyük fark burada başlar.",
    skilled:["Hedefleri geniş organizasyonel hedeflerle uyumlu biçimde belirler; kendi işini büyük resme bağlar","Hedefleri uygun inisiyatif ve eylem adımlarına kırar; soyut stratejiyi somut görevlere indirger","Faaliyetleri ilgili kilometre taşları ve takvimlerle birlikte aşamalandırır; ne zaman ne olacağı bellidir","Etkili acil durum planları geliştirir ve bunları gerektiğinde uygular; 'plan B' hazırdır","Taahhütleri karşılamak için zaman ve kaynakları dengeli yönetir; son dakika sürprizleri minimumdur"],
    lessskilled:["Daha büyük önceliklere dikkat etmeksizin anlık ihtiyaçlara takılır; her gün kendi kendine bir acil durum yaşanır","Zaman ve kaynakları net bir amaç doğrultusunda kullanmaz; emek harcar ama nereye gittiği belirsizdir","Acil durum planlarının eksikliği nedeniyle sorunlarla hazırlıksız yakalanır; şaşkınlık ile müdahale arasında değerli zaman kaybedilir","İlerlemeyi rastgele takip eder ya da hiç takip etmez; nerede olduğunu bilemez"],
    highlyskilled:["En yüksek önceliklere odaklanır ve daha az kritik görevleri bir kenara bırakabilir; 'hayır' diyebilme gücü vardır","Kaynakları tam olarak tahsis eden uygulama planları yapar; kim, ne zaman, neyle çalışacak netdir","Engelleri öngörür ve mükemmel acil durum planları hazırlar; 'ya bu olursa?' sorusunu önceden sorar"],
    overused:["Planlamaya çok zaman harcar; hazırlık aşaması eyleme geçişi geciktirir","Planlara ısrarla bağlı kalır; değişen koşullara ve yeni bilgilere uyum sağlamak için yeterli esneklik bırakmaz","Başkalarına plan yapmaları için gereken özerkliği vermez; her planı kendisi yapmak ister"],
    retail:"Sezon açılışı iki hafta sonra. Operasyon müdürü tüm değişkenleri tek bir plana döker: ürün teslimat tarihleri, vitrin değişim takvimi, ekstra personel vardiyaları, kampanya başlangıç ve bitiş günleri. Her departmana ne zaman ne yapacağını iletir. Açılış gününde sürpriz yok, her şey yerli yerinde. Komşu mağazada aynı açılış kaotik geçiyor — hiç planlamadılar.",
    interview:"'Karmaşık bir süreci planladığın, birden fazla değişken ve ekibin koordinasyonunu gerektiren bir durumu anlat. Planı nasıl oluşturdun? Beklenmedik bir şey çıktı mı ve nasıl uyum sağladın?'"
  },
  fa:{
    def:"Temel finansal göstergeleri anlayıp yorumlamak ve bu anlayışı daha iyi iş kararları almak için kullanmak.",
    why:"Perakendede finansal okuryazarlık olmadan mağaza yönetmek; gösterge paneline bakmadan araba sürmek gibidir. Finans, iş faaliyetlerinin çekirdeğindedir. Her organizasyonun birimi finansal sonuçlardan doğrudan ya da dolaylı olarak etkilenir. Ciro tek başına anlamsızdır — brüt kâr marjı, stok devir hızı, kayıp oranı ve personel gideriyle birlikte okunduğunda gerçek tabloyu gösterir. Bu sayıları sadece raporlamak değil, yorumlamak ve eyleme çevirmek finansal okuryazarlığın özüdür. Mağaza müdüründen bölge direktörüne kadar perakende kariyerinde ilerledikçe finansal bakış açısı giderek daha kritik hale gelir.",
    skilled:["Temel finansal göstergelerin anlamını ve sonuçlarını anlar; rakamlar ona bir şeyler söyler","Stratejik seçenekler ve fırsatlar üretmek için finansal analizi kullanır","Niceliksel ve niteliksel bilgiyi bütünleştirir; rakamların arkasındaki hikayeyi okur","Finansal kararların organizasyonun farklı işlevleri üzerindeki etkisini bağlar; siloda düşünmez","Bütçe süreçlerine aktif katılım sağlar; rakamları tartışabilir, savunabilir ve sorgulayabilir"],
    lessskilled:["Finansal terimler ve kavramlarla yeterli aşinalığı yoktur; brüt margin, stok devir hızı gibi kavramlar belirsizdir","Farklı iş işlevleri ile genel finansal performans arasındaki neden-sonuç ilişkilerini kavrayamaz","Sonuç çıkarmada finansal etkiyi göz ardı eder; kararlar finansal boyutuyla değerlendirilmez","Operasyonel başarıyı kârlılıktan bağımsız düşünür; 'satış iyi gitti' ile 'kâr iyi gitti' aynı şey değildir"],
    highlyskilled:["Finansal bilgiyi iş istihbarasına dönüştürür; nitel ve nicel bilgiyi analiz ve bütünleştirme yoluyla içgörü üretir","Performansı ölçmek, trendleri belirlemek ve sonuçları etkileyebilecek stratejiler önermek için temel finansal göstergeleri izler","Finansal verileri gelecek odaklı karar almada kullanır; geçmişe bakmakla kalmaz, ileriye projeksiyon yapar"],
    overused:["Finansal göstergeleri tek karar kriteri olarak kullanır; dar finansal sonuçlara odaklanan dengesiz bir organizasyonel performans görüşüne yol açar","Kısa vadeli finansal kazanımlar için uzun vadeli iş hedeflerini feda edebilir","İnsan boyutunu — ekip morali, müşteri ilişkisi, kültürel yatırım — sayısal olmadığı için görmezden gelir"],
    retail:"Mağaza müdürü aylık satış raporunu aldığında sadece ciroya bakmıyor. Brüt kâr marjını, iskonto oranını ve stok devir hızını birlikte okuyor. Satış yüzde sekiz arttı ama kâr marjı düştü — demek ki promosyon fazla agresifti. Bu bütünsel okuma olmadan 'iyi ay' deyip geçecekti. Finansal okuryazarlık budur: tek sayıya değil, sayılar arasındaki ilişkiye bakmak.",
    interview:"'Finansal bir göstergeyi takip edip buna göre bir karar aldığın ya da harekete geçtiğin somut bir durumu anlat. Hangi veriyi kullandın? Nasıl yorumladın? Sonuç ne oldu?'"
  },
  sm:{
    def:"Gelecekteki olasılıkları öngörebilmek ve bunları atılım yaratan stratejilere dönüştürmek.",
    why:"Stratejik olmak; geleceğe net niyetler ve amaçlı eylemlerle bakmak, planlamak ve hareket etmektir. Stratejik bir bakış açısı her ikisine de hazır olmayı gerektirir: hem taktiksel bugüne hem uzun vadeli yarına. Perakende sektörü bunu daha da kritik kılar. Kısa vadeli baskılar her zaman var olacak — haftalık satış hedefi, anlık müşteri şikayeti. Ama bu anlık meselelere gömülüp kalmak, organizasyonu uzun vadede rekabetsiz bırakır. Stratejik bakan bir lider; rakiplerin hareketini izler, tüketici davranışlarındaki değişimi okur, hem bugüne hem yarına hazırlanır. Değişimi önceden gören lider pozisyon alır; geç fark eden tepki verir.",
    skilled:["Kısa vadeli baskı altında uzun vadeli öneme sahip kararlardan vazgeçmez","Sektördeki trendleri ve rakip hareketlerini izleyerek kendi stratejisine entegre eder","Olası gelecek senaryolarını rahatlıkla gündeme taşır; 'ya şu olursa?' sorusunu sormaktan çekinmez","Sürdürülebilir değer yaratacak olasılıkların güvenilir tablolarını çizer","Vizyon ile eylem arasındaki net bağlantıyı gösteren rekabetçi stratejiler oluşturur"],
    lessskilled:["Operasyonel detaylara odaklanır; büyük resmi kaçırır","Strateji konuşmalarında fikir söylemekte zorlanır; taktik düzeyde kalır","Değişen koşullara tepkisel davranır; öngörü değil, yangın söndürme","Rakiplerin ve sektör trendlerinin farkında değildir; içe odaklı kalır"],
    highlyskilled:["Büyük resmi sürekli görür, gelecek senaryolar üretir ve sürdürülebilir rekabet avantajı yaratan stratejiler oluşturur","Vizyoner bir yapıya sahiptir; olasılıkların ve ihtimallerin güvenilir ve ilham veren tablolarını söze döker","Net bir strateji oluşturur ve organizasyonu stratejik hedeflerine açıkça hızlandıracak iddialı adımları belirler"],
    overused:["Stratejik fikirlere o kadar odaklanır ki günlük operasyonel ihtiyaçları ihmal eder","Planları aşırı karmaşık hale getirebilir; strateji anlaşılır ve uygulanabilir olmak zorundadır","Başkalarını geride bırakır; vizyon çok ilerideyse ekip bağlantısını kaybeder"],
    retail:"Bölge müdürü, bölgesindeki satış rakamları hedefte olsa bile müşteri memnuniyet puanının yavaş yavaş düştüğünü fark ediyor. Operasyon bunu 'stok sorunu' olarak kategorize etti. Bölge müdürü ise şunu görüyor: bu düşüş 6 ay sonraki müşteri kaybının habercisi. Ekip eğitimine yatırım yapıyor. Üç ay sonra puan yükseliyor.",
    interview:"'Uzun vadeli düşünerek aldığın ve kısa vadede fedakarlık ya da dirençle karşılaştığın bir kararı anlat. Neden o kararı aldın? Başkalarını nasıl ikna ettin? Bugün geriye dönüp bakınca o kararı nasıl değerlendiriyorsun?'"
  },
  nl:{
    def:"Yeni sorunlarla başa çıkarken deneyerek aktif öğrenmek; hem başarıları hem başarısızlıkları öğrenme kaynağı olarak kullanmak.",
    why:"Çoğumuz daha önce gördüğümüz ve yaptığımız şeyleri uygulamakta iyiyiz. Daha nadir bir beceri ise bir şeyi ilk kez yapmaktır. Hiç karşılaşılmamış sorunları çözmek. Hiç denenmemiş çözümleri uygulamak. Değişimin hızlanan temposuyla birlikte, yeni çözümler öğrenip uygulamak giderek daha kritik bir beceri haline geliyor. Bu yetkinlik risk almayı, mükemmeliyetçiliği bir kenara bırakmayı ve yeni yollar açmayı gerektiriyor. Perakendede yeni ürün kategorileri, değişen müşteri alışkanlıkları, dijital satış kanalları, yeni POS sistemleri — bunların hepsi hızlı öğrenmeyi zorunlu kılar. Öğrenmeyi öğrenmek, tüm diğer becerileri besleyen meta-beceridir.",
    skilled:["Yeni durumlarla karşılaştığında hızla öğrenir; adaptasyon sürecini kısaltır ve uygulamaya hızlı geçer","Doğru çözümü bulmak için denemeler yapar; deneysellik bir tehdit değil, araçtır","Tanıdık olmayan görevlerin zorluğunu kucaklar; yeni alan onu rahatsız etmez, meraklandırır","Başarısızlıklardan ve hatalardan dersler çıkarır; aynı hatayı tekrarlamamak için analiz yapar","Geçmiş deneyimlerden öğrendiklerini yeni ve farklı bağlamlara esnek biçimde uygular"],
    lessskilled:["Yeni durumlarda öğrenmekte güçlük çeker; tanıdık olmayan görevler önünde sıkışır","Denenip sınanmamış çözümlere şans vermekten kaçınır; bilinen yolda kalmayı tercih eder","Sorunları yalnızca geçmişte işe yarayan yöntemlerle çözer; bağlam değişse bile formül değişmez","Risk almaz; mükemmeliyetçilik ya da hata korkusu hareketi engeller","Hatayı öğrenme kaynağı değil, utanç kaynağı olarak görür; tekrar denemekten çekinir"],
    highlyskilled:["Doğru çözümü bulmak için birden fazla yöntem kullanarak defalarca deneme yapar; bırakmaz","Hataları öğrenme fırsatı olarak görür; veri kaynağı olarak sahiplenir","Tanıdık olmayan görevlerin zorluğundan keyif alır; bilinmezlik onu durdurmaz, tetikler"],
    overused:["Yeniliği o kadar sever ki yürürlükteki şeyleri gereksiz yere bozar; odak ve öncelik kaybolur","Henüz kanıtlanmamış fikirlere yalnızca yeni oldukları için odaklanır; seçici düşünme zayıflar","Öğrenme adına gereksiz riskler alır; deneysellik ile sorumsuzluk arasındaki sınır bulanıklaşır"],
    retail:"Mağazaya yeni bir dijital ödeme sistemi geliyor. Eğitim günü bir hafta sonra. Hızlı öğrenen satış danışmanı beklemiyor — sistemi kendi başına kurcalıyor, temel işlemleri öğreniyor. Eğitim günü geldiğinde sorularla geliyor, herkesten hızlı kavrıyor. Ertesi gün müşterilere yardımcı oluyor.",
    interview:"'Daha önce hiç yapmadığın bir şeyi öğrenmek zorunda kaldığın bir durumu anlat. Nasıl yaklaştın? Hangi engelleri yaşadın? Sonuç ne oldu?'"
  },
  br:{
    def:"Zorlu durumlarla karşılaşıldığında aksiliklerden ve sıkıntılardan sıyrılmak; güçlenerek devam etmek.",
    why:"Aksilikler çoğunlukla kaçınılmazdır. Özellikle bugünün talep yoğun ve zaman zaman dalgalı çalışma ortamında olası tuzaklar her yerdedir. En dayanıklı insanlar bile aksilikler yaşar. Fark, bu aksiliklere nasıl yanıt verdiklerinde yatar. Öngörürler. Doğrudan karşılarına çıkarlar. Dayanma kapasitesine sahiptirler. Perakendede her gün beklenmedik bir şey olur: müşteri şikayeti, stok krizi, personel yokluğu, satış baskısı. Dayanıklı olmayan kişi her sarsıntıdan sürüklenirken, dayanıklı olanlar aynı koşulları yaşar — ama geri dönerler. Ve sadece önceki seviyeye değil, çoğu zaman daha güçlü dönerler.",
    skilled:["Baskı altında kendinden emin ve kararlı kalır; stres performansını düşürmez","Krizleri etkili biçimde yönetir; panik yerine netliği tercih eder","Olumsuz koşullara rağmen olumlu bir tutum ve ileriye dönük bir bakış açısını sürdürür","Aksiliklerden toparlanır; önceki performans, güven ve tatmin düzeyine hızla geri döner","Zorluklardan ve olumsuz deneyimlerden büyür; şikayet yerine öğrenme alışkanlığı geliştirir"],
    lessskilled:["Yüksek baskılı durumlarda kolayca sarsılır; sakinliğini ve netliğini kaybeder","Stres ve kaygı dönemlerinde düşük enerji ve motivasyon sergiler; verimlilik düşer","Eleştiri ya da engellerle karşılaşınca savunmaya geçer; sorunu çözmek yerine kendini savunur","Aksiliklerden toparlanmak fazla zaman alır; etkisi günler ya da haftalar boyunca sürer","Değişken ortamlarda anksiyete yaşar; değişimle stresi birbiriyle karıştırır"],
    highlyskilled:["Stresli durumlarda odaklı ve dengeli kalır; sakinliğini yalnızca kendisi için değil, çevresi için de sürdürür","Başarısızlıktan sistematik biçimde öğrenir; analiz eder, neyi değiştireceğini netleştirir","Dayanıklılığı kasıtlı olarak inşa eder; stres yönetimi ve yeniden şarj etme alışkanlıkları geliştirir"],
    overused:["O kadar dayanıklıdır ki gerçekten ciddi sorunlara 'bu da geçer' diyerek geç müdahale eder","Strese katlanma kapasitesi yüksek ama bu kapasitenin sınırlarını görmez; destek istemekte güçlük çeker","Zorlu durumların etkisini ya da ciddiyetini küçümser; başkalarının yaşadığı güçlüğü kavrayamaz"],
    retail:"Cumartesi, yoğun sezon, bir satış danışmanı art arda dört zor müşteriyle karşılaşıyor. Öğle arasında 10 dakika gerçek bir mola veriyor. Öğleden sonra aynı enerjiyle geri dönüyor. Akşam eve yorgun gidiyor ama öfkeli değil. Tükenmişliği günün içinde taşımıyor. Dayanıklılık budur — duyguyu bastırmak değil, yönetmek.",
    interview:"'Gerçekten zorlandığın bir dönemi anlat — hem profesyonel hem kişisel baskının aynı anda geldiği bir zaman. O dönemde nasıl hissettin? Nasıl baş ettin? O deneyim seni nasıl değiştirdi?'"
  },
  is:{
    def:"Çeşitli insan gruplarıyla açık ve rahat biçimde ilişki kurabilmek.",
    why:"İlişki yönetimi, organizasyonlarda işlerin yürütülmesinin ayrılmaz bir parçasıdır. Her türlü insanla geçinmenin anahtarı, önce kişisel tepkileri geri çekmek ve önce karşındakine odaklanmaktır. Perakendede bu yetkinlik hem müşteriyle hem ekiple hem de yönetimle sürekli devrededir. Lüks segment mağazasında bir müşteriyle kurulan ilişkinin tonu, fast fashion mağazasındakinden farklıdır. Yeni işe başlayan biriyle konuşma tonu, on yıllık deneyimliye göre ayarlanır. En iyi ilişki yöneticileri bu farkları otomatik okur — bir müşteriyle, bir kat müdürüyle, bir bölge direktörüyle eşit rahatlıkta konuşabilirler.",
    skilled:["Kademeler, fonksiyonlar, kültürler ve coğrafyalar genelinde insanlarla rahatça ilişki kurar; herkesle ortak dil bulur","Diplomasi ve incelikle hareket eder; hassas konularda bile ilişkiyi koruyarak ilerler","Açık, sıcak ve kabul edici bir biçimde bağ inşa eder; karşısındaki kendini görülmüş hisseder","Kendine benzeyen ve benzemeyen insanlarla yapıcı ilişkiler kurar; farklılık engel değil, zenginliktir","Kişilerarası ve grup dinamiklerini okur; odada ne döndüğünü fark eder"],
    lessskilled:["Az sayıda ilişki kurar; öncelikle kendi çalışma alanındaki insanlarla etkileşime girer","Kendinden farklı insanlarla etkileşime geçerken rahatsızlık hisseder; çeşitlilik stres vericidir","Fikirlerini küçük düşürücü ya da duyarsız biçimde ifade eder; taktik ve diplomasi eksiktir","Başkalarının ihtiyaçlarına karşı az ilgi gösterir; kendi gündemini öne çıkarır","Eleştiri karşısında savunmaya geçer; ilişkiyi zedeleyecek tepkiler verir"],
    highlyskilled:["Çok çeşitli insanlarla proaktif biçimde ilişki geliştirir; ağını bilinçli ve geniş tutar","Zor ya da gergin durumlarda bile anlık bağ kurar; baskı altında ilişki yönetimi becerisi azalmaz","Birlikte çalışması güç kişilerle bile üretken ve saygılı bir ilişki sürdürür"],
    overused:["Herkes tarafından sevilmek ister; bu net sınır koymayı ve zor mesajları iletmeyi zorlaştırır","Aşırı uyum sağlama eğilimi özgün duruşu ve bakış açısını gizleyebilir","Çatışmayı yönetmek yerine kaçınır; uyumu korumak adına gerçeği söylemez"],
    retail:"Kıdemli satış danışmanı, aynı vardiyada iki çok farklı müşteriyle karşılaşıyor: biri deneyimli ve aceleci bir üst düzey yönetici, diğeri mağazaya ilk kez giren genç bir müşteri. Danışman ikisine de aynı içtenlikle ama tamamen farklı bir yaklaşımla hizmet veriyor — birine özlü ve keskin, diğerine sabırlı ve yönlendirici. Müşteri farkı hissediyor ve memnun ayrılıyor.",
    interview:"'Başlangıçta zorlandığın ama zamanla üretken ve güçlü bir ilişkiye dönüştürdüğün bir kişiyle deneyimini anlat. Neden zordu? Ne yaptın? Ne öğrendin?'"
  },
  mc:{
    def:"Çatışma durumlarını gürültüyü asgari düzeyde tutarak etkili biçimde yönetmek.",
    why:"Çatışma, organizasyonların doğal bir parçasıdır. Organizasyonlar farklı görüşlere ve rekabet eden çıkarlara sahip çeşitli insanlardan oluşur. Kötü yönetilen çatışma tutumları pekiştirir, üretkenliği bozar ve ilişkileri zedeler. Ama çatışma her zaman kötü bir şey değildir. Çatışma daha önce tartışılamayan konuları yüzeye çıkarır. İyi yönetilen çatışma; daha iyi alternatifler ve hatta atılım noktaları bulmak için bir forum sağlar. Perakendede çatışma hem müşteri-personel hem de personel arası boyutta sürekli gündemdedir. Çatışmayı iyi yöneten lider bunları küçük yaparken alevlendirilmeden önce söndürür.",
    skilled:["Çatışmalara fırsat olarak bakar; kaçınmak yerine üzerine gider ve ele alır","Zor anlaşmaları çözer ve anlaşmazlıkları adil biçimde yönetir; her iki taraf da dinlendiğini hisseder","Farklı görüşleri bütünleştirerek ve ortak zemin bularak atılım noktaları yaratır","Farklılıkları üretken biçimde ve gürültüyü minimumda tutarak yönetir; gerilim büyümeden çözülür","Çatışmanın altındaki gerçek sorunu tespit eder; belirtiye değil, kök nedene odaklanır"],
    lessskilled:["Çatışmadan kaçınır; gerilimi görmezden gelir ya da kendiliğinden çözümlenmesini bekler","Anlaşmazlıkları çözerken ilerleme kaydeder güçlük çeker; konuşma yeniden başladığı yerden devam eder","Konuları tam anlamadan taraf tutar; yüzeysel okuma yapar, derine inmez","Çatışmaların organizasyonda büyük aksaklıklara yol açmasına izin verir; erken müdahale etmez","İnsanları savunmaya sokar; diyalog açmak yerine baskı uygular"],
    highlyskilled:["Kişilerarası ve grup dinamikleri bilgisine dayanarak çatışmaları olmadan önce öngörür; proaktif müdahale eder","Soru sorar ve paydaşlar tarafından ortaya konan tüm meseleleri yakından dinler; her tarafın duyulduğunu hissettirmek için çaba gösterir","Ortak zemin bulur ve konsensüse ulaşmak için yönlendirir; yüksek gerginlikli durumları etkili biçimde yatıştırır"],
    overused:["Başkalarının meselelerine karışıyormuş gibi görülebilir; her çatışmaya müdahil olmak güven sınırlarını zorlar","Tartışmaya çok heveslidir; her farklı görüşü derinleştirilmesi gereken bir çatışma olarak ele alır","Taraflar hazır olmadan çözüme iter; zamanlamanın da yönetilmesi gerektiğini unutur"],
    retail:"İki satış danışmanı, popüler bir ürünü kimin müşterisine sunduğu konusunda gerilim yaşıyor. Kat müdürü bunu fark eder ve aynı gün ikisiyle ayrı ayrı görüşüyor. Sonra ikisini birlikte oturtuyor: 'Amacımız müşterinin memnun ayrılması — bunu nasıl birlikte yapabiliriz?' Net bir alan paylaşım kuralı ortaya çıkıyor. Çatışma yönetimi budur: taraf tutmadan, dinleyerek ve çözümü birlikte üretmek.",
    interview:"'Ekip içinde ya da müşteriyle ciddi bir çatışma yaşandığı ve doğrudan müdahale etmek zorunda kaldığın bir durumu anlat. Süreci nasıl yönettin? Zorlandığın an hangisiydi? Sonuç ne oldu?'"
  },
  ci:{
    def:"Organizasyonun başarılı olması için yeni ve daha iyi yollar yaratmak.",
    why:"Organizasyonlar sürekli değişen rekabet ortamında hayatta kalmak ve gelişmek için yeniliğe ihtiyaç duyar. Perakendede yenilik hayatta kalmanın koşuludur. Müşteri beklentileri yükseliyor, rekabet kızışıyor, alışveriş davranışları dönüşüyor. Vitrin düzeni, müşteri yolculuğu tasarımı, personel eğitim yöntemleri — bunların hepsi 'hep böyle yapıldı' kalıplarının dışına çıkmayı bekliyor. Doğası gereği yaratıcı olmayan biri bile bu yetkinliği geliştirebilir: merak etmeyi ve sormayı öğrenmek, kalıpların dışına çıkmak için bilinçli alan açmak ve başkalarının farklı düşünmesini teşvik etmek bu yetkinliğin somut ifadeleridir.",
    skilled:["Yeni, daha iyi ya da özgün olan kullanışlı fikirler üretir; sıradan çözümlerde kalmaz","Sorunlara bakmanın yeni yollarını gündeme taşır; mevcut çerçevenin dışından bakar","Yaratıcı bir fikri alır ve pratiğe geçirebilir; hayal gücüyle uygulama kapasitesini birleştirir","Yeniliği teşvik etmek için çeşitli düşünceleri cesaretlendirir; başkalarının farklı düşünmesine alan açar","Statükoya sorular sorar; 'neden böyle?' ve 'daha iyi nasıl?' sorularını rutin gündeme taşır"],
    lessskilled:["Yeni bakış açılarıyla denemeler yapmak yerine konfor alanında kalmayı tercih eder","Geçmişten gelen olağan, alışılmış ve bilinen fikirler sunar; yenilik boyutu eksiktir","Başkalarının özgün fikirlerini eleştirmeye meyillidir; yeni fikirlerin ilk eleştirmeni olur","Bir tarzı vardır ki başkalarının yaratıcı girişimlerini caydırır; 'olmaz' refleksi çabuktur"],
    highlyskilled:["Geleneksel yapma biçimlerinin ötesine geçer; statükoyu sorgular ve zorlar","Yenilikçi bir fikrin pazar potansiyelini sürekli değerlendirir; hayal ile gerçeklik arasındaki mesafeyi ölçer","En iyi fikirleri organize eder ve hayata geçirilene kadar takip eder; sadece üretmekle kalmaz, tamamlar"],
    overused:["Yeniliği o kadar sever ki yürürlükteki şeyleri gereksiz yere bozar; istikrar ve tutarlılık zarar görür","Henüz kanıtlanmamış fikirlere peşi sıra gider; odak ve öncelik kaybolur","Altta yatan sorunları görmezden gelerek yeniliklere atlamaya hazırdır; kökteki sorunu çözme disiplini eksik"],
    retail:"VM koordinatörü, yeni sezonda müşteri akış verilerine bakıyor. Soldan giren müşterilerin sağ vitrini neredeyse hiç görmediğini fark ediyor. Standart uygulama 'her zaman böyle yapılır' diyor, ama o farklı bir yerleşim öneriyor. İki haftanın sonunda sağ vitrin ürünlerine yüzde yirmi daha fazla ilgi var. Yenilik büyük keşifler değildir her zaman — alışkanlıkları sorgulamak ve veriye bakmak da yeniliğin ta kendisidir.",
    interview:"'Mevcut bir süreci, ürünü ya da deneyimi geliştirmek ya da değiştirmek için öncülük ettiğin bir durumu anlat. Fikri nereden buldun? Nasıl hayata geçirdin? Karşılaştığın dirençler nelerdi? Sonuç ne oldu?'"
  },
  pe:{
    def:"Başkalarının desteğini ve bağlılığını kazanmak için ikna edici argümanlar kullanmak.",
    why:"İşler ilişkiler aracılığıyla yürütülür. Bazen başkalarını bakış açılarını değiştirmeye ve harekete geçmeye ikna etmeden şeyleri gerçekleştirmek mümkün olmaz. Etkili ikna; mesajın ustaca iletilmesini ve kitleye uygun biçimde ayarlanmasını gerektirir. Perakendede ikna etme her düzeyde devrededir: satış danışmanı müşteriye doğru ürünü sunarken, mağaza müdürü bölge müdürüne yeni bir uygulama önerisini savunurken, VM müdürü merkeze görsel konsepti sunarken — hepsi ikna becerisini kullanmaktadır. Kalpleri ve zihinleri kazanmayı öğrenmek, kariyer boyunca kümülatif bir avantaj inşa eder.",
    skilled:["Destek kazanmak için görüş ve argümanlarını kitleye uygun biçimde konumlandırır; tek tip sunmaz","Başkalarını harekete geçmeye ikna eder; fikri onaylatan değil, eylemi başlatan","Zor durumlarda ustaca müzakere eder; çıkmaz sokaklarda yol bulur","İlişkilere zarar vermeksizin tavizler elde eder; kazan-kazan zemini arar","Başkalarının tepkilerine ve tutumlarına etkili biçimde yanıt verir; savunmaya geçmez, diyalog açar"],
    lessskilled:["Kendi bakış açısını çok güçlü biçimde dayatır; karşısındaki direnç geliştirmeye başlar","Başkalarından destek ya da bağlılık kazanamaz; fikir kabul görmeden ölür","Herkesi tatmin edecek çözümler müzakere edemez; ya olduğu gibi kabul eder ya da çatışır","Başkalarının tutum ve tepkilerine olumsuz biçimde yanıt verir; itiraz geldiğinde kaybeder","Kendi pozisyonunu destekleyen mantıklı bir argüman oluşturmakta güçlük çeker"],
    highlyskilled:["Başkalarından bağlılık kazanan ikna edici biçimde fikirlerini paylaşır; dinleyen sadece anlamakla kalmaz, sahiplenir","Ustaca müzakere eder ve mutabık kalınan çözüme doğru ilerlerken minimal gürültü yaratır","Birden fazla paydaşın ihtiyaçlarını karşılayan ortak zemin ve kabul edilebilir alternatifler bulur"],
    overused:["Sürekli ikna etmeye çalışmak yorgunluğa yol açar; insanlar her konuşmasının bir 'satış' olduğunu hisseder","Dinlemek yerine konuşmayı tercih eder; ikna etmek isterken aslında başkasını sessize alır","Aşırı ısrarcı olur; 'hayır' cevabını kabul etmekte güçlük çeker ve ilişkiyi zorlar"],
    retail:"Mağaza müdürü, mağazanın arka alanının müşteri girişine dönüştürülmesini bölge müdürüne öneriyor. Bölge müdürü başlangıçta kuşkulu. Müdür müşteri trafik verisini sunuyor, iki benzer mağazadaki uygulamadan örnekler gösteriyor, altı ayda geri dönen bir maliyet projeksiyonu çiziyor. Ayrıca bölge müdürünün en çok önem verdiği müşteri memnuniyeti konusuna sunumunu bağlıyor. Onay geliyor.",
    interview:"'Zor ya da dirençli birini ya da grubu ikna etmek zorunda kaldığın bir durumu anlat. Nasıl hazırlandın? Hangi argümanları kullandın? Direnç geldiğinde ne yaptın? Sonuç ne oldu?'"
  },
  ts:{
    def:"İş büyütmeye yönelik dijital ve teknoloji uygulamalarındaki yenilikleri öngörmek ve benimsemek.",
    why:"Teknoloji, imkânsız görüneni olağan hale getirdi. Bozucu teknolojiler inanılmaz bir hızla pazara giriyor. Dijital yetkinlik artık 'sahip olmak güzel' değil — 'olmazsa olmaz' kategorisindedir. Perakendede teknoloji dönüşümü somut ve hızlıdır: POS sistemleri, mobil ödeme, e-ticaret entegrasyonu, müşteri verisi analitik araçları, omnichannel sipariş yönetimi — bunların hepsi gündelik gerçektir. Teknolojiye direnen ya da yavaş adapte olan çalışanlar hem müşteri deneyimini zedeler hem kariyer fırsatlarını kaçırır. Dijital yetkinlik; bir IT uzmanı olmak değildir — işe yarayan teknolojiyi hızla öğrenip uygulamak, yeni araçların iş değerini görmek ve gereksiz olanları eleyebilmektir.",
    skilled:["Ortaya çıkan teknolojilerin etkisini öngörür ve gerekli uyarlamaları yapar; değişim onu hazırlıksız yakalamaz","İş ya da kişisel performansa fayda sağlayabilecek yeni teknik beceriler ve yetenekler için çevresini tarar","Düşük etkili ya da moda teknolojileri reddeder; her yeniliğe kapılmaz, seçici değerlendirme yapar","Yeni teknolojileri hazır bir şekilde öğrenir ve benimser; adaptasyon süreci kısadır"],
    lessskilled:["Temel teknoloji araçlarında deneyimsizdir ya da mevcut uygulamalara o kadar bağlıdır ki yeni teknolojileri benimsemekte isteksizdir","İş değeri katabilecek yeni ya da yenilikçi teknolojileri aramaz; fırsatları kaçırır","Teknoloji değişimini tehdit olarak görür, kolaylaştırıcı olarak değil; direnç gösterir","Sadece bildiği araçları kullanır; öğrenme döngüsünü başlatmakta güçlük çeker"],
    highlyskilled:["Teknoloji atılımları için çevresini sürekli tarar; erken benimseyenler arasındadır","Kurumsal sonuçları geliştiren mevcut ve yeni teknolojileri hem dener hem uygular","Başkalarının yeni teknolojileri öğrenmesini ve benimsemesini teşvik eder; dijital dönüşümde lokomotif işlevi görür"],
    overused:["Her yeni teknolojiyi denemek ister; odak ve öncelik kaybolur, organizasyon 'teknoloji yorgunluğu' yaşar","Teknoloji çözümüne o kadar odaklanır ki insani boyutu ve süreç gerçekliğini göz ardı eder","Teknolojik yeniliği amacın önüne koyar; 'neden?' sorusunu sormadan 'nasıl?' sorusuna atlar"],
    retail:"Mağazaya yeni bir müşteri sadakat uygulaması geliyor. Çoğu çalışan 'bir süre sonra öğrenirim' diyor. Bir satış danışmanı ise o gün akşam uygulamayı kendi telefonuna indiriyor, müşteri gözünden deneyimliyor ve ertesi gün müşterilere nasıl kullanacaklarını anlatıyor. İki hafta sonra en yüksek müşteri kayıt oranına sahip çalışan o.",
    interview:"'Yeni bir teknoloji, sistem ya da dijital araç öğrenmek zorunda kaldığın bir durumu anlat. Nasıl başladın? Hangi zorluklarla karşılaştın? Bu öğrenme süreci işine nasıl katkı sağladı?'"
  },
  dq:{
    def:"Organizasyonun ilerlemesini sağlayacak iyi ve zamanında kararlar almak.",
    why:"İyi karar almak zorlu olabilir: kısa zaman çerçeveleri, sınırlı bilgi, zor ödünleşimler karşısında cevap bekleyen sabırsız insanlar. İyi kararlar analiz, bilgelik, deneyim ve yargının karışımına dayanır. Sorun şu ki insanlar karar almada pek de iyi değildir — yargı yapma yeteneklerini abartma ve sonuçları tahmin etmede aşırı özgüvenli olma eğilimi taşırlar. Perakendede karar kalitesi hem anlık hem stratejik boyutuyla sürekli gündemdedir. Mağaza müdürü gün içinde onlarca operasyonel karar alır — çoğu eksik bilgiyle. Bu kararların kalitesi hem anlık müşteri deneyimini hem uzun vadeli mağaza performansını belirler.",
    skilled:["Eksik bilgi karşısında bile sağlam kararlar alır; belirsizlik felç etmez","Karar alırken analiz, bilgelik, deneyim ve yargının karışımına başvurur; tek kaynağa bağlı kalmaz","İlgili tüm faktörleri değerlendirir ve uygun karar alma kriterlerini ve ilkelerini kullanır","Hızlı bir %80 çözümün yeterli olacağını ne zaman fark eder; mükemmeli, iyinin düşmanı yapmaz"],
    lessskilled:["Kararlara gelişigüzel yaklaşır ya da karar almayı geciktirir; 'biraz daha bekleyelim' döngüsüne girer","Eksik veri ya da hatalı varsayımlara dayanarak kararlar alır","Farklı bakış açılarını görmezden gelir ya da uzun vadeli hedefler pahasına kısa vadeli sonuçlara odaklanır","Sonuçları yeterince değerlendirmez; karar alırken 'peki sonra ne olur?' sorusu sorulmaz"],
    highlyskilled:["Eksik bilgiye ya da belirsizliğe rağmen kararlı biçimde yüksek kaliteli kararlar alır","Zamanında ve iyi bilgilendirilmiş kararlar almak için ilgili kaynaklardan aktif olarak görüş alır","Görüşleri olgulardan ustalıkla ayırır; neyin veri, neyin yorum, neyin önyargı olduğunu fark eder"],
    overused:["Deneyim ve sezginin yeterli olacağı durumlarda bile aşırı titiz ya da metodolojik bir karar süreci uygular; ağır işler","Kararları o kadar çok analiz eder ki zaman ve momentum kaybedilir; analiz felci yaşanır","Her kararda konsensüs arar; bazı durumlar hızlı ve bağımsız karar gerektirir"],
    retail:"Sezonun en yoğun haftasında iki mağazanın aynı anda personel açığı var. Bölge müdürü fazla analiz yapmak yerine şunu soruyor: 'Hangi mağazada müşteri trafiği daha yüksek bu hafta? Hangisinde deneyimli personel var ki kısa süre desteksiz çalışabilsin?' İki soruyla yeterli bilgiye ulaşıyor. Karar kalitesi, mükemmel bilgiyle değil — doğru soruyla başlar.",
    interview:"'Eksik bilgiyle ya da baskı altında önemli bir karar almak zorunda kaldığın bir durumu anlat. Nasıl düşündün? Hangi faktörleri değerlendirdin? Sonuç ne oldu ve o kararı bugün yeniden alsaydın ne yapardın?'"
  },
  op:{
    def:"İşleri tamamlamanın en etkili ve verimli yollarını bilmek; sürekli iyileştirme odağıyla çalışmak.",
    why:"Harika süreçler işi basitleştirir. İletişimi akıcı hale getirir. Maliyetleri düşürür ve verimliliği artırır. Süreç; basit iş görevi planlamasından karmaşık tedarik zinciri yönetimine kadar her şeye değer. Rasyonalize edilmiş süreçler; kalite, müşteri memnuniyeti, satış ve kârlılık üzerinde iyileşmeler sağlar. Perakendede süreç optimizasyonu; stok alım akışından müşteri iade sürecine, vardiya devir tesliminden kasa kapanış prosedürlerine kadar uzanır. Verimsiz bir süreç sessizce büyük maliyetler üretir: zaman kaybı, hata, müşteri hayal kırıklığı ve personel yorgunluğu. Süreci göremeyen lider, fırsatı göremeyen liderdir.",
    skilled:["İşi tamamlamak için gerekli süreçleri tanımlar ve oluşturur; belirsizlik içinde çalışmaz","Faaliyetleri verimli iş akışlarına göre ayırır ve birleştirir; hangi adımın nereye gittiğini bilir","Uzaktan yönetimi mümkün kılan süreç ve prosedürler tasarlar; her şeyi kendisi kontrol etmek zorunda kalmaz","Küçük ince ayarlardan tam yeniden mühendisliğe kadar süreçleri iyileştirmenin yollarını arar"],
    lessskilled:["Dağınık bir şekilde çalışır; işleri örgütlemekte güçlük çeker","İyileştirmeye odaklanmaz; 'hep böyle yapıldı' anlayışıyla yetinir","Şeyleri sistemler açısından düşünmez; bir değişikliğin diğer adımları nasıl etkilediğini görmez","İşleri tamamlamak için etkili ve verimli süreçleri bulmakta güçlük çeker","Mevcut süreçleri olduğu gibi kabul eder; süreç iyileştirmesine çok az dikkat eder"],
    highlyskilled:["En kritik süreçlere odaklanır, daha az önemli görevleri bir kenara bırakabilir; öncelik sezgisi güçlüdür","Kaynakları tam olarak tahsis eden uygulama planları hazırlar","Engelleri öngörür ve mükemmel acil durum planları hazırlar; 'bu adım bozulursa ne olur?' sorusu sürekli gündemdedir"],
    overused:["Sürece o kadar odaklanır ki insanı ve esnekliği gözden kaçırır; her durum bir prosedür haline gelir","Küçük sorunları büyük ve resmi süreç güncellemeleriyle çözer; orantısız tepki verir","Değişmeyen bir süreç takıntısıyla koşulların gerektirdiği anlık adaptasyona direnç gösterir"],
    retail:"Stok sorumlusu, ürünlerin raftan çekildikten sonra sisteme girilmesinin bazen bir-iki gün geciktiğini fark ediyor. Küçük bir sorun gibi görünüyor. Ama etkisini izliyor: satış danışmanları stokta olmayan ürünü satıyor, müşteri hayal kırıklığı yaşıyor, iadeler artıyor. Sorunu rapor etmek yerine süreci değiştiriyor: çekimler gerçek zamanlı sisteme giriyor, vardiya sonunda bir kontrol noktası ekleniyor. İki hafta içinde iade yüzde kırk düşüyor.",
    interview:"'Verimsiz bir süreci fark edip iyileştirdiğin bir durumu anlat. Sorunu nasıl tespit ettin? Ne değiştirdin? Hangi dirençle karşılaştın? Sonuç ne oldu?'"
  },
  bs:{
    def:"Birden fazla paydaşın ihtiyaçlarını öngörmek ve dengelemek.",
