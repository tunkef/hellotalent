<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yetkinliklerim — Mockup v4</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--verm:#C94E28;--navy:#1E2D5E;--bg:#F7F6F4;--border:#E5E3DF;--muted:#6B7280;--text:#111111}
body{font-family:"Plus Jakarta Sans",sans-serif;background:var(--bg);min-height:100vh;padding:24px 16px}
.wrap{max-width:900px;margin:0 auto}
.yk-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:10px}
.yk-title{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;font-weight:700;color:var(--navy)}
.yk-sub{font-size:13px;color:var(--muted);margin-top:3px}
.yk-tier-toggle{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);border-radius:20px;padding:3px 6px}
.yk-tier-btn{padding:5px 14px;border-radius:16px;border:none;cursor:pointer;font-family:"Plus Jakarta Sans",sans-serif;font-size:12px;font-weight:500;transition:all .2s}
.yk-tier-btn.active{background:var(--navy);color:#fff}
.yk-tier-btn:not(.active){background:transparent;color:var(--muted)}
.search-section{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:20px;margin-bottom:24px}
.search-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.search-title{font-family:"Bricolage Grotesque",sans-serif;font-size:15px;font-weight:600;color:var(--navy)}
.search-badge{background:#EEF2FF;color:var(--navy);font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;letter-spacing:.3px}
.search-bar{display:flex;gap:8px}
.search-input{flex:1;height:40px;border:1.5px solid var(--border);border-radius:10px;padding:0 14px;font-family:"Plus Jakarta Sans",sans-serif;font-size:13px;color:var(--text);outline:none;transition:border-color .2s;background:#fff}
.search-input:focus{border-color:var(--navy)}
.search-input::placeholder{color:#9CA3AF}
.search-btn{height:40px;padding:0 18px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-family:"Plus Jakarta Sans",sans-serif;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.search-hints{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hint-chip{padding:4px 10px;background:var(--bg);border:1px solid var(--border);border-radius:12px;font-size:11px;color:var(--muted);cursor:pointer;transition:all .15s}
.hint-chip:hover{border-color:var(--verm);color:var(--verm);background:#FEF3F0}
.search-result{margin-top:14px;padding:14px;background:var(--bg);border-radius:10px;display:none}
.search-result.show{display:block}
.sr-role{font-family:"Bricolage Grotesque",sans-serif;font-size:14px;font-weight:600;color:var(--navy);margin-bottom:10px}
.sr-comps{display:flex;flex-wrap:wrap;gap:6px}
.sr-comp{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:10px;font-size:11px;font-weight:600}
.sr-comp.core{background:#FEF3F0;color:var(--verm);border:1px solid #F9C3B3}
.sr-comp.important{background:#EEF2FF;color:var(--navy);border:1px solid #C7D2FE}
.sr-comp.nice{background:#F3F4F6;color:var(--muted);border:1px solid var(--border)}
.freemium-hero{background:linear-gradient(135deg,#2A3F7A 0%,var(--navy) 50%,#162247 100%);border-radius:16px;padding:24px;margin-bottom:20px;position:relative;overflow:hidden}
.fh-deco{position:absolute;top:-30px;right:-30px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.04);pointer-events:none}
.fh-deco2{position:absolute;bottom:-40px;right:60px;width:100px;height:100px;border-radius:50%;background:rgba(201,78,40,.12);pointer-events:none}
.fh-tag{display:inline-flex;align-items:center;gap:5px;background:rgba(201,78,40,.2);border:1px solid rgba(201,78,40,.4);border-radius:12px;padding:4px 10px;font-size:11px;font-weight:600;color:#FCA47A;margin-bottom:12px}
.fh-role{font-family:"Bricolage Grotesque",sans-serif;font-size:20px;font-weight:700;color:#fff;margin-bottom:6px;line-height:1.3}
.fh-msg{font-size:13px;color:rgba(255,255,255,.65);line-height:1.6;max-width:480px;margin-bottom:18px}
.fh-msg strong{color:rgba(255,255,255,.9)}
.fh-actions{display:flex;gap:10px;flex-wrap:wrap}
.fh-btn-primary{padding:9px 20px;background:var(--verm);color:#fff;border:none;border-radius:10px;font-family:"Plus Jakarta Sans",sans-serif;font-size:13px;font-weight:600;cursor:pointer}
.fh-btn-secondary{padding:9px 20px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;font-family:"Plus Jakarta Sans",sans-serif;font-size:13px;cursor:pointer}
.fh-stats{display:flex;gap:20px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
.fh-stat-num{font-family:"DM Mono",monospace;font-size:18px;font-weight:500;color:#fff}
.fh-stat-label{font-size:11px;color:rgba(255,255,255,.5);margin-top:1px}
.summary-card{background:var(--navy);border-radius:16px;padding:20px 24px;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.summary-stats{display:flex;gap:24px}
.stat-item{text-align:center}
.stat-num{font-family:"DM Mono",monospace;font-size:24px;font-weight:500}
.stat-label{font-size:11px;opacity:.6;margin-top:2px}
.stat-strong .stat-num{color:#4ADE80}
.stat-growing .stat-num{color:#FCD34D}
.progress-track{height:5px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden;width:220px;margin-top:10px}
.progress-fill{height:100%;background:#fff;border-radius:3px;transition:width .4s ease}
.section-label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px}
.role-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.role-pill{padding:7px 16px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;color:var(--text)}
.role-pill.active{border-color:var(--verm);background:#FEF3F0;color:var(--verm)}
.unlock-progress{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px}
.up-track{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.up-fill{height:100%;background:linear-gradient(90deg,var(--verm),#E8693E);border-radius:4px;transition:width .5s ease}
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px;margin-bottom:20px}
.comp-card{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:16px;transition:all .2s;position:relative;overflow:hidden;cursor:pointer}
.comp-card:hover{border-color:#C4B5B0;transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.06)}
.comp-card.rated-strong{border-color:#15803D;background:#F0FDF4}
.comp-card.rated-growing{border-color:#B45309;background:#FFFBEB}
.lock-overlay{position:absolute;inset:0;background:rgba(247,246,244,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:12px;backdrop-filter:blur(3px)}
.lock-icon{width:32px;height:32px;background:var(--navy);border-radius:50%;display:flex;align-items:center;justify-content:center}
.lock-label{font-size:11px;font-weight:600;color:var(--navy);text-align:center;line-height:1.4}
.comp-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.comp-top-left{display:flex;align-items:flex-start;gap:10px}
.comp-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.comp-icon svg{width:18px;height:18px}
.comp-name{font-family:"Bricolage Grotesque",sans-serif;font-size:14px;font-weight:600;color:var(--navy);line-height:1.3}
.comp-kf{font-size:10px;color:var(--muted);font-family:"DM Mono",monospace;margin-top:2px}
.info-btn{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;color:var(--muted)}
.info-btn:hover{border-color:var(--navy);color:var(--navy);background:#EEF2FF}
.comp-desc{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:12px}
.comp-weight{display:inline-block;font-size:10px;font-weight:600;padding:2px 9px;border-radius:10px;margin-bottom:10px}
.comp-weight.core{background:#FEF3F0;color:var(--verm)}
.comp-weight.important{background:#EEF2FF;color:var(--navy)}
.comp-weight.nice{background:#F3F4F6;color:var(--muted)}
.rating-btns{display:flex;gap:6px}
.rating-btn{flex:1;padding:8px 4px;border-radius:9px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;font-family:"Plus Jakarta Sans",sans-serif;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px}
.rating-btn.strong.active{background:#DCFCE7;border-color:#15803D;color:#15803D}
.rating-btn.growing.active{background:#FEF3C7;border-color:#B45309;color:#B45309}
.rating-badge{display:none}
.comp-card.rated-strong .rating-badge.strong-badge,.comp-card.rated-growing .rating-badge.growing-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;border-radius:8px;padding:2px 8px;margin-bottom:8px}
.comp-card.rated-strong .rating-badge.strong-badge{color:#15803D;background:#DCFCE7}
.comp-card.rated-growing .rating-badge.growing-badge{color:#B45309;background:#FEF3C7}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:900;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px)}
.drawer-overlay.open{opacity:1;pointer-events:all}
.drawer{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:95vw;background:#fff;z-index:901;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;box-shadow:-8px 0 40px rgba(0,0,0,.12)}
.drawer.open{transform:translateX(0)}
.drawer-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.drawer-comp-name{font-family:"Bricolage Grotesque",sans-serif;font-size:18px;font-weight:700;color:var(--navy);line-height:1.2}
.drawer-comp-kf{font-size:11px;color:var(--muted);font-family:"DM Mono",monospace;margin-top:3px}
.drawer-close{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;color:var(--muted)}
.drawer-close:hover{background:var(--bg)}
.drawer-body{padding:20px 24px}
.drawer-section{margin-bottom:22px}
.drawer-section-title{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.drawer-definition{font-size:13px;color:var(--text);line-height:1.8;padding:14px 16px;background:#F8F7F5;border-radius:10px;border-left:3px solid var(--verm)}
.drawer-why{font-size:13px;color:#4B5563;line-height:1.8;margin-top:10px}
.anchor-list{display:flex;flex-direction:column;gap:7px}
.anchor-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.6}
.anchor-item.strong-anchor{background:#F0FDF4;color:#14532D}
.anchor-item.growing-anchor{background:#FFFBEB;color:#78350F}
.anchor-item.overused-anchor{background:#FFF1F2;color:#881337}
.anchor-dot-strong{width:8px;height:8px;border-radius:50%;background:#15803D;flex-shrink:0;margin-top:6px}
.anchor-dot-growing{width:8px;height:8px;border-radius:50%;border:2px solid #B45309;flex-shrink:0;margin-top:6px}
.anchor-dot-overused{width:8px;height:8px;border-radius:50%;background:#E11D48;flex-shrink:0;margin-top:6px}
.drawer-divider{height:1px;background:var(--border);margin:20px 0}
.drawer-rating-section{background:#F8F7F5;border-radius:12px;padding:16px}
.drawer-rating-title{font-size:14px;font-weight:600;color:var(--navy);margin-bottom:4px}
.drawer-rating-sub{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.6}
.drawer-rating-btns{display:flex;gap:8px;margin-bottom:12px}
.drawer-rating-btn{flex:1;padding:12px 8px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:"Plus Jakarta Sans",sans-serif;color:var(--muted);text-align:center;transition:all .15s}
.drawer-rating-btn.strong.active{background:#DCFCE7;border-color:#15803D;color:#15803D}
.drawer-rating-btn.growing.active{background:#FEF3C7;border-color:#B45309;color:#B45309}
.drawer-interview{margin-top:12px;padding:14px;background:var(--navy);border-radius:10px;cursor:pointer;border:none;width:100%;text-align:left;font-family:"Plus Jakarta Sans",sans-serif}
.drawer-interview-title{font-size:12px;font-weight:700;color:rgba(255,255,255,.6);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.drawer-interview-q{font-size:13px;color:#fff;line-height:1.5}
.drawer-retail{padding:14px;background:#EEF2FF;border-radius:10px;border-left:3px solid var(--navy)}
.drawer-retail-title{font-size:11px;font-weight:700;color:var(--navy);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.drawer-retail-text{font-size:13px;color:#1E3A8A;line-height:1.6}
.drawer-lock-notice{background:#FEF3F0;border:1px solid #F9C3B3;border-radius:10px;padding:16px;text-align:center}
.drawer-lock-btn{margin-top:10px;width:100%;padding:10px;background:var(--verm);color:#fff;border:none;border-radius:8px;font-family:"Plus Jakarta Sans",sans-serif;font-size:13px;font-weight:600;cursor:pointer}
.upgrade-cta{background:var(--verm);border:none;border-radius:10px;padding:10px 20px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:"Plus Jakarta Sans",sans-serif;white-space:nowrap}
.next-card{background:#fff;border:1.5px solid var(--navy);border-radius:14px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.premium-badge{background:var(--navy);color:#fff;font-size:10px;font-weight:700;padding:3px 10px;border-radius:10px;letter-spacing:.5px;display:inline-block;margin-bottom:6px}
.dashed-card{background:#fff;border:1.5px dashed #C4B5B0;border-radius:14px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="yk-header">
    <div>
      <div class="yk-title">Yetkinliklerim</div>
      <div class="yk-sub">Retail pozisyonlarına özel yetkinlik haritası — Mockup v4</div>
    </div>
    <div class="yk-tier-toggle">
      <span style="font-size:11px;color:var(--muted);padding:0 4px">Görünüm:</span>
      <button class="yk-tier-btn active" onclick="setTier('freemium',this)">Freemium</button>
      <button class="yk-tier-btn" onclick="setTier('premium',this)">Premium</button>
    </div>
  </div>
  <div class="search-section">
    <div class="search-top">
      <div class="search-title">Pozisyon Ara</div>
      <span class="search-badge">RETAİL YETKİNLİK REHBERİ</span>
    </div>
    <div class="search-bar">
      <input class="search-input" id="searchInput" placeholder="Pozisyon ara... Satış Danışmanı, Mağaza Müdürü, VM..." oninput="onSearchInput(this.value)" onkeydown="if(event.key==='Enter')doSearch()">
      <button class="search-btn" onclick="doSearch()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Ara
      </button>
    </div>
    <div class="search-hints">
      <span class="hint-chip" onclick="quickSearch('Kasiyer')">Kasiyer</span>
      <span class="hint-chip" onclick="quickSearch('Satış Danışmanı')">Satış Danışmanı</span>
      <span class="hint-chip" onclick="quickSearch('Kat Müdürü')">Kat Müdürü</span>
      <span class="hint-chip" onclick="quickSearch('Mağaza Müdürü')">Mağaza Müdürü</span>
      <span class="hint-chip" onclick="quickSearch('Bölge Müdürü')">Bölge Müdürü</span>
      <span class="hint-chip" onclick="quickSearch('Visual Merchandiser')">Visual Merchandiser</span>
    </div>
    <div class="search-result" id="searchResult"></div>
  </div>
  <div id="summaryWrap"></div>
  <div id="roleSelectorWrap"></div>
  <div id="progressWrap"></div>
  <div class="section-label">Yetkinlik kartları — <span style="font-weight:400;text-transform:none;font-size:11px;color:var(--muted)">detay ve değerlendirme için kartlara tıkla</span></div>
  <div class="comp-grid" id="compGrid"></div>
  <div id="bottomCard"></div>
</div>
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div>
      <div class="drawer-comp-name" id="drawerName"></div>
      <div class="drawer-comp-kf" id="drawerKf"></div>
    </div>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>
<script>
const ROLES={
  'Kasiyer':{level:'Giriş',comps:[
    {code:'cf',name:'Müşteri Odaklılık',kf:'Customer Focus',desc:'Her müşteriyle güler yüzlü ve çözüm odaklı etkileşim kurar.',weight:'core',icon:'eye'},
    {code:'it',name:'Güven Oluşturma',kf:'Instills Trust',desc:'Kasa işlemlerinde dürüstlük ve tutarlılık ile güven inşa eder.',weight:'core',icon:'shield'},
    {code:'ea',name:'Sorumluluk Alma',kf:'Ensures Accountability',desc:'İşlem hatalarını takip eder, sonuçlarının sorumluluğunu üstlenir.',weight:'core',icon:'check'},
    {code:'ce',name:'Etkili İletişim',kf:'Communicates Effectively',desc:'Müşteriye ürün, kampanya ve kasa süreçleri hakkında net bilgi verir.',weight:'important',icon:'msg'},
    {code:'br',name:'Dayanıklılık',kf:'Being Resilient',desc:'Yoğun saatlerde stres altında sakin ve odaklı kalır.',weight:'important',icon:'bolt'},
  ]},
  'Satış Danışmanı':{level:'Giriş',comps:[
    {code:'cf',name:'Müşteri Odaklılık',kf:'Customer Focus',desc:'Müşteri ihtiyaçlarını önceler, çözüm odaklı yaklaşır.',weight:'core',icon:'eye'},
    {code:'ce',name:'Etkili İletişim',kf:'Communicates Effectively',desc:'Açık ve etkili biçimde bilgi iletir, aktif dinler.',weight:'core',icon:'msg'},
    {code:'it',name:'Güven Oluşturma',kf:'Instills Trust',desc:'Tutarlı davranışlarla müşteri güveni inşa eder.',weight:'core',icon:'shield'},
    {code:'co',name:'Takım Çalışması',kf:'Collaborates',desc:'Mağaza ekibiyle ortak hedefler için iş birliği yapar.',weight:'important',icon:'team'},
    {code:'ao',name:'Aksiyona Yönelim',kf:'Action Oriented',desc:'Fırsatları hızla değerlendirir, harekete geçer.',weight:'important',icon:'bolt'},
  ]},
  'Kıdemli Satış Dan.':{level:'Giriş-Orta',comps:[
    {code:'cf',name:'Müşteri Odaklılık',kf:'Customer Focus',desc:'Müşteri ihtiyaçlarını önceler, uzun vadeli ilişki kurar.',weight:'core',icon:'eye'},
    {code:'ce',name:'Etkili İletişim',kf:'Communicates Effectively',desc:'Açık ve ikna edici biçimde bilgi iletir.',weight:'core',icon:'msg'},
    {code:'it',name:'Güven Oluşturma',kf:'Instills Trust',desc:'Tutarlı davranışlarla müşteri güveni inşa eder.',weight:'core',icon:'shield'},
    {code:'co',name:'Takım Çalışması',kf:'Collaborates',desc:'Yeni çalışanlara rehberlik eder, ekibi destekler.',weight:'important',icon:'team'},
    {code:'is',name:'İlişki Yönetimi',kf:'Interpersonal Savvy',desc:'Farklı kişilerle kolayca bağ kurar.',weight:'important',icon:'heart'},
    {code:'nl',name:'Hızlı Öğrenme',kf:'Nimble Learning',desc:'Yeni ürün ve kampanyaları hızla öğrenir.',weight:'nice',icon:'bolt'},
  ]},
  'Kat Müdürü':{level:'Giriş-Orta',comps:[

    why:"Sonuç üretmek; retail&#39;in nefesidir. Mağaza, sezon, bölge ya da şirket düzeyinde — her performans döngüsünün sonunda sayılar konuşur. Ama sonuç odaklılık yalnızca rakamları tutturmak değildir; bu yetkinlik 'nasıl' sorusunu da kapsar. Kısa vadeli baskı altında uzun vadeli değerleri feda ederek sayı tutturan kişi bu yetkinliğe sahip değildir. Gerçek sonuç odaklılık, doğru yoldan giderek hedefe ulaşmaktır.",
    skilled:["Kendi performansı için yüksek standart belirler ve bu standardın altında kalmakla uzlaşmaz","Zorlu koşullar — düşük sezon, stok sorunu, personel yokluğu — altında bile hedeflere ulaşmanın yolunu bulur","Sonuçlara ilerlemeyi düzenli olarak ölçer; sorun var mı erken fark eder","Rakamların ne zaman döneceğini, neden düştüğünü bilir; veriyle güçlü ilişkisi vardır","Ekibini hedefin etrafında motive eder; pes etmek değil çözüm üretmek yönünde yönlendirir"],
    lessskilled:["Verilen hedefi tutturmaya çalışır ama proaktif olarak aşmak için çaba göstermez","Performans düştüğünde 'piyasa kötü', 'sezon zor' açıklamalarına sığınır","Hedeften ne kadar uzak olduğunu takip etmez; sürprizlerle karşılaşır","Kısa vadeli rahatlamak için uzun vadeli öneme sahip adımları erteleyebilir","Zor dönemlerde motivasyonu ve enerjisi düşer; ekibi de bundan olumsuz etkilenir"],
    highlyskilled:["Başkalarının imkansız dediği hedeflere ulaşmanın yaratıcı yollarını bulur","Kısa vadeli baskı altında bile uzun vadeli kurumsal değerleri korur","Sonuç üretmeyi takım ve sistem geliştirme yatırımıyla birleştirir; hem bugünü hem yarını kazanır"],
    overused:["Sonuç takıntısı insani değerleri geri plana atar; ekip yıpranır","Kısa vadeli rakam uğruna etik ya da sürdürülebilirlik konularında taviz verebilir","Sadece sonucu ödüllendirir; süreci ve davranışı görmezden gelir — bu yanlış davranışları da ödüllendirmek anlamına gelebilir"],
    retail:"Bir mağaza müdürü, yıl sonunda hedefin %15 gerisindeydi. Ekibi suçlamak yerine önce veriyi inceledi: hangi ürün kategorisi, hangi saat dilimi, hangi müşteri profili geri düşüyordu? Çapraz satış fırsatlarını yeniden eğitti, vitrin yerleşimini değiştirdi ve son 3 ayda farkı kapattı.",
    interview:"Hedefin gerisinde kaldığını fark ettiğin ve bunu tersine çevirmek için aktif adım attığın bir dönemi anlat."
  },
  dw:{
    def:"Ekibe net yön vermek, görevleri etkin biçimde dağıtmak, önündeki engelleri proaktif olarak kaldırmak ve iş sonuçlarına odaklanmayı sağlamak.",
    why:"Yönlendirme olmadan ekip yüzmez — sadece su yerinde sayar. Retail&#39;de her vardiya, her gün, her sezon net görev dağılımı gerektirir. Yönlendirme yapan lider; ekibinin güçlü yanlarını bilir, doğru işi doğru kişiye verir ve sonucun önündeki engelleri kaldırır. Mikro yönetim ile yönlendirme arasındaki fark şudur: mikro yönetim 'nasıl yapacağını' söyler, yönlendirme 'ne yapılması gerektiğini' netleştirir ve kişiyi serbest bırakır.",
    skilled:["Her ekip üyesi gün başında ne yapması gerektiğini bilir; belirsizlik yoktur","Görev dağılımını kişinin güçlü yanına göre yapar; herkese aynı işi vermez","Delege ettiği işi takip eder ama kişinin üstüne yapışmaz; güvenerek bırakır","Süreçteki engeli ekibin önüne çıkmadan görür ve kaldırır","Priorties değiştiğinde ekibi hızla günceller; herkes aynı bilgiye sahiptir"],
    lessskilled:["Görev verir ama 'nasıl yapacağını' açıklamaz; yanlış beklentiler oluşur","Her şeyi kendisi yapmak ister; delege etmekte güçlük çeker","Ekibine çelişkili mesajlar gönderir; 'önce şu, hayır önce bu' kargaşası yaşanır","Sorunları reaktif ele alır; engel çıkana kadar fark etmez","Performans sorununun arkasındaki nedeni bulmak yerine kişiyi değiştirmeyi tercih eder"],
    highlyskilled:["Ekibinin kapasitesini sürekli büyütür; her delege an aynı zamanda bir gelişim fırsatıdır","Organizasyonun önündeki sistemik engelleri tespit eder ve üst yönetimle çalışarak kaldırır","Herkesin güçlü yanını en üst düzeyde kullanacak görev dağılımı yapar; ekip toplam kapasitesinin üzerinde performans gösterir"],
    overused:["Yönlendirmeyi o kadar titiz yapar ki ekip bağımsız düşünemez hale gelir","Her adımı onaylatmak zorunda olan bir kültür oluşturur","Çok fazla kontrol noktası koyar; süreçler yavaşlar, esneklik azalır"],
    retail:"Cumartesi sabahı 4 çalışan hastalandı. Kat müdürü paniklemek yerine 10 dakika içinde gün planını yeniden yapılandırdı: öncelikli bölgeleri belirledi, çapraz görev yaptı, kasayı güçlendirdi. Gün boyunca hiçbir bölge boş kalmadı.",
    interview:"Ekibini zor koşullarda yönlendirmek zorunda kaldığın — kaynak eksikliği, zaman baskısı ya da belirsizlik — bir durumu anlat."
  },
  bt:{
    def:"Kolektif başarı için güçlü, birbirini tamamlayan ve uyumlu ekipler kurmak; çeşitliliği güç olarak kullanmak.",
    why:"Tek başına dahiler ekipleri yener. En iyi mağazalar, tek tek yıldızların toplamından değil; iyi kurulmuş ekiplerin sinerjisinden güçlenir. Ekip kurma yetkinliği; sadece 'doğru insanı işe almak' değil, bu insanların bir bütün oluşturmasını sağlamak, çatışmaları yapıcı yönetmek ve ekibin zamanla güçlenmesini sağlamaktır. Zayıf ekipler en iyi sistemi bile işlevsiz kılar; güçlü ekipler yetersiz kaynakla bile kazanır.",
    skilled:["Ekibindeki boşlukları — beceri, bakış açısı, kişilik — görerek doldurur","Farklı güçlü yönlere sahip insanların bir arada çalışmasını sağlar","Ekip içi güveni ve psikolojik güvenliği aktif biçimde besler; insanlar fikir söylemekten çekinmez","Ekip dinamiklerindeki kırılmaları erken fark eder ve müdahale eder","Ekip üyeleri kariyer hedeflerini liderle açıkça paylaşabilir"],

    highlyskilled:["Ekibi sadece mevcut ihtiyaçlar için değil, gelecekteki büyüme için de kurar","Çeşitli bakış açılarının olduğu ekiplerde çatışmayı bastırmak yerine yaratıcı gerilimd olarak kullanır","Ekip kimliği ve ortak amacı güçlü biçimde netleştirir; ekip 'biz' duygusunu içselleştirir"],
    overused:["Ekip uyumunu o kadar önceliklendirir ki zorlu kararları alamaz; ekip bir baloncuğa dönüşür","Ekip dışından gelen fikirlere ve insanlara kapıyı kapatır","Consensus aramak adına yavaş hareket eder; hız ve çeviklik kaybolur"],
    retail:"Yeni açılan bir flagship mağazanın müdürü, ekibini oluştururken kasıtlı çeşitlilik sağladı: deneyimli bir satışçı, sosyal medya güçlü bir Z kuşağı danışman, operasyon odaklı bir kat sorumlusu ve müşteri hizmetleri geçmişinden gelen bir kasiyer. İlk 3 ayda mağaza bölgenin en yüksek NPS skorunu elde etti.",
    interview:"Sıfırdan ya da mevcut zorluklarla kurduğun bir ekibi ve bu süreçte attığın adımları anlat."
  },
  dt:{
    def:"Başkalarının gelişimini desteklemek, güçlü yönlerini ve gelişim alanlarını net biçimde görmek, koçluk ve mentorlukla potansiyellerini açığa çıkarmak.",
    why:"En iyi liderler; kendi başarılarından değil, yetiştirdikleri kişilerin başarısından gurur duyanlardır. Retail&#39;de yetenek gelişimi iki boyutludur: hem mevcut performansı artırmak hem bir sonraki nesil liderleri hazırlamak. Yetenek geliştirecek lider hem kurumun sürdürülebilirliğini sağlar hem de çalışan bağlılığını artırır — çünkü insanlar büyüdüklerini hissettikleri yerlerde kalırlar.",
    skilled:["Her ekip üyesinin güçlü yanlarını ve geliştirme alanlarını net biçimde tanımlar","Gelişim konuşması yapar — yalnızca performans değerlendirmesi değil, kariyer diyaloğu","Hata yapıldığında 'bunu ben çözmeliyim' yerine 'bu kişi buradan ne öğrenebilir?' diye düşünür","Kişiye uygun öğrenme fırsatları bulur ve erişimini kolaylaştırır","Başarıları fark eder ve takdir eder; sadece büyük başarılar için değil, ilerleme için de"],
    lessskilled:["Ekibine iş yaptırır ama geliştirmek için zaman ayırmaz","Eğitimi 'HR'ın işi' olarak kategorize eder; sahaya taşımaz","Gelişim sohbeti yapmaz; insanlar ne zaman terfi edeceğini bilmez","Güçlü çalışanı yetiştirince onu kaybedeceğinden korkar; gelişimi bilinçli ya da bilinçsiz engeller","Potansiyeli yüksek çalışanla bireysel konuşma yapmaz; onu kalabalık içinde kaybeder"],
    highlyskilled:["Ekibindeki her kişinin 2-3 yıl sonra hangi rolde olabileceğini düşünür ve buna göre gelişim planlar","Başkalarını geliştirmek için kendi zamanını ve kaynaklarını feda eder","Yetenek yetiştirme reputasyonu sayesinde en iyi adaylar onunla çalışmak ister"],
    overused:["Gelişim adına insanları hazır olmadıkları sorumluluklar için zorlar; başarısızlık riski artar","Kendi yönetim tarzını herkese dayatır; kişiye özgü koçluğu ihmal eder","Koçluk ve geri bildirime o kadar odaklanır ki performans konuşmalarından kaçınır"],
    retail:"Bir mağaza müdürü, mağazasındaki en iyi satışçının aslında mağazayı büyütmek için değil, mağaza müdürü olmak için çalıştığını gördü. Onu bir mağaza operasyon projesine dahil etti, bölge toplantılarına götürdü ve 18 ay sonra kendi mağazasına önerdi. O çalışan bugün kendi bölgesini yönetiyor.",
    interview:"Ekibindeki birinin potansiyelini fark edip gelişimine aktif yatırım yaptığın ve bunu somut bir ilerlemeyle sonuçlandırdığın bir süreci anlat."
  },
  fa:{
    def:"Temel finansal göstergeleri anlayıp yorumlamak ve bu anlayışı daha iyi iş kararları almak için etkin biçimde kullanmak.",
    why:"Retail&#39;de finansal okuryazarlık olmadan mağaza yönetmek; gösterge paneline bakmadan araba sürmek gibidir. Ciro tek başına anlamsızdır — brüt kâr marjı, stok devir hızı, kayıp oranı, işletme gideri/ciro dengesi: bunlar bir arada okunduğunda gerçek resim görülür. Finansal yetkinliği güçlü mağaza müdürleri; indirimi ne zaman yapacaklarını, hangi ürüne stok yatıracaklarını ve hangi gideri kesmek gerektiğini veriye dayanarak kararlaştırır.",

    lessskilled:["Satış rakamını bilir ama brüt kâr marjı ve gider yapısına hakim değildir","Finansal kararları 'yönetim belirler' olarak görür; kendi payını ve etkisini anlamaz","Bütçe konuşmalarında rahat değildir; rakamlardan kaçınır","Finansal sonuçları geç okur; müdahale fırsatını kaçırır","Promosyonun kârlılığa etkisini hesaplamaz; hacim kazanmak için marjı feda eder"],

    overused:["Finansal metriğe o kadar odaklanır ki insan ve müşteri boyutunu kaybeder","Her kararı ROI hesabına bağlar; hızlı kararlar gecikmeler","Kısa vadeli kârlılık uğruna uzun vadeli yatırım ve ilişkileri feda eder"],

    interview:"Bir finansal göstergeyi analiz edip bu analizden yola çıkarak operasyonel bir karar aldığın ve sonucunu takip ettiğin bir süreci anlat."
  },
  de:{
    def:"Çalışanların en iyi performansı sergileyebilecekleri, anlamlı hissedebilecekleri ve işlerine bağlılıklarını koruyabilecekleri bir ortam ve iklim yaratmak.",
    why:"Bağlılığı yüksek ekipler; müşteri memnuniyetinde daha başarılı, işten ayrılmada daha düşük ve verimlilikte daha yüksek sonuçlar üretir. Retail araştırmaları gösteriyor: müşteriye gülümseyen çalışan, kendisi de işinden anlam bulan çalışandır. Bağlılık yönetilmezse silinir. Lider bağlılık yaratmak için ne konuştuğunu değil, ne yaptığını, ne kadar görünür olduğunu ve ekibine ne kadar önem verdiğini düşünmelidir.",

    retail:"Yıl sonuna yakın, satış baskısı dorukta, ekip yorgundu. Mağaza müdürü haftalık toplantıya satış hedefiyle başlamak yerine 'geçen hafta özellikle başarılı bulduğunuz anı paylaşın' diye başladı. 15 dakika içinde enerji değişti. O hafta ekibin satış performansı önceki haftanın %12 üzerinde çıktı.",
    interview:"Ekibin motivasyonunun belirgin biçimde düştüğünü fark ettiğin ve bunu tersine çevirmek için aldığın somut adımları anlat."
  },
  sm:{
    def:"Gelecek fırsatları ve tehditleri öngörmek, büyük resmi görmek ve bu bakış açısını günlük kararlara yansıtmak.",
    why:"Operasyonel başarı sizi bugün ayakta tutar; stratejik bakış sizi yarın rekabetçi kılar. Retail hızla değişiyor: e-ticaret, tüketici davranışları, tedarik zinciri kırılganlıkları, segmentasyon değişimleri. Bunları erken gören liderler önce hareket eder; geç görenler ise rakiplerine yetişmeye çalışır. Stratejik bakış, büyük planlar yapmak değildir; bugünün kararlarını gelecek perspektifinden vermektir.",

    retail:"Bir bölge müdürü, 2 yıl önce müşterilerin iade oranının yavaşça arttığını fark etti. Operasyon bir 'stok sorunu' olarak kategorize etti. Bölge müdürü ise bunun 'müşteri beklentisi ve ürün kalitesi' sinyali olduğunu gördü, merkezi uyardı. 18 ay sonra sektörde iade krizi yaşandı; o mağazalar zaten önlem almıştı.",

  pa:{
    def:"İşi organize etmek, doğru öncelikleri belirlemek ve hedeflerle kaynak arasında uyum sağlayan gerçekçi planlar oluşturmak.",

let role="Satış Danışmanı",tier="freemium",ratings={},openedCards={};
const FREE_LIMIT=2;
function setTier(t,btn){tier=t;document.querySelectorAll(".yk-tier-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");render();}
function setRole(r){role=r;render();}
function gr(code){return ratings[role+"_"+code]||null;}
function rateCard(code,rating,e){if(e)e.stopPropagation();if(tier==="freemium")return;const k=role+"_"+code;ratings[k]=ratings[k]===rating?null:rating;render();}
function rateDrawer(code,rating){const k=role+"_"+code;ratings[k]=ratings[k]===rating?null:rating;render();openDrawer(code);}
function openDrawer(code){
  const comps=ROLES[role].comps;
  const c=comps.find(x=>x.code===code);if(!c)return;
  const a=ANCHORS[code];
  const isPrem=tier==="premium";
  const idx=comps.findIndex(x=>x.code===code);
  const isLocked=!isPrem&&idx>=FREE_LIMIT;
  const r=gr(code);
  openedCards[role+"_"+code]=true;
  document.getElementById("drawerName").textContent=c.name;
  document.getElementById("drawerKf").textContent=c.kf+" · "+WT[c.weight];
  let body="";
  if(a&&!isLocked){
    body+=`<div class="drawer-section"><div class="drawer-section-title">📌 Tanım</div><div class="drawer-definition">${a.def}</div><div class="drawer-why">${a.why}</div></div>`;
    body+=`<div class="drawer-section"><div class="drawer-section-title">✅ Yetkin olanlar şunu yapar</div><div class="anchor-list">${a.skilled.map(s=>`<div class="anchor-item strong-anchor"><div class="anchor-dot-strong"></div><span>${s}</span></div>`).join("")}</div></div>`;
    body+=`<div class="drawer-section"><div class="drawer-section-title">⬆ Henüz gelişim aşamasındakiler</div><div class="anchor-list">${a.lessskilled.map(g=>`<div class="anchor-item growing-anchor"><div class="anchor-dot-growing"></div><span>${g}</span></div>`).join("")}</div></div>`;
    body+=`<div class="drawer-section"><div class="drawer-section-title">🌟 Çok yetenekliler</div><div class="anchor-list">${a.highlyskilled.map(h=>`<div class="anchor-item strong-anchor"><div class="anchor-dot-strong" style="background:#0F766E"></div><span>${h}</span></div>`).join("")}</div></div>`;
    body+=`<div class="drawer-section"><div class="drawer-section-title">⚠ Aşırı kullanımda dikkat</div><div class="anchor-list">${a.overused.map(o=>`<div class="anchor-item overused-anchor"><div class="anchor-dot-overused"></div><span>${o}</span></div>`).join("")}</div></div>`;
    body+=`<div class="drawer-section"><div class="drawer-retail-title">🏪 RETAIL&#39;DE NASIL GÖRÜNÜR</div><div class="drawer-retail"><div class="drawer-retail-text">${a.retail}</div></div></div>`;
    body+=`<div class="drawer-divider"></div>`;
    body+=`<div class="drawer-rating-section"><div class="drawer-rating-title">Kendinle dürüst ol 🎯</div><div class="drawer-rating-sub">Yukarıdaki davranış tanımlarını okudun. Hangisi seni daha çok tarif ediyor? Skor vermiyoruz — bu bir öz farkındalık egzersizi.</div><div class="drawer-rating-btns"><button class="drawer-rating-btn strong${r==="strong"?" active":""}" onclick="rateDrawer('${code}','strong')">✅ Beni güçlü tarif ediyor</button><button class="drawer-rating-btn growing${r==="growing"?" active":""}" onclick="rateDrawer('${code}','growing')">↑ Hâlâ gelişiyorum</button></div>`;
    if(a.interview){body+=`<div class="drawer-interview"><div class="drawer-interview-title">📋 Mülakatta nasıl anlatırsın?</div><div class="drawer-interview-q">${a.interview}</div></div>`;}
    body+=`</div>`;
  } else if(isLocked){
    body=`<div class="drawer-lock-notice"><div style="font-size:24px;margin-bottom:8px">🔒</div><div style="font-size:14px;font-weight:600;color:var(--verm);margin-bottom:6px">Premium içerik</div><div style="font-size:13px;color:#9A3C1E;line-height:1.6">Yetkinlik tanımını, davranışsal göstergeleri, retail örneklerini ve mülakat hazırlık sorularını görmek için Premium üyeliğe geç.</div><button class="drawer-lock-btn" onclick="setTier('premium',document.querySelectorAll('.yk-tier-btn')[1]);closeDrawer()">Premium'a Geç →</button></div>`;
  }
  document.getElementById("drawerBody").innerHTML=body;
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawerOverlay").classList.add("open");
  document.body.style.overflow="hidden";
}

function quickSearch(q){document.getElementById("searchInput").value=q;doSearch();}
function onSearchInput(v){if(!v.trim())document.getElementById("searchResult").classList.remove("show");}
function doSearch(){
  const q=document.getElementById("searchInput").value.trim().toLowerCase();
  const el=document.getElementById("searchResult");
  if(!q){el.classList.remove("show");return;}
  let found=SEARCH_ALIASES[q];
  if(!found)for(const[k,v]of Object.entries(SEARCH_ALIASES)){if(k.includes(q)||q.includes(k)){found=v;break;}}
  if(!found)for(const r of Object.keys(ROLES)){if(r.toLowerCase().includes(q)){found=r;break;}}
  if(found&&ROLES[found]){
    const comps=ROLES[found].comps;
    el.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px"><div class="sr-role">${found} <span style="font-size:11px;font-weight:400;color:var(--muted)">${ROLES[found].level} seviye · ${comps.length} yetkinlik</span></div><button onclick="setRole('${found}');document.getElementById('searchResult').classList.remove('show');window.scrollTo({top:300,behavior:'smooth'})" style="font-size:12px;font-weight:600;color:var(--verm);background:none;border:none;cursor:pointer;padding:4px 0">Bu role geç →</button></div><div class="sr-comps">${comps.map(c=>`<span class="sr-comp ${c.weight}"><span style="margin-right:2px">${c.weight==="core"?"◆":"◇"}</span>${c.name}</span>`).join("")}</div>`;
    el.classList.add("show");
  }else{el.innerHTML=`<div style="font-size:13px;color:var(--muted);text-align:center;padding:10px 0">Sonuç bulunamadı.</div>`;el.classList.add("show");}
}
function render(){
  const comps=ROLES[role].comps;
  const level=ROLES[role].level;
  const total=comps.length;
  const read=comps.filter(c=>openedCards[role+"_"+c.code]).length;
  const strong=comps.filter(c=>gr(c.code)==="strong").length;
  const growing=comps.filter(c=>gr(c.code)==="growing").length;
  const rated=strong+growing;
  const pct=Math.round(rated/total*100);
  const readPct=Math.round(read/total*100);
  const isPrem=tier==="premium";
  const mot=MOTIVATIONAL_MSG[level]||MOTIVATIONAL_MSG["Giriş"];
  if(isPrem){
    document.getElementById("summaryWrap").innerHTML=`<div class="summary-card"><div><div style="font-size:12px;opacity:.6;margin-bottom:4px">Değerlendirme ilerlemesi — ${role}</div><div style="font-size:14px;font-weight:600">${rated} / ${total} yetkinlik değerlendirildi</div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></div><div class="summary-stats"><div class="stat-item stat-strong"><div class="stat-num">${strong}</div><div class="stat-label">Güçlü</div></div><div class="stat-item stat-growing"><div class="stat-num">${growing}</div><div class="stat-label">Gelişiyor</div></div></div></div>`;
    document.getElementById("roleSelectorWrap").innerHTML=`<div class="section-label">Rol seç</div><div class="role-bar">${Object.keys(ROLES).map(r=>`<button class="role-pill${r===role?" active":""}" onclick="setRole('${r}')">${r}</button>`).join("")}</div>`;
    document.getElementById("progressWrap").innerHTML=read<total?`<div class="unlock-progress"><div class="up-track"><div class="up-fill" style="width:${readPct}%"></div></div><span style="font-size:12px;color:var(--muted)">Okunan:</span><span style="font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:var(--navy)">${read}/${total}</span><span style="font-size:12px;color:var(--muted);margin-left:4px">— kartlara tıklayarak öğren</span></div>`:"";
  }else{
    document.getElementById("summaryWrap").innerHTML=`<div class="freemium-hero"><div class="fh-deco"></div><div class="fh-deco2"></div><div class="fh-tag">${mot.emoji} ${level} Seviye</div><div class="fh-role">${mot.title}</div><div class="fh-msg">${mot.msg}</div><div class="fh-actions"><button class="fh-btn-primary" onclick="setTier('premium',document.querySelectorAll('.yk-tier-btn')[1])">Tümünü Değerlendir →</button><button class="fh-btn-secondary">Nasıl çalışır?</button></div><div class="fh-stats"><div class="fh-stat"><div class="fh-stat-num">${total}</div><div class="fh-stat-label">yetkinlik</div></div><div class="fh-stat"><div class="fh-stat-num">${comps.filter(c=>c.weight==="core").length}</div><div class="fh-stat-label">temel</div></div><div class="fh-stat"><div class="fh-stat-num">2</div><div class="fh-stat-label">ücretsiz önizleme</div></div></div></div>`;
    document.getElementById("roleSelectorWrap").innerHTML="";
    document.getElementById("progressWrap").innerHTML="";
  }
  let grid="";
  comps.forEach((c,i)=>{
    const locked=!isPrem&&i>=FREE_LIMIT;
    const r=gr(c.code);
    let cls="comp-card";
    if(r==="strong")cls+=" rated-strong";
    else if(r==="growing")cls+=" rated-growing";
    grid+=`<div class="${cls}" onclick="${locked?`setTier('premium',document.querySelectorAll('.yk-tier-btn')[1])`:`openDrawer('${c.code}')`}">
      <div class="comp-top"><div class="comp-top-left"><div class="comp-icon" style="background:${ICON_BG[c.weight]};color:${ICON_COLOR[c.weight]}">${ICONS[c.icon]||ICONS.bolt}</div><div><div class="comp-name">${c.name}</div><div class="comp-kf">${c.kf}</div></div></div><button class="info-btn" onclick="event.stopPropagation();${locked?`setTier('premium',document.querySelectorAll('.yk-tier-btn')[1])`:`openDrawer('${c.code}')`}">${ICONS.info}</button></div>
      ${r==="strong"?'<div class="rating-badge strong-badge">✅ Güçlü</div>':r==="growing"?'<div class="rating-badge growing-badge">↑ Gelişiyor</div>':""}
      <span class="comp-weight ${c.weight}">${WT[c.weight]}</span>
      <div class="comp-desc">${c.desc}</div>
      <div class="rating-btns" onclick="event.stopPropagation()"><button class="rating-btn strong${r==="strong"?" active":""}" onclick="rateCard('${c.code}','strong',event)">✅ Güçlüyüm</button><button class="rating-btn growing${r==="growing"?" active":""}" onclick="rateCard('${c.code}','growing',event)">↑ Gelişiyorum</button></div>
      ${locked?`<div class="lock-overlay"><div class="lock-icon">${ICONS.lock}</div><div class="lock-label">Detay için<br>Premium</div></div>`:""}
    </div>`;
  });
  document.getElementById("compGrid").innerHTML=grid;
  let bottom="";
  if(!isPrem){bottom=`<div class="dashed-card"><div><span class="premium-badge">PREMIUM</span><div style="font-size:13px;color:var(--muted);margin-top:4px"><strong style="color:var(--navy)">Tüm yetkinlikleri gör, davranışsal göstergeleri oku</strong> ve mülakat hazırlığına başla.</div></div><button class="upgrade-cta" onclick="setTier('premium',document.querySelectorAll('.yk-tier-btn')[1])">Başla →</button></div>`;}
  else if(rated>0){bottom=`<div class="next-card"><div><span class="premium-badge">SONRAKI ADIM</span><div style="font-size:13px;color:var(--muted);margin-top:4px"><strong style="color:var(--navy)">İş Görüşmeleri paneline git</strong> — ${role} için mülakat sorularına ve hazırlık rehberine eriş.</div></div><button class="upgrade-cta" style="background:var(--navy)">Mülakata Hazırlan →</button></div>`;}
  document.getElementById("bottomCard").innerHTML=bottom;
}
render();

</script>
</body>
</html>
