<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  background:#0B0D17;
  overflow-x:hidden;
}

:root{
  --verm:#C94E28;
  --navy:#1E2D5E;
  --cream:#F7F6F4;
  --cream-dim:rgba(247,246,244,0.55);
  --cream-rule:rgba(247,246,244,0.07);
  --font-d:'Bricolage Grotesque',sans-serif;
  --font-b:'Plus Jakarta Sans',sans-serif;
  --expo:cubic-bezier(0.16,1,0.3,1);
}

/* ── HEADER ── */
.hdr{
  position:absolute;top:0;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:24px clamp(24px,4vw,48px);
  z-index:30;
}
.logo{
  font-family:var(--font-d);font-weight:800;font-size:18px;
  color:var(--cream);text-decoration:none;letter-spacing:-0.5px;
}
.logo em{font-style:normal;color:var(--verm)}
.login{
  font-size:12px;font-weight:600;color:var(--cream-dim);
  text-decoration:none;padding:7px 18px;border-radius:5px;
  border:1.5px solid var(--cream-rule);
  transition:color .3s,border-color .3s;
}
.login:hover{color:var(--cream);border-color:rgba(247,246,244,0.2)}

/* ── GATE LAYOUT ── */
.gate{
  display:flex;
  height:100vh;
  height:100dvh;
  position:relative;
}

/* Center rule */
.gate::after{
  content:'';
  position:absolute;
  top:8%;bottom:8%;left:50%;width:1px;
  background:linear-gradient(180deg,transparent,var(--cream-rule) 25%,var(--cream-rule) 75%,transparent);
  z-index:10;pointer-events:none;
}

/* ── ZONES ── */
.zone{
  flex:1;position:relative;overflow:visible;
  display:flex;flex-direction:column;
  justify-content:flex-start;
  padding-top:clamp(100px,15vh,170px);
  text-decoration:none;cursor:pointer;
  transition:background .5s ease;
}

.zone--a{
  padding-left:clamp(32px,4.5vw,72px);
  padding-right:clamp(32px,4.5vw,72px);
  align-items:flex-start;
  background:linear-gradient(170deg,#100E16 0%,#0B0D17 100%);
}
.zone--a:hover{background:linear-gradient(170deg,#14111E 0%,#0D0F1B 100%)}

.zone--i{
  padding-left:clamp(32px,4.5vw,72px);
  padding-right:clamp(32px,4.5vw,72px);
  align-items:flex-end;text-align:right;
  background:linear-gradient(190deg,#0E1020 0%,#0B0D17 100%);
}
.zone--i:hover{background:linear-gradient(190deg,#121428 0%,#0D0F1B 100%)}

/* ── EYEBROW ── */
.ey{
  font-family:var(--font-b);font-size:10px;font-weight:700;
  letter-spacing:4px;text-transform:uppercase;margin-bottom:18px;
}
.zone--a .ey{color:rgba(201,78,40,0.55)}
.zone--i .ey{color:rgba(107,130,196,0.50)}

/* ── HEADING ── */
.hd{
  font-family:var(--font-d);font-weight:800;
  font-size:clamp(40px,5.5vw,68px);
  line-height:0.93;letter-spacing:-2.5px;
  color:var(--cream);margin-bottom:20px;
}
.hd .v{color:var(--verm)}
.hd .n{color:#6B82C4}

/* ── SUBTEXT ── */
.sb{
  font-size:14px;line-height:1.7;
  color:var(--cream-dim);max-width:280px;margin-bottom:32px;
}
.zone--i .sb{margin-left:auto}

/* ── CTA BUTTON ── */
.ct.btn{
  display:inline-block;font-family:var(--font-b);
  font-size:13px;font-weight:700;letter-spacing:0.3px;
  text-decoration:none;padding:10px 28px;
  border-radius:6px;border:1.5px solid transparent;
  transition:background .3s ease, border-color .3s ease, color .3s ease;
}
.zone--a .ct.btn{color:var(--cream);background:var(--verm);border-color:var(--verm)}
.zone--a:hover .ct.btn{background:transparent;color:var(--verm);border-color:var(--verm)}
.zone--i .ct.btn{color:var(--cream);background:var(--navy);border-color:var(--navy)}
.zone--i:hover .ct.btn{background:transparent;color:#8B9CC5;border-color:#8B9CC5}

/* ── CENTER ILLUSTRATION ──
   Single combined image anchored at bottom-center,
   bridging both zones. */
.gate-illust{
  position:absolute;
  bottom:0;left:50%;
  transform:translateX(-50%);
  width:clamp(500px,56vw,920px);
  height:auto;
  object-fit:contain;
  pointer-events:none;
  z-index:5;
  -webkit-mask-image:
    linear-gradient(to top, black 60%, transparent 100%),
    linear-gradient(to right, transparent 0%, black 10%, black 90%, transparent 100%);
  -webkit-mask-composite: destination-in;
  mask-image:
    linear-gradient(to top, black 60%, transparent 100%),
    linear-gradient(to right, transparent 0%, black 10%, black 90%, transparent 100%);
  mask-composite: intersect;
}

/* ── AMBIENT WASH ── */
.zone--a::before{
  content:'';position:absolute;bottom:0;right:0;
  width:60%;height:50%;
  background:radial-gradient(ellipse at 80% 100%,rgba(201,78,40,0.06),transparent 70%);
  pointer-events:none;z-index:0;
}
.zone--i::before{
  content:'';position:absolute;bottom:0;left:0;
  width:60%;height:50%;
  background:radial-gradient(ellipse at 20% 100%,rgba(30,45,94,0.08),transparent 70%);
  pointer-events:none;z-index:0;
}

/* ── FOOTER ── */
.ft{
  position:absolute;bottom:0;left:0;right:0;
  display:flex;align-items:center;justify-content:center;
  padding:14px;font-size:9px;
  color:rgba(247,246,244,0.15);
  letter-spacing:0.5px;text-transform:uppercase;z-index:20;
}

/* ── ANIMATIONS ── */
@keyframes up{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes ilRise{
  from{opacity:0;transform:translateX(-50%) translateY(30px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}
}

.ey{animation:up .55s ease-out .06s both}
.hd{animation:up .55s ease-out .13s both}
.sb{animation:up .55s ease-out .20s both}
.ct{animation:up .55s ease-out .27s both}
.gate-illust{animation:ilRise .9s var(--expo) .2s both}
.hdr{animation:fi .4s ease-out .05s both}
.ft{animation:fi .4s ease-out .4s both}

@media(prefers-reduced-motion:reduce){
  .ey,.hd,.sb,.ct,.gate-illust,.hdr,.ft{animation:none!important;opacity:1!important}
  .zone,.gate-illust{transition:none!important}
}

/* ══ TABLET ══ */
@media(max-width:900px){
  .gate{flex-direction:column}
  .gate::after{
    top:50%;bottom:auto;left:8%;right:8%;
    width:84%;height:1px;
    background:linear-gradient(90deg,transparent,var(--cream-rule) 25%,var(--cream-rule) 75%,transparent);
  }
  .zone{padding-top:clamp(80px,12vh,130px)}
  .zone--i{align-items:flex-start;text-align:left}
  .zone--i .sb{margin-left:0}
  .hd{font-size:clamp(32px,7vw,46px);letter-spacing:-2px}
  .gate-illust{
    width:clamp(320px,70vw,500px);
    bottom:auto;top:50%;left:50%;
    transform:translate(-50%,-50%);
    opacity:0.12;
    z-index:1;
  }
}

/* ══ MOBILE ══ */
@media(max-width:600px){
  html,body{overflow:auto}
  .gate{height:auto;min-height:100vh;min-height:100dvh}
  .zone{
    min-height:50vh;min-height:50dvh;
    padding:0 24px;
    justify-content:flex-start;
    padding-top:clamp(76px,13vh,110px);
  }
  .hd{font-size:clamp(28px,8.5vw,40px);letter-spacing:-1.5px;margin-bottom:14px}
  .ey{margin-bottom:12px;font-size:9px;letter-spacing:3px}
  .sb{font-size:13px;max-width:260px;margin-bottom:22px}
  .gate-illust{width:clamp(280px,80vw,400px);opacity:0.10}
  .hdr{padding:16px 18px}
  .logo{font-size:16px}
  .login{font-size:11px;padding:5px 12px}
  .ft{position:relative;padding:16px;font-size:8px}
}

/* ══ SMALL MOBILE ══ */
@media(max-width:380px){
  .zone{min-height:48vh;padding-top:68px}
  .hd{font-size:24px;letter-spacing:-1px}
  .sb{font-size:12px;max-width:220px}
  .gate-illust{width:clamp(240px,85vw,320px)}
}
