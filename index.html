<style>
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{min-height:100%}
@media(min-width:901px){body{height:100%;overflow:hidden}}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}

/* ── LIGHT (default) ── */
:root{
  --bg:#F7F6F4;
  --bg-a:#FBF9F7;
  --bg-a-h:#F9F5F1;
  --bg-i:#F5F6FB;
  --bg-i-h:#EEF0F8;
  --glow-a:rgba(201,78,40,0.07);
  --glow-i:rgba(30,45,94,0.06);
  --glow-a-h:rgba(201,78,40,0.13);
  --glow-i-h:rgba(30,45,94,0.11);
  --verm:#C94E28;
  --navy:#1E2D5E;
  --text:#F7F6F4;
  --text-head:#1A1A1A;
  --text-dim:rgba(0,0,0,0.45);
  --rule:rgba(0,0,0,0.06);
  --ey-a:rgba(201,78,40,0.6);
  --ey-i:rgba(30,45,94,0.5);
  --hd-n:#1E2D5E;
  --login-c:var(--navy);
  --login-bc:rgba(30,45,94,0.2);
  --login-hc:var(--navy);
  --login-hbg:var(--navy);
  --login-htxt:#fff;
  --btn-i-bg:var(--navy);
  --btn-i-c:#fff;
  --btn-i-hc:var(--navy);
  --btn-i-hborder:var(--navy);
  --ft:rgba(0,0,0,0.2);
  --font-d:'Bricolage Grotesque',sans-serif;
  --font-b:'Plus Jakarta Sans',sans-serif;
  --expo:cubic-bezier(0.16,1,0.3,1);
}
body{background:var(--bg)}

/* ── DARK (system) ── */
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0B0D17;
    --bg-a:#0C0E18;
    --bg-a-h:#100E1A;
    --bg-i:#0C0E1A;
    --bg-i-h:#0E1022;
    --glow-a:rgba(201,78,40,0.08);
    --glow-i:rgba(60,80,160,0.08);
    --glow-a-h:rgba(201,78,40,0.16);
    --glow-i-h:rgba(60,80,160,0.15);
    --text-head:var(--text);
    --text-dim:rgba(247,246,244,0.50);
    --rule:rgba(247,246,244,0.07);
    --ey-a:rgba(201,78,40,0.55);
    --ey-i:rgba(107,130,196,0.50);
    --hd-n:#6B82C4;
    --login-c:rgba(247,246,244,0.55);
    --login-bc:rgba(247,246,244,0.07);
    --login-hc:#F7F6F4;
    --login-hbg:transparent;
    --login-htxt:#F7F6F4;
    --btn-i-bg:var(--navy);
    --btn-i-c:#F7F6F4;
    --btn-i-hc:#8B9CC5;
    --btn-i-hborder:#8B9CC5;
    --ft:rgba(247,246,244,0.15);
  }
}

/* ── HEADER ── */
.hdr{
  position:absolute;top:0;left:0;right:0;
  height:64px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;
  z-index:30;
}
.logo{
  font-family:var(--font-d);font-weight:800;font-size:22px;
  color:var(--text-head);text-decoration:none;letter-spacing:-0.5px;
}
.logo em{font-style:normal;color:var(--verm)}
.login{
  font-size:12px;font-weight:600;color:#fff;
  text-decoration:none;padding:7px 18px;border-radius:5px;
  border:1.5px solid var(--verm);background:var(--verm);
  transition:background .3s,transform .3s,box-shadow .3s;
}
.login:hover{background:#A83D1E;border-color:#A83D1E;transform:translateY(-1px);box-shadow:0 4px 12px rgba(201,78,40,0.2)}

/* ── GATE ── */
.gate{
  display:flex;
  height:100vh;height:100dvh;
  position:relative;
}

/* ── ZONES ── */
.zone{
  flex:1;position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  justify-content:center;
  text-decoration:none;cursor:pointer;
  transition:flex .55s var(--expo), background .5s ease;
}
/* Hovered zone expands, sibling recedes */
.gate:has(.zone--a:hover) .zone--a{flex:1.2}
.gate:has(.zone--a:hover) .zone--i{flex:0.8}
.gate:has(.zone--i:hover) .zone--i{flex:1.2}
.gate:has(.zone--i:hover) .zone--a{flex:0.8}

.zone--a{
  padding:0 clamp(32px,4.5vw,72px);
  align-items:flex-start;
  background:
    radial-gradient(ellipse 70% 50% at 80% 85%, var(--glow-a), transparent),
    var(--bg-a);
  transition:background .5s ease;
}
.zone--a:hover{
  background:
    radial-gradient(ellipse 70% 50% at 80% 85%, var(--glow-a-h), transparent),
    radial-gradient(ellipse 40% 30% at 30% 30%, var(--glow-a), transparent),
    var(--bg-a-h);
}

.zone--i{
  padding:0 clamp(32px,4.5vw,72px);
  align-items:flex-end;text-align:right;
  background:
    radial-gradient(ellipse 70% 50% at 20% 85%, var(--glow-i), transparent),
    var(--bg-i);
  transition:background .5s ease;
}
.zone--i:hover{
  background:
    radial-gradient(ellipse 70% 50% at 20% 85%, var(--glow-i-h), transparent),
    radial-gradient(ellipse 40% 30% at 70% 30%, var(--glow-i), transparent),
    var(--bg-i-h);
}

/* ── EYEBROW ── */
.ey{
  font-family:var(--font-b);font-size:10px;font-weight:700;
  letter-spacing:4px;text-transform:uppercase;margin-bottom:18px;
  transition:letter-spacing .5s var(--expo), opacity .4s ease;
}
.zone--a .ey{color:var(--ey-a)}
.zone--i .ey{color:var(--ey-i)}
.zone:hover .ey{letter-spacing:6px;opacity:1}

/* ── HEADING ── */
.hd{
  font-family:var(--font-d);font-weight:800;
  font-size:clamp(40px,5.5vw,68px);
  line-height:0.93;letter-spacing:-2.5px;
  color:var(--text-head);margin-bottom:20px;
  transition:transform .5s var(--expo);
}
.hd .v{color:var(--verm)}
.hd .n{color:var(--hd-n)}
.zone:hover .hd{transform:translateY(-3px)}

/* ── SUBTEXT ── */
.sb{
  font-size:14px;line-height:1.7;
  color:var(--text-dim);max-width:280px;margin-bottom:32px;
  transition:opacity .4s ease, transform .5s var(--expo);
  opacity:0.8;
}
.zone--i .sb{margin-left:auto}
.zone:hover .sb{opacity:1;transform:translateY(-2px)}

/* ── CTA BUTTON ── */
.ct.btn{
  display:inline-block;font-family:var(--font-b);
  font-size:13px;font-weight:700;letter-spacing:0.3px;
  text-decoration:none;padding:10px 28px;
  border-radius:6px;border:1.5px solid transparent;
  transition:background .3s ease, border-color .3s ease, color .3s ease, transform .4s var(--expo), box-shadow .4s ease;
}
.zone--a .ct.btn{color:var(--verm);background:transparent;border-color:var(--verm)}
.zone--a:hover .ct.btn{background:var(--verm);color:#fff;border-color:var(--verm);transform:translateY(-3px);box-shadow:0 6px 20px rgba(201,78,40,0.25)}
.zone--i .ct.btn{color:var(--btn-i-hc);background:transparent;border-color:var(--btn-i-hborder)}
.zone--i:hover .ct.btn{background:var(--btn-i-bg);color:var(--btn-i-c);border-color:var(--btn-i-bg);transform:translateY(-3px);box-shadow:0 6px 20px rgba(30,45,94,0.25)}

/* ── ILLUSTRATIONS ── */
.il{
  position:absolute;
  bottom:0;
  height:clamp(220px,38vh,360px);
  width:auto;object-fit:contain;
  pointer-events:none;z-index:1;
  transition:transform .7s var(--expo),opacity .5s ease;
  opacity:0.85;
}
.zone--a .il{right:clamp(0px,1vw,24px);height:clamp(240px,42vh,380px)}
.zone--i .il{left:clamp(8px,2vw,32px)}
.zone--a:hover .il{transform:translateY(-10px) scale(1.04);opacity:1}
.zone--i:hover .il{transform:translateY(-10px) scale(1.04);opacity:1}


/* ── ANIMATIONS ── */
@keyframes up{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes ilUp{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:0.9;transform:translateY(0)}
}

.ey{animation:up .55s ease-out .06s both}
.hd{animation:up .55s ease-out .13s both}
.sb{animation:up .55s ease-out .20s both}
.ct{animation:up .55s ease-out .27s both}
.il{animation:ilUp .8s var(--expo) .2s both}
.hdr{animation:fi .4s ease-out .05s both}

@media(prefers-reduced-motion:reduce){
  .ey,.hd,.sb,.ct,.il,.hdr{animation:none!important;opacity:1!important}
  .zone,.il{transition:none!important}
}

/* ══ NARROW DESKTOP (901-1100px) ══ */
@media(max-width:1100px) and (min-width:901px){
  .il{height:clamp(180px,32vh,280px)}
  .zone--a .il{height:clamp(200px,36vh,300px)}
  .hd{font-size:clamp(36px,4.5vw,52px)}
}

/* ══ TABLET (≤900px) ══ */
@media(max-width:900px){
  html,body{overflow:auto}
  .gate{
    flex-direction:column;
    height:auto;
  }
  .gate:has(.zone--a:hover) .zone--a,
  .gate:has(.zone--a:hover) .zone--i,
  .gate:has(.zone--i:hover) .zone--i,
  .gate:has(.zone--i:hover) .zone--a{flex:1}

  .zone{
    flex:none;
    overflow:visible;
    min-height:auto;
    padding:clamp(72px,8vh,100px) clamp(28px,5vw,48px) clamp(24px,3vh,40px);
    justify-content:flex-start;
  }
  .zone--i{
    align-items:flex-start;text-align:left;
    padding-top:clamp(28px,3vh,40px);
    padding-bottom:clamp(32px,4vh,56px);
  }
  .zone--i .sb{margin-left:0}
  .hd{font-size:clamp(34px,8vw,50px);letter-spacing:-2px}

  .il{
    position:relative;
    bottom:auto;right:auto;left:auto;
    height:auto;
    width:clamp(240px,45vw,360px);
    margin-top:20px;
    align-self:center;
    opacity:0.9;
  }
  .zone--a .il{height:auto;width:clamp(240px,45vw,360px);right:auto}
  .zone--i .il{width:clamp(240px,45vw,360px);right:auto;left:auto;align-self:center}
  .ct.btn{padding:12px 32px;font-size:14px}
}

/* ══ MOBILE (≤600px) ══ */
@media(max-width:600px){
  .zone{padding:60px 24px 20px}
  .zone--i{padding:20px 24px 36px}
  .hd{font-size:clamp(30px,9vw,42px);letter-spacing:-1.5px;margin-bottom:14px}
  .ey{margin-bottom:10px;font-size:9px;letter-spacing:3px}
  .sb{font-size:13px;max-width:none;margin-bottom:18px}
  .il{width:min(220px,52vw);margin-top:16px}
  .zone--a .il{width:min(220px,52vw)}
  .zone--i .il{width:min(220px,52vw)}
  .hdr{padding:16px 18px}
  .logo{font-size:16px}
  .login{font-size:11px;padding:6px 14px}
  .ct.btn{padding:11px 28px;font-size:13px}
}

/* ══ SMALL MOBILE (≤380px) ══ */
@media(max-width:380px){
  .zone{padding:52px 20px 16px}
  .zone--i{padding:16px 20px 28px}
  .hd{font-size:26px;letter-spacing:-1px}
  .sb{font-size:12px}
  .il{width:min(180px,48vw);margin-top:14px}
  .zone--a .il{width:min(180px,48vw)}
}
