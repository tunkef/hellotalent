<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{overflow-x:hidden;}
/* Tokens: css/tokens.css — lokal override: coach-studio-spesifik */
:root{
  --verm-hover:#b84420;      /* legacy alias */
  --bg:#F7F6F4;
  --green:#10B981;
  --yellow:#F59E0B;
  --red:#EF4444;
  --shadow-card:0 2px 8px rgba(0,0,0,0.08), 0 8px 20px rgba(0,0,0,0.06);
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ── Gate ── */
.cs-gate{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px;}
.cs-gate-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:var(--text-3xl);color:var(--navy);}
.cs-gate-msg{font-size:var(--text-lg);color:var(--muted);max-width:360px;text-align:center;line-height:1.6;}
.cs-gate-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--verm);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Shell ── */
.cs-shell{display:none;min-height:100vh;}
.cs-shell.active{display:flex;flex-direction:column;}

/* ── Header ── */
.cs-header{background:var(--bg-surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50;}
.cs-logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:17px;color:var(--navy);letter-spacing:-0.5px;text-decoration:none;}
.cs-logo span{color:var(--verm);}
.cs-header-sep{width:1px;height:20px;background:var(--border);}
.cs-header-label{font-size:var(--text-sm);font-weight:600;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase;font-family:'DM Mono',monospace;}
.cs-header-nav{display:flex;gap:4px;margin-left:24px;}
.cs-header-nav button{background:none;border:none;padding:8px 16px;border-radius:8px;font-size:var(--text-md);font-weight:600;font-family:inherit;color:var(--muted);cursor:pointer;transition:all 0.15s;}
.cs-header-nav button:hover{background:var(--verm-light);color:var(--verm);}
.cs-header-nav button.active{background:var(--verm);color:#fff;}
.cs-header-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
.cs-header-user{font-size:var(--text-md);font-weight:600;color:var(--text);}
.cs-btn-logout{font-size:var(--text-base);font-weight:600;color:var(--muted);background:none;border:1px solid var(--border);border-radius:8px;padding:6px 14px;cursor:pointer;font-family:inherit;transition:all 0.15s;}
.cs-btn-logout:hover{border-color:var(--red);color:var(--red);}

/* ── Content ── */
.cs-content{flex:1;max-width:960px;width:100%;margin:0 auto;padding:24px;}
.cs-tab-content{display:none;}
.cs-tab-content.active{display:block;}

/* ── Cards / Bento ── */
.cs-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:var(--shadow-card);}
.cs-card-sm{background:var(--bg-surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow-card);}
.cs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.cs-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.cs-span2{grid-column:span 2;}
.cs-span3{grid-column:span 3;}

/* ── Hero Card ── */
.cs-hero{background:var(--verm);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow-card);}
.cs-hero-title{font-family:'Bricolage Grotesque',sans-serif;font-size:var(--text-3xl);font-weight:800;color:#fff;}
.cs-hero-sub{font-size:var(--text-md);color:rgba(255,255,255,0.8);margin-top:4px;}

/* ── Profile Card ── */
.cs-profile-card{display:flex;gap:20px;align-items:flex-start;}
.cs-profile-avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid var(--border);flex-shrink:0;background:var(--navy-light);}
.cs-profile-avatar-placeholder{width:72px;height:72px;border-radius:50%;background:var(--navy-light);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--navy);flex-shrink:0;font-family:'Bricolage Grotesque',sans-serif;}
.cs-profile-info{flex:1;min-width:0;}
.cs-profile-name{font-family:'Bricolage Grotesque',sans-serif;font-size:var(--text-2xl);font-weight:800;color:var(--text);}
.cs-profile-title{font-size:var(--text-md);color:var(--muted);margin-top:2px;}
.cs-profile-bio{font-size:var(--text-md);color:var(--text);line-height:1.6;margin-top:8px;}
.cs-profile-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.cs-profile-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border);font-size:var(--text-sm);font-weight:600;color:var(--muted);}
.cs-profile-edit-btn{margin-top:12px;padding:8px 20px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-size:var(--text-base);font-weight:700;font-family:inherit;cursor:pointer;transition:all 0.15s;}
.cs-profile-edit-btn:hover{background:var(--navy-deep);}

/* ── Stats ── */
.cs-stat-num{font-family:'DM Mono',monospace;font-size:28px;font-weight:600;color:var(--navy);}
.cs-stat-label{font-size:var(--text-sm);font-weight:600;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.3px;}

/* ── Post List Items ── */
.cs-post-row{padding:16px;border-radius:12px;border:1px solid var(--border);background:var(--bg-surface);margin-bottom:8px;cursor:pointer;transition:all 0.15s;display:flex;gap:14px;align-items:flex-start;}
.cs-post-row:hover{border-color:var(--verm);box-shadow:0 2px 12px rgba(0,0,0,0.06);transform:translateY(-1px);}
.cs-post-row.active{border-color:var(--verm);background:var(--verm-light);}
.cs-post-cover-thumb{width:80px;height:56px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--bg);}
.cs-post-row-body{flex:1;min-width:0;}
.cs-post-row-title{font-size:var(--text-lg);font-weight:700;color:var(--text);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Bricolage Grotesque',sans-serif;}
.cs-post-row-meta{display:flex;align-items:center;gap:8px;font-size:var(--text-sm);color:var(--muted);flex-wrap:wrap;}

/* ── Status Badges ── */
.cs-badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:var(--text-xs);font-weight:700;letter-spacing:0.3px;text-transform:uppercase;}
.cs-badge-draft{background:#F3F4F6;color:var(--muted);}
.cs-badge-submitted{background:#FEF3C7;color:#92400E;}
.cs-badge-changes_requested{background:#FEE2E2;color:#991B1B;}
.cs-badge-published{background:#D1FAE5;color:#065F46;}
.cs-badge-archived{background:#E5E7EB;color:#4B5563;}
.cs-badge-rejected{background:#FEE2E2;color:#991B1B;}

/* ── Editor Card ── */
.cs-editor-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:16px;padding:28px;box-shadow:var(--shadow-card);}

/* ── Form Fields ── */
.cs-field{margin-bottom:16px;}
.cs-field label{display:block;font-size:var(--text-base);font-weight:600;color:var(--text);margin-bottom:5px;}
.cs-field input,.cs-field textarea,.cs-field select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:var(--text-lg);font-family:inherit;transition:border-color 0.15s;background:var(--bg-surface);color:var(--text);}
.cs-field input:focus,.cs-field textarea:focus,.cs-field select:focus{outline:none;border-color:var(--navy);}
.cs-field textarea{resize:vertical;min-height:80px;}
.cs-field-body textarea{min-height:240px;line-height:1.7;}
.cs-field-hint{font-size:var(--text-sm);color:var(--muted);margin-top:4px;}

/* ── Admin Note ── */
.cs-admin-note{margin-bottom:16px;padding:14px;border-radius:10px;background:#FEF3C7;border:1px solid #FCD34D;}
.cs-admin-note-label{font-size:var(--text-sm);font-weight:700;color:#92400E;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px;}
.cs-admin-note-text{font-size:var(--text-md);color:#78350F;line-height:1.5;}

/* ── Buttons ── */
.cs-btn{padding:10px 20px;border:none;border-radius:10px;font-size:var(--text-md);font-weight:700;font-family:inherit;cursor:pointer;transition:all 0.15s;display:inline-flex;align-items:center;gap:6px;}
.cs-btn-primary{background:var(--verm);color:white;}
.cs-btn-primary:hover{background:var(--verm-hover);}
.cs-btn-secondary{background:var(--navy);color:white;}
.cs-btn-secondary:hover{background:var(--navy-deep);}
.cs-btn-ghost{background:none;color:var(--muted);border:1px solid var(--border);}
.cs-btn-ghost:hover{border-color:var(--text);color:var(--text);}
.cs-btn-danger{background:none;color:var(--red);border:1px solid var(--red);}
.cs-btn-danger:hover{background:#FEE2E2;}
.cs-btn-sm{padding:7px 14px;font-size:var(--text-base);border-radius:8px;}
.cs-btn:disabled{opacity:0.5;cursor:not-allowed;}
.cs-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}

/* ── Dismiss Choice Overlay ── */
.cs-dismiss-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:90;display:flex;align-items:center;justify-content:center;padding:24px;}
.cs-dismiss-panel{background:var(--bg-surface);border-radius:16px;padding:28px;max-width:380px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,0.15);text-align:center;}
.cs-dismiss-title{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;font-weight:700;color:var(--text);margin-bottom:8px;}
.cs-dismiss-desc{font-size:var(--text-md);color:var(--muted);line-height:1.6;margin-bottom:20px;}
.cs-dismiss-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

/* ── Messages ── */
.cs-msg{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:var(--text-md);display:none;}
.cs-msg.success{display:block;background:#D1FAE5;color:#065F46;}
.cs-msg.error{display:block;background:#FEE2E2;color:#991B1B;}
.cs-msg.info{display:block;background:var(--navy-light);color:var(--navy);}

/* ── Cover Upload Zone ── */
.cs-upload-zone{border:2px dashed var(--border);border-radius:12px;padding:24px;text-align:center;cursor:pointer;transition:all 0.2s;background:var(--bg);position:relative;}
.cs-upload-zone:hover{border-color:var(--verm);background:var(--verm-light);}
.cs-upload-zone.has-file{border-style:solid;border-color:var(--green);}
.cs-upload-zone-icon{font-size:24px;color:var(--muted);margin-bottom:8px;}
.cs-upload-zone-text{font-size:var(--text-md);color:var(--muted);}
.cs-upload-zone-file{font-size:var(--text-base);font-weight:600;color:var(--green);margin-top:6px;}
.cs-upload-zone input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer;}
.cs-upload-preview{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-top:12px;display:block;}

/* ── Preview Overlay ── */
.cs-preview-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto;}
.cs-preview-panel{background:var(--bg-surface);border-radius:20px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,0.15);}
.cs-preview-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.cs-preview-body{padding:24px;}
.cs-preview-cover{width:100%;max-height:240px;object-fit:cover;border-radius:0;}
.cs-preview-cat{display:inline-block;padding:3px 10px;border-radius:10px;background:var(--verm-light);color:var(--verm);font-size:var(--text-sm);font-weight:600;margin-bottom:12px;}
.cs-preview-title{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:800;color:var(--text);margin-bottom:8px;line-height:1.3;}
.cs-preview-coach{font-size:var(--text-md);color:var(--muted);margin-bottom:16px;}
.cs-preview-excerpt{font-size:var(--text-lg);color:var(--muted);line-height:1.6;margin-bottom:16px;font-style:italic;padding-bottom:16px;border-bottom:1px solid var(--border);}
.cs-preview-content{font-size:var(--text-lg);color:var(--text);line-height:1.8;white-space:pre-wrap;}
.cs-preview-actions{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;}

/* ── Published Detail ── */
.cs-pub-cover{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-bottom:16px;}
.cs-pub-title{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:800;color:var(--text);line-height:1.3;margin-bottom:8px;}
.cs-pub-meta{display:flex;align-items:center;gap:8px;font-size:var(--text-base);color:var(--muted);margin-bottom:16px;flex-wrap:wrap;}
.cs-pub-body{font-size:var(--text-lg);color:var(--text);line-height:1.8;white-space:pre-wrap;}

/* ── Share Tools ── */
.cs-share-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);}
.cs-share-label{font-size:var(--text-sm);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;}
.cs-share-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg-surface);font-size:var(--text-base);font-weight:600;color:var(--text);cursor:pointer;font-family:inherit;transition:all 0.15s;}
.cs-share-btn:hover{border-color:var(--verm);color:var(--verm);background:var(--verm-light);}
.cs-share-btn svg{width:16px;height:16px;flex-shrink:0;}

/* ── Readonly / Deletion ── */
.cs-readonly-label{display:inline-block;padding:4px 12px;border-radius:8px;background:var(--navy-light);color:var(--navy);font-size:var(--text-sm);font-weight:600;}
.cs-deletion-banner{padding:12px 16px;border-radius:10px;background:#FEF3C7;border:1px solid #FCD34D;display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.cs-deletion-banner-text{font-size:var(--text-md);color:#78350F;flex:1;}
.cs-deletion-banner-btn{padding:6px 12px;border-radius:6px;border:1px solid #92400E;background:none;color:#92400E;font-size:var(--text-sm);font-weight:600;cursor:pointer;font-family:inherit;}

/* ── Responsive ── */
@media(max-width:768px){
  .cs-content{padding:16px;}
  .cs-grid{grid-template-columns:1fr;}
  .cs-grid-2{grid-template-columns:1fr;}
  .cs-span2,.cs-span3{grid-column:span 1;}
  .cs-header-nav{display:none;}
  .cs-profile-card{flex-direction:column;align-items:center;text-align:center;}
  .cs-profile-meta{justify-content:center;}
  .cs-post-row{flex-direction:column;}
  .cs-post-cover-thumb{width:100%;height:120px;}
}
@media(max-width:480px){
  .cs-hero{padding:18px 20px;}
  .cs-hero-title{font-size:var(--text-2xl);}
}

/* ── Accordion ── */
.cs-accordion-header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;border:1px solid var(--border);background:var(--bg-surface);cursor:pointer;transition:all 0.15s;user-select:none;margin-bottom:8px;}
.cs-accordion-header:hover{border-color:var(--verm);background:var(--verm-light);}
.cs-accordion-header.open{border-color:var(--verm);background:var(--verm-light);}
.cs-accordion-header-title{flex:1;font-family:'Bricolage Grotesque',sans-serif;font-size:var(--text-lg);font-weight:700;color:var(--text);}
.cs-accordion-header-count{font-family:'DM Mono',monospace;font-size:var(--text-base);color:var(--muted);font-weight:400;}
.cs-accordion-chevron{width:20px;height:20px;color:var(--muted);transition:transform 0.2s ease;flex-shrink:0;}
.cs-accordion-header.open .cs-accordion-chevron{transform:rotate(180deg);}
.cs-accordion-content{display:none;padding-left:0;margin-bottom:8px;}
.cs-accordion-content.open{display:block;}
.cs-post-accordion-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--bg-surface);margin-bottom:6px;cursor:pointer;transition:all 0.15s;}
.cs-post-accordion-row:hover{border-color:var(--verm);box-shadow:0 2px 12px rgba(0,0,0,0.06);}
.cs-post-accordion-row.open{border-color:var(--verm);background:var(--verm-light);}
.cs-post-accordion-row .cs-post-row-body{flex:1;min-width:0;}
.cs-post-accordion-row .cs-accordion-chevron{transition:transform 0.2s ease;}
.cs-post-accordion-row.open .cs-accordion-chevron{transform:rotate(180deg);}
.cs-post-inline-detail{display:none;padding:0 4px;margin-bottom:10px;}
.cs-post-inline-detail.open{display:block;animation:slideUp 0.2s ease both;}

/* ── Animations ── */
@keyframes slideUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.cs-animate{animation:slideUp 0.3s ease both;}
</style>
</head>
<body>

<div class="cs-gate" id="cs-gate">
  <div class="cs-gate-spinner"></div>
  <div class="cs-gate-title">Koç Studio</div>
  <div class="cs-gate-msg" id="cs-gate-msg">Yükleniyor...</div>
</div>

<div class="cs-shell" id="cs-shell">
  <header class="cs-header">
    <span class="cs-logo"><span>hello</span>talent</span>
    <div class="cs-header-sep"></div>
    <div class="cs-header-label">Koç Studio</div>
    <div class="cs-header-nav" id="cs-nav">
      <button class="active" data-tab="profile">Profilim</button>
      <button data-tab="drafts">Yazılarım</button>
      <button data-tab="published">Yayında</button>
    </div>
    <div class="cs-header-right">
      <span class="cs-header-user" id="cs-user-name"></span>
      <button class="cs-btn-logout" id="cs-logout">Çıkış Yap</button>
    </div>
  </header>

  <div class="cs-content">
    <!-- TAB: Profilim -->
    <div class="cs-tab-content active" id="tab-profile">
      <div class="cs-hero">
        <div class="cs-hero-title">Koç Profilim</div>
        <div class="cs-hero-sub">Adayların seni nasıl göreceğini buradan yönet</div>
      </div>
      <div class="cs-grid" style="margin-bottom:16px;">
        <div class="cs-card cs-span2" id="cs-profile-card-area"></div>
        <div style="display:flex;flex-direction:column;gap:16px;">
          <div class="cs-card-sm" id="cs-stat-posts" style="text-align:center;"></div>
          <div class="cs-card-sm" id="cs-stat-likes" style="text-align:center;"></div>
          <div class="cs-card-sm" id="cs-stat-published" style="text-align:center;"></div>
        </div>
      </div>
      <div class="cs-card" id="cs-profile-form-area" style="display:none;"></div>
    </div>

    <!-- TAB: Yazılarım -->
    <div class="cs-tab-content" id="tab-drafts">
      <div class="cs-hero">

    { value: 'Store Leader', label: 'Store Leader' },
    { value: 'B\u00f6lge M\u00fcd\u00fcr\u00fc', label: 'B\u00f6lge M\u00fcd\u00fcr\u00fc' },

    { value: 'B\u00f6lge G\u00f6rsel M\u00fcd\u00fcr\u00fc', label: 'B\u00f6lge G\u00f6rsel M\u00fcd\u00fcr\u00fc' },
    { value: 'B\u00f6lge Sat\u0131\u015f M\u00fcd\u00fcr\u00fc', label: 'B\u00f6lge Sat\u0131\u015f M\u00fcd\u00fcr\u00fc' },
    { value: 'B\u00f6lge Direkt\u00f6r\u00fc', label: 'B\u00f6lge Direkt\u00f6r\u00fc' },
    { value: '\u00dclke M\u00fcd\u00fcr\u00fc', label: '\u00dclke M\u00fcd\u00fcr\u00fc' }
  ];

  var STATUS_LABELS = {
    draft: 'Taslak', submitted: '\u0130ncelemede', changes_requested: 'D\u00fczeltme Gerekli',
    published: 'Yay\u0131nda', archived: 'Ar\u015fivlendi', rejected: 'Reddedildi'
  };

  var gateEl = document.getElementById('cs-gate');
  var gateMsg = document.getElementById('cs-gate-msg');
  var shellEl = document.getElementById('cs-shell');

  function showGate(msg) { gateEl.style.display = 'flex'; shellEl.className = 'cs-shell'; gateMsg.textContent = msg || 'Y\u00fckleniyor...'; }
  function showStudio() { gateEl.style.display = 'none'; shellEl.className = 'cs-shell active'; }

  /* ══ AUTH + ACCESS CHECK ══ */
  async function init() {
    try {
      var sessionRes = await _supa.auth.getSession();
      var session = sessionRes.data && sessionRes.data.session;
      if (!session) {
        try { sessionStorage.setItem('ht_return_url', window.location.href); } catch(e) {}
        window.location.replace('giris.html');
        return;
      }
      var userId = session.user.id;
      var profileRes = await _supa.from('coach_profiles').select('*').eq('id', userId).maybeSingle();
      if (profileRes.data) {
        if (profileRes.data.is_active === false) {
          showGate('Hesab\u0131n\u0131z ask\u0131ya al\u0131nm\u0131\u015ft\u0131r. Destek i\u00e7in support@hellotalent.ai adresine yazabilirsiniz.');
          return;
        }
        _coachProfile = profileRes.data;
        startStudio();
        return;
      }
      var params = new URLSearchParams(window.location.search);
      var token = params.get('token');
      if (!token) {
        showGate('Eri\u015fim yetkiniz yok. Davet ba\u011flant\u0131s\u0131 gereklidir.');
        setTimeout(function() { window.location.replace('giris.html'); }, 3000);
        return;
      }
      showGate('Davet kabul ediliyor...');
      var acceptRes = await _supa.rpc('accept_coach_invite', { p_token: token });
      if (acceptRes.error) { showGate('Hata: ' + acceptRes.error.message); return; }
      _coachProfile = acceptRes.data;
      window.history.replaceState({}, '', 'coach-studio.html');
      startStudio();
    } catch (e) {
      console.error('Coach studio init error:', e);
      showGate('Ba\u011flant\u0131 hatas\u0131. L\u00fctfen tekrar deneyin.');
    }
  }

  function startStudio() {
    document.getElementById('cs-user-name').textContent = _coachProfile.display_name || '';
    showStudio();
    loadPosts().then(function() {
      renderProfileTab();
      if (!_coachProfile.title && !_coachProfile.bio_short) {
        switchTab('profile');
        toggleProfileForm(true);
      }
    });
    initNavigation();
  }

  /* ══ NAVIGATION ══ */
  function initNavigation() {
    var navBtns = document.querySelectorAll('#cs-nav button');
    for (var i = 0; i < navBtns.length; i++) {
      navBtns[i].addEventListener('click', (function(btn) {
        return function() { switchTab(btn.getAttribute('data-tab')); };
      })(navBtns[i]));
    }
  }

  function switchTab(tabName) {
    _currentTab = tabName;
    _activePostId = null;
    var navBtns = document.querySelectorAll('#cs-nav button');
    for (var i = 0; i < navBtns.length; i++) {
      navBtns[i].classList.toggle('active', navBtns[i].getAttribute('data-tab') === tabName);
    }
    var tabs = document.querySelectorAll('.cs-tab-content');
    for (var j = 0; j < tabs.length; j++) {
      tabs[j].classList.toggle('active', tabs[j].id === 'tab-' + tabName);
    }
    if (tabName === 'profile') renderProfileTab();
    else if (tabName === 'drafts') renderDraftsTab();
    else if (tabName === 'published') renderPublishedTab();
  }

  /* ══ LOAD POSTS ══ */
  async function loadPosts() {
    try {
      var cols = 'id, title, excerpt, body, status, category, related_role, cover_image_url, cover_image_alt, like_count, admin_note, created_at, updated_at, published_at';
      /* deletion_requested_at may not exist yet if migration not deployed — defensive */
      var res = await _supa.from('coach_posts')
        .select(cols + ', deletion_requested_at')
        .eq('coach_id', _coachProfile.id)
        .order('updated_at', { ascending: false });
      if (res.error && res.error.message && res.error.message.indexOf('deletion_requested_at') !== -1) {
        /* Fallback without new column */
        res = await _supa.from('coach_posts')
          .select(cols)
          .eq('coach_id', _coachProfile.id)
          .order('updated_at', { ascending: false });
      }
      _posts = res.data || [];
    } catch (e) { console.error('Load posts error:', e); }
  }

  /* ══ PROFILE TAB ══ */
  function renderProfileTab() { renderProfileCard(); renderProfileStats(); }

  function renderProfileCard() {
    var area = document.getElementById('cs-profile-card-area');
    if (!area) return;
    clear(area);
    var p = _coachProfile;
    var card = document.createElement('div');
    card.className = 'cs-profile-card';
    if (p.avatar_url) {
      var img = document.createElement('img');
      img.className = 'cs-profile-avatar';
      img.src = p.avatar_url;
      img.alt = p.display_name || '';
      card.appendChild(img);
    } else {
      var ph = document.createElement('div');
      ph.className = 'cs-profile-avatar-placeholder';
      ph.textContent = (p.display_name || '?').charAt(0).toUpperCase();
      card.appendChild(ph);
    }
    var info = document.createElement('div');
    info.className = 'cs-profile-info';
    var name = document.createElement('div');
    name.className = 'cs-profile-name';
    name.textContent = p.display_name || '\u0130simsiz Ko\u00e7';
    info.appendChild(name);
    if (p.title) { var t = document.createElement('div'); t.className = 'cs-profile-title'; t.textContent = p.title; info.appendChild(t); }
    if (p.bio_short) { var bio = document.createElement('div'); bio.className = 'cs-profile-bio'; bio.textContent = p.bio_short; info.appendChild(bio); }
    var meta = document.createElement('div');
    meta.className = 'cs-profile-meta';
    if (p.sector_background) meta.appendChild(makeTag(p.sector_background));
    if (p.experience_years) meta.appendChild(makeTag(p.experience_years + ' y\u0131l deneyim'));
    if (p.linkedin_url) { var li = makeTag('LinkedIn'); li.style.cursor = 'pointer'; li.style.color = 'var(--navy)'; li.addEventListener('click', function() { window.open(p.linkedin_url, '_blank', 'noopener,noreferrer'); }); meta.appendChild(li); }
    info.appendChild(meta);
    var editBtn = document.createElement('button');
    editBtn.className = 'cs-profile-edit-btn';
    editBtn.textContent = 'Profili D\u00fczenle';
    editBtn.addEventListener('click', function() { toggleProfileForm(true); });
    info.appendChild(editBtn);
    card.appendChild(info);
    area.appendChild(card);
  }

  function makeTag(text) { var t = document.createElement('span'); t.className = 'cs-profile-tag'; t.textContent = text; return t; }

  function renderProfileStats() {
    var totalPosts = _posts.length;
    var publishedPosts = _posts.filter(function(p) { return p.status === 'published'; }).length;
    var totalLikes = 0;
    for (var i = 0; i < _posts.length; i++) totalLikes += (_posts[i].like_count || 0);
    fillStat('cs-stat-posts', totalPosts, 'Toplam Yaz\u0131');
    fillStat('cs-stat-likes', totalLikes, 'Toplam Be\u011feni');
    fillStat('cs-stat-published', publishedPosts, 'Yay\u0131nda');
  }

  function fillStat(id, num, label) {
    var el = document.getElementById(id);
    if (!el) return;
    clear(el);
    var n = document.createElement('div'); n.className = 'cs-stat-num'; n.textContent = num; el.appendChild(n);
    var l = document.createElement('div'); l.className = 'cs-stat-label'; l.textContent = label; el.appendChild(l);
  }

  var _profileFormOpen = false;
  function toggleProfileForm(open) {
    _profileFormOpen = open;
    var area = document.getElementById('cs-profile-form-area');
    if (!area) return;
    area.style.display = open ? 'block' : 'none';
    if (open) renderProfileForm();
  }

  function renderProfileForm() {
    var area = document.getElementById('cs-profile-form-area');
    if (!area) return;
    clear(area);
    var p = _coachProfile;
    var heading = document.createElement('h3');
    heading.style.cssText = "font-family:'Bricolage Grotesque',sans-serif;font-size:var(--text-xl);font-weight:700;margin-bottom:16px;";
    heading.textContent = 'Profil Bilgilerini D\u00fczenle';
    area.appendChild(heading);
    var grid = document.createElement('div');
    grid.className = 'cs-grid-2';
    grid.appendChild(buildField('G\u00f6r\u00fcnen Ad', 'input', 'cs-p-name', p.display_name || '', 80));
    grid.appendChild(buildField('Unvan', 'input', 'cs-p-title', p.title || '', 100, '\u00d6rn: Perakende \u0130K Dan\u0131\u015fman\u0131'));
    grid.appendChild(buildField('Sekt\u00f6r Ge\u00e7mi\u015fi', 'input', 'cs-p-sector', p.sector_background || '', 120, '\u00d6rn: H\u0131zl\u0131 moda, l\u00fcks'));
    grid.appendChild(buildField('Deneyim (y\u0131l)', 'input', 'cs-p-years', p.experience_years != null ? String(p.experience_years) : '', 3));
    area.appendChild(grid);
    area.appendChild(buildField('K\u0131sa Biyografi', 'textarea', 'cs-p-bio', p.bio_short || '', 300, 'K\u0131sa tan\u0131t\u0131m metni (maks. 300 karakter)', 3));
    area.appendChild(buildField('LinkedIn', 'input', 'cs-p-linkedin', p.linkedin_url || '', 200, 'https://linkedin.com/in/kullaniciadi'));

    /* Avatar upload */
    var avSec = document.createElement('div'); avSec.className = 'cs-field';
    var avLabel = document.createElement('label'); avLabel.textContent = 'Profil Foto\u011fraf\u0131'; avSec.appendChild(avLabel);
    if (p.avatar_url) {
      var avPrev = document.createElement('img'); avPrev.id = 'cs-avatar-preview'; avPrev.src = p.avatar_url;
      avPrev.style.cssText = 'width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--border);margin-bottom:8px;display:block;';
      avSec.appendChild(avPrev);
    }
    var avInput = document.createElement('input'); avInput.type = 'file'; avInput.accept = 'image/jpeg,image/png,image/webp'; avInput.id = 'cs-avatar-input'; avInput.style.cssText = 'font-size:var(--text-base);';
    avInput.addEventListener('change', handleAvatarUpload); avSec.appendChild(avInput);
    var avHint = document.createElement('div'); avHint.className = 'cs-field-hint'; avHint.textContent = 'JPG, PNG veya WebP. Maks. 2 MB.'; avSec.appendChild(avHint);
    var avMsg = document.createElement('div'); avMsg.id = 'cs-avatar-msg'; avMsg.className = 'cs-msg'; avSec.appendChild(avMsg);
    area.appendChild(avSec);

    var actions = document.createElement('div'); actions.className = 'cs-actions';
    var saveBtn = document.createElement('button'); saveBtn.className = 'cs-btn cs-btn-secondary'; saveBtn.textContent = 'Profili Kaydet'; saveBtn.addEventListener('click', saveProfile); actions.appendChild(saveBtn);
    var cancelBtn = document.createElement('button'); cancelBtn.className = 'cs-btn cs-btn-ghost'; cancelBtn.textContent = 'Vazge\u00e7'; cancelBtn.addEventListener('click', function() { toggleProfileForm(false); }); actions.appendChild(cancelBtn);
    area.appendChild(actions);
    var msg = document.createElement('div'); msg.className = 'cs-msg'; msg.id = 'cs-profile-msg'; area.appendChild(msg);
  }

  async function saveProfile() {
    var nameEl = document.getElementById('cs-p-name'); var msgEl = document.getElementById('cs-profile-msg');
    var displayName = nameEl ? nameEl.value.trim() : '';
    if (!displayName) { showMsg(msgEl, 'G\u00f6r\u00fcnen ad gereklidir.', 'error'); return; }
    var yearsEl = document.getElementById('cs-p-years');
    var yearsVal = yearsEl && yearsEl.value.trim() ? parseInt(yearsEl.value.trim(), 10) : null;
    if (yearsVal !== null && (isNaN(yearsVal) || yearsVal < 0 || yearsVal > 50)) { showMsg(msgEl, 'Deneyim y\u0131l\u0131 0-50 aras\u0131 olmal\u0131d\u0131r.', 'error'); return; }
    var linkedinEl = document.getElementById('cs-p-linkedin');
    var linkedinVal = linkedinEl ? linkedinEl.value.trim() : '';
    if (linkedinVal && linkedinVal.indexOf('http') !== 0) linkedinVal = 'https://' + linkedinVal;
    var updates = { display_name: displayName, title: valOrNull('cs-p-title'), sector_background: valOrNull('cs-p-sector'), experience_years: yearsVal, bio_short: valOrNull('cs-p-bio'), linkedin_url: linkedinVal || null };
    try {
      var res = await _supa.from('coach_profiles').update(updates).eq('id', _coachProfile.id);
      if (res.error) { showMsg(msgEl, 'Hata: ' + res.error.message, 'error'); return; }
      Object.assign(_coachProfile, updates);
      document.getElementById('cs-user-name').textContent = updates.display_name;
      showMsg(msgEl, 'Profil kaydedildi.', 'success');
      renderProfileCard();
    } catch (e) { console.error('Save profile error:', e); showMsg(msgEl, 'Kaydetme hatas\u0131.', 'error'); }
  }

  function valOrNull(id) { var el = document.getElementById(id); return el && el.value.trim() ? el.value.trim() : null; }

  async function handleAvatarUpload() {
    var input = document.getElementById('cs-avatar-input'); var msgEl = document.getElementById('cs-avatar-msg');
    if (!input || !input.files || !input.files.length) return;
    var file = input.files[0];
    if (file.size > 2 * 1024 * 1024) { showMsg(msgEl, 'Dosya 2 MB\'dan k\u00fc\u00e7\u00fck olmal\u0131.', 'error'); return; }
    var ext = file.name.split('.').pop().toLowerCase();
    if (['jpg','jpeg','png','webp'].indexOf(ext) === -1) { showMsg(msgEl, 'Sadece JPG, PNG veya WebP.', 'error'); return; }
    var path = 'coach_avatars/' + _coachProfile.id + '.' + ext;
    try {
      showMsg(msgEl, 'Y\u00fckleniyor...', 'info');
      var upRes = await _supa.storage.from('cvs').upload(path, file, { upsert: true, cacheControl: '3600', contentType: file.type });
      if (upRes.error) { showMsg(msgEl, 'Y\u00fckleme hatas\u0131: ' + upRes.error.message, 'error'); return; }
      var dbRes = await _supa.from('coach_profiles').update({ avatar_url: path }).eq('id', _coachProfile.id);
      if (dbRes.error) { showMsg(msgEl, 'Kay\u0131t hatas\u0131: ' + dbRes.error.message, 'error'); return; }
      _coachProfile.avatar_url = path;
      var signedUrl = await window.HT.signStorageUrl(path);
      var preview = document.getElementById('cs-avatar-preview');
      if (preview) preview.src = signedUrl;
      showMsg(msgEl, 'Profil foto\u011fraf\u0131 g\u00fcncellendi.', 'success');
      renderProfileCard();
    } catch (e) { console.error('Avatar upload error:', e); showMsg(msgEl, 'Y\u00fckleme hatas\u0131.', 'error'); }
  }

  /* ══ DRAFTS TAB ══ */
  var _draftsAccordionOpen = true;
  var _expandedDraftId = null;
  var _newDraftId = null; /* tracks freshly created draft for Vazgeç cleanup */

  function renderDraftsTab() {
    _activePostId = null;
    _expandedDraftId = null;
    var toolbar = document.getElementById('cs-drafts-toolbar');
    var list = document.getElementById('cs-drafts-list');
    var editorArea = document.getElementById('cs-editor-area');
    clear(toolbar); clear(list); editorArea.style.display = 'none';
    var newBtn = document.createElement('button'); newBtn.className = 'cs-btn cs-btn-primary'; newBtn.textContent = '+ Yeni Yaz\u0131'; newBtn.addEventListener('click', createNewPost); toolbar.appendChild(newBtn);
    var drafts = _posts.filter(function(p) { return p.status === 'draft' || p.status === 'submitted' || p.status === 'changes_requested' || p.status === 'rejected'; });
    if (drafts.length === 0) {
      var empty = document.createElement('div'); empty.style.cssText = 'text-align:center;padding:40px 20px;color:var(--muted);font-size:var(--text-lg);'; empty.textContent = 'Hen\u00fcz taslak yaz\u0131 yok. Yeni bir yaz\u0131 olu\u015fturarak ba\u015flay\u0131n.'; list.appendChild(empty); return;
    }
    /* Accordion header */
    var accHeader = document.createElement('div');
    accHeader.className = 'cs-accordion-header' + (_draftsAccordionOpen ? ' open' : '');
    var accTitle = document.createElement('span');
    accTitle.className = 'cs-accordion-header-title';
    accTitle.textContent = 'Taslaklar';
    accHeader.appendChild(accTitle);
    var accCount = document.createElement('span');
    accCount.className = 'cs-accordion-header-count';
    accCount.textContent = '(' + drafts.length + ')';
    accHeader.appendChild(accCount);
    accHeader.appendChild(makeChevronSVG());
    var accContent = document.createElement('div');
    accContent.className = 'cs-accordion-content' + (_draftsAccordionOpen ? ' open' : '');
    accHeader.addEventListener('click', function() {
      _draftsAccordionOpen = !_draftsAccordionOpen;
      accHeader.classList.toggle('open', _draftsAccordionOpen);
      accContent.classList.toggle('open', _draftsAccordionOpen);
    });
    list.appendChild(accHeader);
    for (var i = 0; i < drafts.length; i++) {
      var postWrapper = buildDraftAccordionRow(drafts[i]);
      accContent.appendChild(postWrapper);
    }
    list.appendChild(accContent);
  }

  function buildDraftAccordionRow(post) {
    var wrapper = document.createElement('div');
    var row = document.createElement('div');

  /* ── Cover Upload Zone ── */
  function buildCoverUploadZone(post) {
    var section = document.createElement('div'); section.className = 'cs-field';

    var hint = document.createElement('div'); hint.className = 'cs-field-hint'; hint.style.marginTop = '6px'; hint.textContent = 'JPG, PNG veya WebP \u00b7 Maks. 5 MB'; zone.appendChild(hint);

  /* ══ SAVE POST ══ */
  async function savePost(postId, submit) {
    var titleEl = document.getElementById('cs-f-title'); var bodyEl = document.getElementById('cs-f-body'); var msgEl = document.getElementById('cs-editor-msg');
    if (!titleEl || !bodyEl) return;
    var title = titleEl.value.trim(); var body = bodyEl.value.trim();
    if (!title) { showMsg(msgEl, 'Ba\u015fl\u0131k gereklidir.', 'error'); return; }
    if (submit && !body) { showMsg(msgEl, '\u0130\u00e7erik gereklidir.', 'error'); return; }
    if (_pendingCoverFile) { var ok = await uploadCover(postId); if (!ok) return; }
    var coverAltEl = document.getElementById('cs-f-cover-alt'); var coverAltVal = coverAltEl ? coverAltEl.value.trim() : '';
    var excerptEl = document.getElementById('cs-f-excerpt'); var catEl = document.getElementById('cs-f-category'); var roleEl = document.getElementById('cs-f-role');
    var updates = { title: title, excerpt: excerptEl ? excerptEl.value.trim() : '', body: body, category: catEl ? catEl.value : 'mulakat_ipucu', related_role: roleEl && roleEl.value ? roleEl.value : null, cover_image_alt: coverAltVal || null };
    if (submit) updates.status = 'submitted';
    try {
      var res = await _supa.from('coach_posts').update(updates).eq('id', postId);
      if (res.error) { showMsg(msgEl, 'Hata: ' + res.error.message, 'error'); return; }
      await loadPosts();
      if (submit) {
        renderDraftsTab();
      } else {
        /* Refresh inline editor if in accordion mode */
        var inlineDetail = _expandedDraftId === postId ? findOpenInlineDetail() : null;
        if (inlineDetail) {
          loadDraftInlineEditor(postId, inlineDetail);
        } else {
          openEditor(postId);
        }
      }
      /* Show msg after re-render (msgEl may be recreated) */
      var freshMsg = document.getElementById('cs-editor-msg');
      showMsg(freshMsg, submit ? '\u0130ncelemeye g\u00f6nderildi.' : 'Kaydedildi.', 'success');
    } catch (e) { console.error('Save error:', e); showMsg(msgEl, 'Kaydetme hatas\u0131.', 'error'); }
  }

  async function uploadCover(postId) {
    var file = _pendingCoverFile; if (!file) return true;
    var msgEl = document.getElementById('cs-cover-msg');
    var ext = file.name.split('.').pop().toLowerCase();
    var path = 'coach_covers/' + postId + '/' + Date.now() + '_cover.' + ext;
    try {
      showMsg(msgEl, 'Kapak y\u00fckleniyor...', 'info');
      var upRes = await _supa.storage.from('cvs').upload(path, file, { upsert: true, cacheControl: '3600', contentType: file.type });
      if (upRes.error) { showMsg(msgEl, 'Y\u00fckleme hatas\u0131: ' + upRes.error.message, 'error'); return false; }
      var dbRes = await _supa.from('coach_posts').update({ cover_image_url: path }).eq('id', postId);
      if (dbRes.error) { showMsg(msgEl, 'Kay\u0131t hatas\u0131: ' + dbRes.error.message, 'error'); return false; }
      _pendingCoverFile = null; return true;
    } catch (e) { console.error('Cover upload error:', e); showMsg(msgEl, 'Y\u00fckleme hatas\u0131.', 'error'); return false; }
  }

  /* ══ PREVIEW BEFORE SUBMIT ══ */
  function showPreview(postId, andSubmit) {
    var titleEl = document.getElementById('cs-f-title'); var excerptEl = document.getElementById('cs-f-excerpt'); var bodyEl = document.getElementById('cs-f-body'); var catEl = document.getElementById('cs-f-category');
    if (!titleEl) return;
    var title = titleEl.value.trim(); var body = bodyEl ? bodyEl.value.trim() : '';
    if (!title) { showMsg(document.getElementById('cs-editor-msg'), 'Ba\u015fl\u0131k gereklidir.', 'error'); return; }
    if (andSubmit && !body) { showMsg(document.getElementById('cs-editor-msg'), '\u0130\u00e7erik gereklidir.', 'error'); return; }
    var overlay = document.createElement('div'); overlay.className = 'cs-preview-overlay'; overlay.id = 'cs-preview-overlay';
    var panel = document.createElement('div'); panel.className = 'cs-preview-panel';
    /* Header */
    var header = document.createElement('div'); header.className = 'cs-preview-header';
    var hTitle = document.createElement('div'); hTitle.style.cssText = "font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:var(--text-xl);flex:1;"; hTitle.textContent = '\u00d6n \u0130zleme'; header.appendChild(hTitle);
    var closeBtn = document.createElement('button'); closeBtn.className = 'cs-btn cs-btn-ghost cs-btn-sm'; closeBtn.textContent = 'Kapat';
    closeBtn.addEventListener('click', function() { document.body.removeChild(overlay); }); header.appendChild(closeBtn);
    panel.appendChild(header);
    /* Cover */
    var localP = document.getElementById('cs-cover-local-preview'); var existP = document.getElementById('cs-cover-existing');
    var coverSrc = localP ? localP.src : (existP ? existP.src : null);
    if (coverSrc) { var cImg = document.createElement('img'); cImg.className = 'cs-preview-cover'; cImg.src = coverSrc; panel.appendChild(cImg); }
    var pBody = document.createElement('div'); pBody.className = 'cs-preview-body';
    var catVal = catEl ? catEl.value : '';
    if (catVal && CATEGORY_MAP[catVal]) { var cp = document.createElement('div'); cp.className = 'cs-preview-cat'; cp.textContent = CATEGORY_MAP[catVal]; pBody.appendChild(cp); }
    var pTitle = document.createElement('div'); pTitle.className = 'cs-preview-title'; pTitle.textContent = title; pBody.appendChild(pTitle);
    var pCoach = document.createElement('div'); pCoach.className = 'cs-preview-coach'; pCoach.textContent = (_coachProfile.display_name || '') + (_coachProfile.title ? ' \u00b7 ' + _coachProfile.title : ''); pBody.appendChild(pCoach);
    var excerpt = excerptEl ? excerptEl.value.trim() : '';
    if (excerpt) { var pExc = document.createElement('div'); pExc.className = 'cs-preview-excerpt'; pExc.textContent = excerpt; pBody.appendChild(pExc); }
    var pContent = document.createElement('div'); pContent.className = 'cs-preview-content'; pContent.textContent = body; pBody.appendChild(pContent);
    panel.appendChild(pBody);
    /* Actions */
    var actions = document.createElement('div'); actions.className = 'cs-preview-actions';
    var backBtn = document.createElement('button'); backBtn.className = 'cs-btn cs-btn-ghost'; backBtn.textContent = 'D\u00fczenlemeye D\u00f6n';
    backBtn.addEventListener('click', function() { document.body.removeChild(overlay); }); actions.appendChild(backBtn);
    if (andSubmit) {
      var confirmBtn = document.createElement('button'); confirmBtn.className = 'cs-btn cs-btn-primary'; confirmBtn.textContent = 'Onayla ve \u0130ncelemeye G\u00f6nder';
      confirmBtn.addEventListener('click', function() { document.body.removeChild(overlay); savePost(postId, true); }); actions.appendChild(confirmBtn);
    }
    panel.appendChild(actions);
    overlay.appendChild(panel);
    overlay.addEventListener('click', function(e) { if (e.target === overlay) document.body.removeChild(overlay); });
    document.body.appendChild(overlay);
  }

  /* ══ PUBLISHED TAB ══ */
  var _expandedPublishedId = null;

  function renderPublishedTab() {
    var list = document.getElementById('cs-published-list'); var detailArea = document.getElementById('cs-published-detail-area');
    clear(list); detailArea.style.display = 'none';
    _expandedPublishedId = null;
    var published = _posts.filter(function(p) { return p.status === 'published'; });
    if (published.length === 0) {
      var empty = document.createElement('div'); empty.style.cssText = 'text-align:center;padding:40px 20px;color:var(--muted);font-size:var(--text-lg);'; empty.textContent = 'Hen\u00fcz yay\u0131nlanm\u0131\u015f yaz\u0131 yok.'; list.appendChild(empty); return;
    }
    for (var i = 0; i < published.length; i++) {
      list.appendChild(buildPublishedAccordionRow(published[i]));
    }
  }

  function buildPublishedAccordionRow(post) {
    var wrapper = document.createElement('div');
    var row = document.createElement('div');
    row.className = 'cs-post-accordion-row';
    if (post.cover_image_url) {
      var thumb = document.createElement('img'); thumb.className = 'cs-post-cover-thumb'; thumb.src = post.cover_image_url; thumb.alt = post.cover_image_alt || ''; row.appendChild(thumb);
    }
    var body = document.createElement('div'); body.className = 'cs-post-row-body';
    var title = document.createElement('div'); title.className = 'cs-post-row-title'; title.textContent = post.title || '(Ba\u015fl\u0131ks\u0131z)'; body.appendChild(title);
    var meta = document.createElement('div'); meta.className = 'cs-post-row-meta';
    var badge = document.createElement('span'); badge.className = 'cs-badge cs-badge-published'; badge.textContent = STATUS_LABELS[post.status] || post.status; meta.appendChild(badge);
    var cat = CATEGORY_MAP[post.category]; if (cat) { var cs = document.createElement('span'); cs.textContent = cat; meta.appendChild(cs); }
    if (post.like_count > 0) { var ls = document.createElement('span'); ls.textContent = '\u2661 ' + post.like_count; meta.appendChild(ls); }
    var dateStr = post.published_at || post.updated_at;
    var ds = document.createElement('span'); ds.textContent = formatDate(dateStr); meta.appendChild(ds);
    body.appendChild(meta); row.appendChild(body);
    row.appendChild(makeChevronSVG());
    var detail = document.createElement('div');
    detail.className = 'cs-post-inline-detail';
    row.addEventListener('click', function() {
      if (_expandedPublishedId === post.id) {
        _expandedPublishedId = null;
        row.classList.remove('open');
        detail.classList.remove('open');
        clear(detail);
        return;
      }
      /* Close any previously open */
      var listEl = document.getElementById('cs-published-list');
      var prevRows = listEl ? listEl.querySelectorAll('.cs-post-accordion-row.open') : [];
      for (var j = 0; j < prevRows.length; j++) { prevRows[j].classList.remove('open'); }
      var prevDetails = listEl ? listEl.querySelectorAll('.cs-post-inline-detail.open') : [];
      for (var k = 0; k < prevDetails.length; k++) { prevDetails[k].classList.remove('open'); clear(prevDetails[k]); }
      _expandedPublishedId = post.id;
      row.classList.add('open');
      detail.classList.add('open');
      loadPublishedInlineDetail(post.id, detail);
    });
    wrapper.appendChild(row);
    wrapper.appendChild(detail);
    return wrapper;
  }

  async function loadPublishedInlineDetail(postId, container) {
    clear(container);
    var loading = document.createElement('div');
    loading.style.cssText = 'padding:16px;color:var(--muted);font-size:var(--text-md);';
    loading.textContent = 'Y\u00fckleniyor...';
    container.appendChild(loading);
    try {
      var cols = '*, deletion_requested_at';
      var res = await _supa.from('coach_posts').select(cols).eq('id', postId).maybeSingle();
      if (res.error) {
        res = await _supa.from('coach_posts').select('*').eq('id', postId).maybeSingle();
      }
      if (!res.data) { loading.textContent = 'Yaz\u0131 bulunamad\u0131'; return; }
      clear(container);
      renderPublishedInlineDetail(res.data, container);
    } catch (e) { console.error('Open published inline error:', e); loading.textContent = 'Y\u00fckleme hatas\u0131'; }
  }

  function renderPublishedInlineDetail(post, container) {
    var card = document.createElement('div'); card.className = 'cs-editor-card cs-animate';
    /* Deletion banner */
    if (post.deletion_requested_at) {
      var banner = document.createElement('div'); banner.className = 'cs-deletion-banner';
      var bText = document.createElement('div'); bText.className = 'cs-deletion-banner-text'; bText.textContent = 'Silme talebi g\u00f6nderildi (' + formatDate(post.deletion_requested_at) + '). Admin onay\u0131 bekleniyor.'; banner.appendChild(bText);
      var cBtn = document.createElement('button'); cBtn.className = 'cs-deletion-banner-btn'; cBtn.textContent = 'Talebi \u0130ptal Et'; cBtn.addEventListener('click', function() { cancelDeletionRequest(post.id); }); banner.appendChild(cBtn);
      card.appendChild(banner);
    }
    if (post.cover_image_url) { var ci = document.createElement('img'); ci.className = 'cs-pub-cover'; ci.src = post.cover_image_url; ci.alt = post.cover_image_alt || ''; card.appendChild(ci); }
    if (post.category && CATEGORY_MAP[post.category]) { var cPill = document.createElement('span'); cPill.className = 'cs-badge cs-badge-published'; cPill.style.cssText = 'background:var(--verm-light);color:var(--verm);'; cPill.textContent = CATEGORY_MAP[post.category]; card.appendChild(cPill); }
    var title = document.createElement('div'); title.className = 'cs-pub-title'; title.textContent = post.title; card.appendChild(title);
    var meta = document.createElement('div'); meta.className = 'cs-pub-meta';
    meta.appendChild(makeSpan('Yay\u0131n: ' + formatDate(post.published_at)));
    meta.appendChild(makeSpan('\u00b7'));
    meta.appendChild(makeSpan('\u2661 ' + (post.like_count || 0) + ' be\u011feni'));
    if (post.related_role) { meta.appendChild(makeSpan('\u00b7')); meta.appendChild(makeSpan(post.related_role)); }
    card.appendChild(meta);
    if (post.excerpt) { var exc = document.createElement('div'); exc.style.cssText = 'font-size:var(--text-lg);color:var(--muted);line-height:1.6;margin-bottom:16px;font-style:italic;padding-bottom:16px;border-bottom:1px solid var(--border);'; exc.textContent = post.excerpt; card.appendChild(exc); }
    var bd = document.createElement('div'); bd.className = 'cs-pub-body'; bd.textContent = post.body; card.appendChild(bd);
    /* Share bar */
    card.appendChild(buildShareBar(post));
    /* Actions — no "Listeye D\u00f6n" needed, accordion chevron handles it */
    var actions = document.createElement('div'); actions.className = 'cs-actions'; actions.style.marginTop = '16px';
    if (!post.deletion_requested_at) {
      var delBtn = document.createElement('button'); delBtn.className = 'cs-btn cs-btn-danger cs-btn-sm'; delBtn.textContent = 'Silme Talebi G\u00f6nder'; delBtn.addEventListener('click', function() { requestDeletion(post.id); }); actions.appendChild(delBtn);
    }
    card.appendChild(actions);
    var mEl = document.createElement('div'); mEl.className = 'cs-msg'; mEl.id = 'cs-pub-msg'; card.appendChild(mEl);
    container.appendChild(card);
  }

  /* Keep legacy openPublishedDetail for deletion request refresh */
  async function openPublishedDetail(postId) {
    /* After deletion request/cancel, refresh the inline detail if open */
    if (_expandedPublishedId === postId) {
      var listEl = document.getElementById('cs-published-list');
      var openDetails = listEl ? listEl.querySelectorAll('.cs-post-inline-detail.open') : [];
      for (var i = 0; i < openDetails.length; i++) {
        loadPublishedInlineDetail(postId, openDetails[i]);
      }
    }
  }

  /* ══ SHARE TOOLS ══ */
  function buildShareBar(post) {
    var bar = document.createElement('div'); bar.className = 'cs-share-bar';
    var label = document.createElement('div'); label.className = 'cs-share-label'; label.textContent = 'Payla\u015f'; bar.appendChild(label);
    var shareUrl = 'https://hellotalent.ai';
    var shareText = buildShareText(post);
    /* WhatsApp — supports text+link natively */
    bar.appendChild(makeShareBtn('WhatsApp', function() { window.open('https://wa.me/?text=' + encodeURIComponent(shareText + '\n\n' + shareUrl), '_blank', 'noopener,noreferrer'); }));
    /* LinkedIn — sharing API only supports URL; text must be copied separately */
    bar.appendChild(makeShareBtn('LinkedIn', function() { window.open('https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(shareUrl), '_blank'); copyToClipboard(shareText); }));
    /* Facebook */
    bar.appendChild(makeShareBtn('Facebook', function() { window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(shareUrl), '_blank', 'noopener,noreferrer'); }));
    /* Copy share text */
    bar.appendChild(makeShareBtn('Metni Kopyala', function() { copyToClipboard(shareText + '\n\n' + shareUrl); }));
    return bar;
  }

  function buildShareText(post) {
    var coach = _coachProfile.display_name || '';
    var title = post.title || '';
    return coach + ' olarak HelloTalent\'ta "\u201C' + title + '\u201D" ba\u015fl\u0131kl\u0131 yaz\u0131m\u0131 payla\u015f\u0131yorum.\n\nPerakende ve ma\u011faza profesyonellerine y\u00f6nelik i\u00e7erikler i\u00e7in HelloTalent\'\u0131 ke\u015ffedin.';
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function() {});
    }
  }

  var SHARE_ICONS = {
    WhatsApp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
    LinkedIn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>',
    Facebook: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>',
    'Metni Kopyala': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'
  };

  function makeShareBtn(label, handler) {
    var btn = document.createElement('button'); btn.className = 'cs-share-btn';
    if (SHARE_ICONS[label]) {
      var iconWrap = document.createElement('span');
      iconWrap.style.cssText = 'display:inline-flex;width:16px;height:16px;';
      iconWrap.innerHTML = SHARE_ICONS[label];
      btn.appendChild(iconWrap);
    }
    var txt = document.createElement('span'); txt.textContent = label; btn.appendChild(txt);
    btn.addEventListener('click', handler);
    return btn;
  }

  function makeChevronSVG() {
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    svg.setAttribute('class', 'cs-accordion-chevron');
    var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', 'M6 9l6 6 6-6');
    svg.appendChild(path);
    return svg;
  }

  /* ══ DELETION REQUEST ══ */
  async function requestDeletion(postId) {
    var confirmed = window.confirm('Bu yaz\u0131 i\u00e7in silme talebi g\u00f6ndermek istedi\u011finize emin misiniz? Admin onay\u0131 gereklidir.');
    if (!confirmed) return;
    var msgEl = document.getElementById('cs-pub-msg');
    try {
      var res = await _supa.rpc('request_coach_post_deletion', { p_post_id: postId });
      if (res.error) { showMsg(msgEl, 'Hata: ' + res.error.message, 'error'); return; }
      showMsg(msgEl, 'Silme talebi g\u00f6nderildi.', 'success');
      await loadPosts(); openPublishedDetail(postId);
    } catch (e) { console.error('Deletion request error:', e); showMsg(msgEl, 'Talep g\u00f6nderilemedi.', 'error'); }
  }

  async function cancelDeletionRequest(postId) {
    var msgEl = document.getElementById('cs-pub-msg');
    try {
      var res = await _supa.rpc('cancel_coach_post_deletion_request', { p_post_id: postId });
      if (res.error) { showMsg(msgEl, 'Hata: ' + res.error.message, 'error'); return; }
      showMsg(msgEl, 'Silme talebi iptal edildi.', 'success');
      await loadPosts(); openPublishedDetail(postId);
    } catch (e) { console.error('Cancel deletion error:', e); showMsg(msgEl, '\u0130ptal edilemedi.', 'error'); }
  }

  /* ══ NEW POST ══ */
  async function createNewPost() {
    try {
      var res = await _supa.from('coach_posts').insert({ coach_id: _coachProfile.id, title: '', body: '', category: 'mulakat_ipucu', status: 'draft' }).select('id').maybeSingle();
      if (res.error) { console.error('Create post error:', res.error); return; }
      if (res.data) {
        _newDraftId = res.data.id;
        await loadPosts();
        _draftsAccordionOpen = true;
        _expandedDraftId = res.data.id;
        _activePostId = res.data.id;
        renderDraftsTab();
        /* Auto-expand the new draft row */
        var newRow = document.querySelector('.cs-post-accordion-row[data-post-id="' + res.data.id + '"]');
        if (newRow) newRow.click();
      }
    } catch (e) { console.error('Create post exception:', e); }
  }

  /* ══ HELPERS ══ */
  function buildField(label, type, id, value, maxLen, hint, rows) {
    var wrap = document.createElement('div'); wrap.className = 'cs-field';
    var lbl = document.createElement('label'); lbl.textContent = label; wrap.appendChild(lbl);
    var input;
    if (type === 'textarea') { input = document.createElement('textarea'); if (rows) input.rows = rows; input.textContent = value; }
    else { input = document.createElement('input'); input.type = 'text'; input.value = value; }
    input.id = id; if (maxLen) input.maxLength = maxLen; wrap.appendChild(input);
    if (hint) { var h = document.createElement('div'); h.className = 'cs-field-hint'; h.textContent = hint; wrap.appendChild(h); }
    return wrap;
  }

  function buildSelectField(label, id, options, selected) {
    var wrap = document.createElement('div'); wrap.className = 'cs-field';
    var lbl = document.createElement('label'); lbl.textContent = label; wrap.appendChild(lbl);
    var sel = document.createElement('select'); sel.id = id;
    for (var i = 0; i < options.length; i++) { var opt = document.createElement('option'); opt.value = options[i].value; opt.textContent = options[i].label; if (options[i].value === selected) opt.selected = true; sel.appendChild(opt); }
    wrap.appendChild(sel); return wrap;
  }

  function showMsg(el, text, type) { if (!el) return; el.textContent = text; el.className = 'cs-msg ' + type; if (type !== 'info') setTimeout(function() { el.className = 'cs-msg'; el.textContent = ''; }, 4000); }
  function formatDate(d) { if (!d) return '-'; var dt = new Date(d); return dt.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' }); }
  function makeSpan(text) { var s = document.createElement('span'); s.textContent = text; return s; }
  function clear(el) { while (el && el.firstChild) el.removeChild(el.firstChild); }

  /* Init */
  document.getElementById('cs-logout').addEventListener('click', async function() { await _supa.auth.signOut(); window.location.replace('giris.html'); });
  init();
})();
</script>
</body>
